function pgDash(){
  var tp=D.projects.reduce(function(s,p){return s+(p.plots?p.plots.length:0);},0);
  var sold=D.projects.reduce(function(s,p){return s+(p.plots?p.plots.filter(function(x){return x.status==='sold';}).length:0);},0);
  var booked=D.projects.reduce(function(s,p){return s+(p.plots?p.plots.filter(function(x){return x.status==='booked';}).length:0);},0);
  var cT=D.sales.reduce(function(s,sl){return s+(sl.chainTotal||0);},0);
  var dT=D.sales.reduce(function(s,sl){return s+(sl.defTotal||0);},0);
  var totGaj=Math.round(D.sales.reduce(function(s,sl){return s+(sl.plotGaj||0);},0)*100)/100;
  var nowM=new Date().toISOString().substr(0,7);
  var thisMonClose=D.sales.filter(function(s){return s.closeDate&&s.closeDate.startsWith(nowM);}).length;
  var thisMonBook=D.sales.filter(function(s){return s.bookingDate&&s.bookingDate.startsWith(nowM);}).length;
  var activeAssoc=D.associates.filter(function(a){return !a.name.includes('(Left)');}).length;
  var totalPaid=(D.payments||[]).reduce(function(t,p){return t+(p.paid||p.amount||0);},0);
  var totalPending=Math.max(0,(cT+dT)-totalPaid);
  var rec=D.sales.slice().sort(function(a,b){var da=a.closeDate||a.bookingDate||'';var db=b.closeDate||b.bookingDate||'';return db.localeCompare(da);}).slice(0,5);

  // Row 1: 4 modern KPI cards
  // kpiCard defined at module level
  var html='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px">'
    +kpiCard('#eff6ff','#2563eb','🏗️','Projects',D.projects.length,tp+' total plots')
    +kpiCard('#f0fdf4','#16a34a','✅','Available',(tp-sold-booked),'plots ready')
    +kpiCard('#fffbeb','#d97706','🏠','Sold',sold+'/'+tp,Math.round(sold/Math.max(tp,1)*100)+'% complete')
    +kpiCard('#f5f3ff','#7c3aed','👥','Associates',activeAssoc,'active members')
    +'</div>';

  // Row 2: 4 stat cards
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">'
    +'<div class="stat"><div class="sl">📊 Total Sq.Yd</div><div class="sv" style="color:var(--pu)">'+fmtG(totGaj)+'</div><div style="font-size:10px;color:var(--t3);margin-top:1px">Sq.Yd sold</div></div>'
    +'<div class="stat"><div class="sl">💰 Total Brokerage</div><div class="sv" style="font-size:18px;color:var(--gr)">₹'+fmtL(cT+dT)+'</div><div style="font-size:10px;color:var(--t3);margin-top:1px">₹'+fmt(Math.round(cT+dT))+' total</div></div>'
    +'<div class="stat" style="background:var(--reb);border-color:#F09595"><div class="sl" style="color:var(--re)">⏳ Pending</div><div class="sv" style="font-size:18px;color:var(--re)">₹'+fmtL(totalPending)+'</div><div style="font-size:10px;color:var(--re);margin-top:1px">₹'+fmt(Math.round(totalPending))+' unpaid</div></div>'
    +'<div class="stat"><div class="sl">📅 This Month</div><div class="sv" style="color:var(--am)">'+thisMonClose+'</div><div style="font-size:10px;color:var(--t3);margin-top:1px">closings · '+thisMonBook+' bookings</div></div>'
    +'</div>';

  // ── Slab Upgrades this month ──
  // For each associate: slab at start of this month vs slab now.
  // If higher now, it upgraded during this month.
  var upgrades=[];
  (function(){
    var nowMonth=nowM; // YYYY-MM
    // Build gaj at start-of-month and gaj now, per associate.
    // Replay sales + manual gaj up to (but not including) this month = start gaj.
    // Everything = now gaj.
    var startGaj={},nowGaj={};
    D.associates.forEach(function(a){startGaj[a.id]=0;nowGaj[a.id]=0;});
    // manual gaj
    D.associates.forEach(function(a){
      if(a.gajHistory&&a.gajHistory.length){
        a.gajHistory.forEach(function(h){
          var mk=(h.date||'').substr(0,7);
          nowGaj[a.id]=(nowGaj[a.id]||0)+(h.amount||0);
          if(mk<nowMonth)startGaj[a.id]=(startGaj[a.id]||0)+(h.amount||0);
        });
      } else if(a.manualGaj!=null&&a.manualGaj>0){
        startGaj[a.id]=(startGaj[a.id]||0)+a.manualGaj;
        nowGaj[a.id]=(nowGaj[a.id]||0)+a.manualGaj;
      } else {
        var dl=getDownline(a.id);var ids={};dl.forEach(function(z){ids[z.id]=1;});
        var sd=0;D.sales.forEach(function(s){if(ids[s.sellerId])sd+=(s.plotGaj||0);});
        var inf=Math.max(0,Math.round(((a.totalGaj||0)-sd)*100)/100);
        startGaj[a.id]=(startGaj[a.id]||0)+inf;nowGaj[a.id]=(nowGaj[a.id]||0)+inf;
      }
    });
    // sales gaj → seller + chain
    D.sales.forEach(function(s){
      var mk=(s.closeDate||s.bookingDate||'').substr(0,7);
      var g=s.plotGaj||0;
      getChain(s.sellerId).forEach(function(a){
        nowGaj[a.id]=(nowGaj[a.id]||0)+g;
        if(mk<nowMonth)startGaj[a.id]=(startGaj[a.id]||0)+g;
      });
    });
    D.associates.forEach(function(a){
      var sStart=rOf(startGaj[a.id]||0), sNow=rOf(nowGaj[a.id]||0);
      if(sNow>sStart){
        upgrades.push({name:a.name,id:a.id,fromR:sStart,toR:sNow,
          fromDes:dOf(startGaj[a.id]||0),toDes:dOf(nowGaj[a.id]||0),gaj:nowGaj[a.id]||0});
      }
    });
    upgrades.sort(function(x,y){return y.toR-x.toR;});
  })();

  if(upgrades.length>0){
    html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--gr)">'
      +'<div class="ct" style="margin-bottom:10px">🎉 Slab Upgrades — '+nowM+' ('+upgrades.length+')</div>'
      +'<div class="tw"><table><thead><tr><th>Associate</th><th>From</th><th>To</th><th>Total Gaj</th></tr></thead><tbody>';
    upgrades.forEach(function(u){
      html+='<tr>'
        +'<td><b>'+(isLeft(u.name)?'<span style="color:var(--re)">'+esc(u.name)+'</span>'+leftBadge(u.name):esc(u.name))+'</b></td>'
        +'<td style="font-size:12px;color:var(--t2)">'+u.fromDes+' (₹'+u.fromR+')</td>'
        +'<td style="font-size:12px;color:var(--gr);font-weight:600">'+u.toDes+' (₹'+u.toR+') ⬆</td>'
        +'<td style="color:var(--pu);font-weight:600">'+fmtG(u.gaj)+'</td>'
        +'</tr>';
    });
    html+='</tbody></table></div></div>';
  }

  // Project Progress + Top Associates
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">';

  // Project Progress
  html+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<div class="ct" style="margin:0">🏗️ Project Progress</div>'
    +'<div style="display:flex;gap:6px;font-size:10px;color:var(--t2)">'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:var(--gr);display:inline-block"></span>80%+</span>'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:var(--am);display:inline-block"></span>40%+</span>'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:var(--bl);display:inline-block"></span>Below</span>'
    +'</div></div>';
  D.projects.forEach(function(p){
    var ptotal=p.plots?p.plots.length:0;if(!ptotal)return;
    var psold=p.plots.filter(function(x){return x.status==='sold';}).length;
    var pct=ptotal>0?Math.round((psold/ptotal)*100):0;
    var barColor=pct>=80?'var(--gr)':pct>=40?'var(--am)':'var(--bl)';
    html+='<div style="margin-bottom:10px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
      +'<span style="font-size:12px;font-weight:600">'+p.name+'</span>'
      +'<div style="display:flex;gap:5px;align-items:center">'
      +'<span style="font-size:11px;color:var(--t2)">'+psold+'/'+ptotal+'</span>'
      +'<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;background:'+(pct>=80?'#EAF3DE':pct>=40?'#FAEEDA':'#E6F1FB')+';color:'+(pct>=80?'#3B6D11':pct>=40?'#633806':'#0C447C')+'">'+pct+'%</span>'

  // ── Top 5 Earners (Commission ₹ wise) ──

        +'<div style="width:30px;height:30px;border-radius:50%;background:'+clr[0]+';color:'+clr[1]+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">'+a.name.charAt(0)+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div data-aid="'+a.id+'" onclick="rTab=\'r1\';r1ProfileId=this.dataset.aid;sw(\'reports\')" style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bl);cursor:pointer">'+esc(a.name)+'</div>'
        +'<div style="font-size:11px;color:var(--t2)">'+a.sales+' commissions</div>'
        +'</div>'
        +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">'

        +'<div style="width:70px;height:4px;background:var(--bg3);border-radius:99px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:var(--gr);border-radius:99px"></div></div>'
        +'</div></div>';
    });
  }
  html+='</div>';

  // Recent Sales
  if(rec.length===0){
    html+='<div class="empty" style="padding:36px 20px"><div style="font-size:36px;margin-bottom:10px">📋</div><div style="font-size:15px;font-weight:600;color:var(--tx)">No sales found</div><div style="font-size:12px;color:var(--t3);margin-top:6px">Add your first entry from New Sale</div></div>';

      ||(a.phone||'').includes(q)

window.prvG=function(id){

    pv.style.display='block';

    pv.style.border='1px solid var(--re)';
    pv.style.color='var(--re)';

window.doAG=function(id){
  var el=document.getElementById('eAG');
  var v=parseFloat(el?el.value:0)||0;
  if(isNaN(v)||v===0){toast('Please enter a valid Sq.Yd value!',false);return;}
  var a=D.associates.find(function(x){return x.id===id;});
  if(a&&(a.totalGaj+v)<0){
    toast('⛔ Gaj cannot be negative! Current: '+fmtG(a.totalGaj)+', Input: '+v+', Result: '+(a.totalGaj+v),false);
    return;
  }
  var i=D.associates.findIndex(function(x){return x.id===id;});if(i<0)return;
  var reason=((document.getElementById('eAGReason')||{}).value||'').trim();
  if(!reason){toast('⛔ Reason/Note is required!',false);document.getElementById('eAGReason').focus();return;}
  var mDate=((document.getElementById('eAGDate')||{}).value||'')||new Date().toISOString().slice(0,10);
  var o=rOf(D.associates[i].totalGaj);
  var prevGaj=D.associates[i].totalGaj;
  // increase totalGaj (for slab) — salesGaj unchanged (for Tour/Tab)
  // Track manual portion separately, WITH DATE, so recalc applies it
  // chronologically (a manual add only affects sales on/after its date)
  D.associates[i].manualGaj=Math.round(((D.associates[i].manualGaj||0)+v)*100)/100;
  if(!D.associates[i].gajHistory)D.associates[i].gajHistory=[];
  D.associates[i].gajHistory.push({date:mDate,amount:v,reason:reason,at:new Date().toISOString()});
  D.associates[i].totalGaj=Math.round((D.associates[i].totalGaj+v)*100)/100;
  var n=rOf(D.associates[i].totalGaj);
  logAct('Manual Sq.Yd: '+a.name+' | '+(v>0?'+':'')+v+' Sq.Yd | '+prevGaj+' → '+D.associates[i].totalGaj+' | Reason: '+reason);
  // Manual gaj changes the slab → recompute month-end commissions
  applyAllCommissions();
  saveD();toast(v+' Sq.Yd added! Total: '+D.associates[i].totalGaj+(n>o?' 🎉 Slab Upgrade!':''));closeM();render();
};
window.saveAInfo=function(id){
  if(!can('associates_edit')){toast('Access denied!',false);return;}
  var i=D.associates.findIndex(function(x){return x.id===id;});if(i<0)return;
  var n=document.getElementById('eNm')?document.getElementById('eNm').value.trim():'';
  if(!n){toast('Name is required!',false);return;}
  function gv(eid){var el=document.getElementById(eid);return el?el.value.trim():'';}
  // ── Saari validations PEHLE — field assign BAAD mein (bug fix) ──
  var newParentId=document.getElementById('ePr')?document.getElementById('ePr').value||null:null;
  if(newParentId===id){toast('⛔ An associate cannot be their own upliner!',false);return;}
  var oldParentId=D.associates[i].parentId||null;
  var hasSalesBlock=D.sales.some(function(s){
    return s.sellerId===id||(s.commissions&&s.commissions.some(function(c){return c.id===id;}))||(s.defCommissions&&s.defCommissions.some(function(c){return c.id===id;}));
  });
  if(hasSalesBlock&&(newParentId!==oldParentId)){
    toast('⛔ Upliner cannot be changed — please delete related sales first, then update the upliner.',false);
    return;
  }
  // Duplicate phone check (with confirm — allow karna user ka choice)
  var ePhone=(gv('ePh')||'').replace(/\D/g,'');
  if(ePhone){
    var dupPhone=D.associates.find(function(x){return x.id!==id&&x.phone&&x.phone.replace(/\D/g,'')===ePhone;});
    if(dupPhone){if(!confirm('⚠️ This phone number already exists: "'+dupPhone.name+'" is already registered for!\n\nDo you still want to save?'))return;}
  }
  // Duplicate PAN check (exclude self)
  var pan2=(gv('ePan')||'').trim().toUpperCase();
  if(pan2.length>0){
    var dupPan2=D.associates.find(function(x){return x.id!==id&&x.pan&&x.pan.trim().toUpperCase()===pan2;});
    if(dupPan2){toast('⚠️ This PAN already exists: '+dupPan2.name,false);return;}
  }
  // Duplicate code check (exclude self)
  var code2=(gv('eCd')||'').trim();
  if(code2.length>0){
    var dupCode2=D.associates.find(function(x){return x.id!==id&&x.code&&x.code.trim()===code2;});
    if(dupCode2){toast('⚠️ This Code already exists: '+dupCode2.name,false);return;}
  }
  // ── Validations passed — now assign fields ──
  // capture oldName FIRST — can't compare after update
  var oldName=D.associates[i].name;
  // preserve (Left) tag — editing should not remove it
  var wasLeft=oldName&&oldName.includes('(Left)');
  var cleanN=n.replace(/\(Left\)/gi,'').trim();
  var finalName=wasLeft?(cleanN+' (Left)'):cleanN;
  D.associates[i].name=finalName;
  D.associates[i].fatherName=gv('eFh');
  D.associates[i].phone=gv('ePh');
  D.associates[i].joiningDate=gv('eJd');
  D.associates[i].address=gv('eAdr');
  D.associates[i].code=gv('eCd');
  D.associates[i].location=gv('eLc');
  D.associates[i].rera=gv('eRr');
  D.associates[i].aadhaar=gv('eAdh');
  D.associates[i].pan=gv('ePan');
  D.associates[i].email=gv('eEm');
  D.associates[i].bankingName=gv('eBnm');
  D.associates[i].bankName=gv('eBnk');
  D.associates[i].accNo=gv('eAc');
  D.associates[i].ifsc=gv('eIfs');
  D.associates[i].parentId=newParentId;
  // ── Name change propagation — update in sales, payments, advances ──
  if(oldName!==finalName){
    var n=finalName;
    D.sales.forEach(function(s,si){
      if(s.sellerId===id)D.sales[si].sellerName=n;
      if(s.commissions)s.commissions.forEach(function(c,ci){if(c.id===id)D.sales[si].commissions[ci].name=n;});
      if(s.defCommissions)s.defCommissions.forEach(function(c,ci){if(c.id===id)D.sales[si].defCommissions[ci].name=n;});
    });
    if(D.payments)D.payments.forEach(function(p,pi){if(p.assocId===id)D.payments[pi].assocName=n;});
    if(D.advances)D.advances.forEach(function(a,ai){if(a.assocId===id)D.advances[ai].assocName=n;});
  }
  saveD();logAct('Associate Update: '+n);toast('Info saved successfully! ✓');closeM();render();
};
// ── ASSOCIATE LEFT / TRANSFER ─────────────────────────
// Get top level (L1) ancestor of an associate
function isCompanyNode(name){
  if(!name)return false;
  var n=name.toLowerCase().replace(/[^a-z0-9]/g,'');
  return n.startsWith('truest')||n.includes('company')||n.includes('organisation')||n.includes('organization');
}
function getTopLeader(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a)return null;
  var visited={};
  var chain=[];
  var cur=a;
  while(cur&&!visited[cur.id]){
    visited[cur.id]=true;
    chain.push(cur);
    if(!cur.parentId)break;
    var parent=D.associates.find(function(x){return x.id===cur.parentId;});
    if(!parent)break;
    cur=parent;
  }
  if(chain.length<=1)return null;
  var root=chain[chain.length-1];
  // Skip root if: (1) only 1 root = company node, or (2) name se detect ho
  var rootCount=D.associates.filter(function(x){return !x.parentId;}).length;
  var skipRoot=(rootCount===1)||isCompanyNode(root.name);
  if(skipRoot){
    if(chain.length<2)return null;
    var tl=chain[chain.length-2];
    if(tl.id===assocId)return null;
    return tl;
  }
  if(root.id===assocId)return null;
  return root;
}

window.updateTransferPreview=function(){

  if(!leftId){previewEl.style.display='none';btn.disabled=true;btn.style.opacity='.5';return;}

  if(!leftA){return;}

  var directChildren=D.associates.filter(function(a){return a.parentId===leftId;});

    +'<div><div style="font-weight:700">'+esc(leftA.name)+' <span style="color:var(--re);font-size:11px">(Left)</span></div>'
    +'<div style="font-size:11px;color:var(--t2)">Left Date: <b>'+leftDate+'</b> | Phone: '+( leftA.phone||'—')+' | Gaj: '+leftA.totalGaj+'</div></div>'
    +'</div>'
    +'<div style="font-size:12px;margin-bottom:8px">'
    +'<div>👤 <b>'+esc(leftA.name)+'</b> → <span style="color:var(--re)">"'+esc(leftA.name)+' (Left)"</span></div>'
    +'<div style="margin-top:4px">🔗 <b>'+directChildren.length+' direct children</b> (downline: '+totalDownline.length+') '
    +(newParent?'→ <b style="color:var(--gr)">'+esc(newParent.name)+'</b> ke neeche shift honge':'→ <b style="color:var(--bl)">Top Level</b> will become')
    +'</div></div>';

  // Affected sales warning
  if(affectedSales.length>0){
    html+='<div style="background:var(--reb);border:1px solid var(--re);border-radius:8px;padding:10px 12px;margin-top:8px">'
      +'<div style="font-size:12px;font-weight:700;color:var(--re);margin-bottom:8px">⚠️ '+affectedSales.length+' Sales mein '+esc(leftA.name)+' ka naam hai — Booking date '+leftDate+' ke baad:</div>';
    affectedSales.slice(0,5).forEach(function(s){

window.doTransfer=function(){
  var leftId=(document.getElementById('trLeft')||{}).value||'';
  if(!leftId){toast('Please select an associate!',false);return;}
  var leftDate=(document.getElementById('trLeftDate')||{}).value||new Date().toISOString().slice(0,10);
  var leftA=D.associates.find(function(a){return a.id===leftId;});
  if(!leftA){return;}

  var newParentId=leftA.parentId||null;
  var directChildren=D.associates.filter(function(a){return a.parentId===leftId;});
  var count=directChildren.length;

  // Shift all direct children to leftA's parent.
  // Record parent-change history so chains for sales BEFORE the Left date
  // can be reconstructed (the child was under leftA back then).
  directChildren.forEach(function(child){
    var ci=D.associates.findIndex(function(a){return a.id===child.id;});
    if(ci>=0){
      if(!D.associates[ci].parentHistory)D.associates[ci].parentHistory=[];
      D.associates[ci].parentHistory.push({oldParentId:leftId,newParentId:newParentId,date:leftDate});
      D.associates[ci].parentId=newParentId;
    }
  });

  // Mark left associate name + save left date
  var li=D.associates.findIndex(function(a){return a.id===leftId;});
  if(li>=0){
    if(!D.associates[li].name.includes('(Left)'))
      D.associates[li].name=D.associates[li].name+' (Left)';
    D.associates[li].leftDate=leftDate;
  }

  // ── Affected sales recalculate ──
  var affected=D.sales.filter(function(s){
    if(!s.bookingDate||s.bookingDate<=leftDate)return false;
    var isSeller=s.sellerId===leftId;
    var inChain=s.commissions&&s.commissions.some(function(cm){return cm.id===leftId;});
    var inDef=s.defCommissions&&s.defCommissions.some(function(cm){return cm.id===leftId;});
    return isSeller||inChain||inDef;
  });

  var recalcCount=0;
  affected.forEach(function(s){
    var si=D.sales.findIndex(function(x){return x.id===s.id;});
    if(si<0)return;

    var isSeller=s.sellerId===leftId;

    if(isSeller){
      // Seller left ho gaya — upar wale ko seller banao
      var newSeller=newParentId?D.associates.find(function(a){return a.id===newParentId;}):null;
      if(newSeller){
        D.sales[si].sellerName=newSeller.name;
        D.sales[si].sellerId=newSeller.id;
      }
    }

    // Chain se leftId hatao + gaj reverse
    var oldChain=s.commissions||[];
    var newChain=oldChain.filter(function(cm){return cm.id!==leftId;});
    var sGaj=s.plotGaj||0;

    // Gaj reverse for left associate
    var ai=D.associates.findIndex(function(a){return a.id===leftId;});
    if(ai>=0){
      D.associates[ai].totalGaj=Math.max(0,Math.round(((D.associates[ai].totalGaj||0)-sGaj)*100)/100);
      D.associates[ai].salesGaj=Math.max(0,Math.round(((D.associates[ai].salesGaj||0)-sGaj)*100)/100);
    }

    // Defence se bhi hatao
    var newDef=(s.defCommissions||[]).filter(function(cm){return cm.id!==leftId;});

    D.sales[si].commissions=newChain;
    D.sales[si].defCommissions=newDef;

    // Recalculate totals
    D.sales[si].chainTotal=newChain.reduce(function(t,cm){return t+(cm.total||0);},0);
    D.sales[si].defTotal=newDef.reduce(function(t,cm){return t+(cm.amount||0);},0);

    recalcCount++;
  });

  saveD();
  closeM();
  var msg='✅ '+leftA.name+' marked as Left ('+leftDate+')';
  if(count>0)msg+=', '+count+' downline shifted';
  if(recalcCount>0)msg+=', '+recalcCount+' sales recalculated';
  toast(msg);
  render();
};

window.savePlE=function(projId,plotId,locked){
  var pi=D.projects.findIndex(function(p){return p.id===projId;});if(pi<0)return;
  var pli=D.projects[pi].plots?D.projects[pi].plots.findIndex(function(x){return x.id===plotId;}):-1;if(pli<0)return;
  var pl=D.projects[pi].plots[pli];
  // Only update unlocked fields if sale exists
  if(!locked){
    var newNo=document.getElementById('epNo')?document.getElementById('epNo').value.trim():'';
    if(newNo&&newNo.toUpperCase()!==String(pl.plotNo).toUpperCase()){
      // Duplicate plotNo check (exclude self)
      var dupPl=D.projects[pi].plots.find(function(x){return x.id!==plotId&&String(x.plotNo).toUpperCase()===newNo.toUpperCase();});
      if(dupPl){toast('⚠️ Plot '+newNo+' already exists in this project!',false);return;}
    }
    var v=document.getElementById('epNo');if(v&&v.value.trim())pl.plotNo=v.value.trim();
    v=document.getElementById('epSz');if(v)pl.sizeGaj=parseFloat(v.value)||pl.sizeGaj;
    v=document.getElementById('epSal');if(v)pl.saleableGaj=parseFloat(v.value)||pl.sizeGaj;
  }
  var v=document.getElementById('epFc');if(v)pl.facing=v.value.trim();
  v=document.getElementById('epLc');if(v)pl.location=v.value.trim();
  if(!locked){v=document.getElementById('epSt');if(v)pl.status=v.value;}
  // ── PlotNo change propagation — update in sales too ──
  var updatedNo=D.projects[pi].plots[pli].plotNo;
  if(!locked&&updatedNo){
    D.sales.forEach(function(s,si){if(s.plotId===plotId)D.sales[si].plotNo=updatedNo;});
    if(D.payments)D.payments.forEach(function(p,pi2){if(p.saleId&&D.sales.find(function(s){return s.id===p.saleId&&s.plotId===plotId;}))D.payments[pi2].plotNo=updatedNo;});
  }
  saveD();toast('Plot updated successfully!');closeM();render();
};

    }

  });
};

window.saveRefund=function(btn){
  var assocId=btn.dataset.aid;
  var maxAmt=parseFloat(btn.dataset.maxamt||0);
  var rfDate=(document.getElementById('rfDate')||{}).value||new Date().toISOString().slice(0,10);
  var rfAmt=parseFloat((document.getElementById('rfAmt')||{}).value||'0');
  var rfMode=(document.getElementById('rfMode')||{}).value||'Cash';
  var rfUtr=((document.getElementById('rfUtr')||{}).value||'').trim();
  var rfNote=((document.getElementById('rfNote')||{}).value||'').trim();

  if(!rfAmt||rfAmt<=0){toast('Please enter amount!',false);return;}
  if(rfAmt>maxAmt){toast('Amount cannot exceed the advance balance!',false);return;}

  if(!D.advances)D.advances=[];

  // Advance records mark as refunded (FIFO)
  var remaining=rfAmt;
  var pendAdv=D.advances.filter(function(adv){return adv.assocId===assocId&&adv.status==='pending';});
  pendAdv.forEach(function(adv){
    var ai=D.advances.findIndex(function(x){return x.id===adv.id;});
    if(ai<0||remaining<=0)return;
    if(adv.amount<=remaining){
      D.advances[ai].status='refunded';
      D.advances[ai].refundedAt=rfDate;
      D.advances[ai].refundMode=rfMode;
      D.advances[ai].refundUtr=rfUtr;
      remaining-=adv.amount;
    } else {
      // Partial refund — split
      D.advances[ai].amount=adv.amount-remaining;
      D.advances.push(Object.assign({},adv,{
        id:'_adv'+Date.now()+Math.random().toString(36).substr(2,5),
        amount:remaining,
        status:'refunded',
        refundedAt:rfDate,
        refundMode:rfMode,
        refundUtr:rfUtr
      }));
      remaining=0;
    }
  });

  saveD();
  closeM();
  toast('🔄 Refund ₹'+fmt(rfAmt)+' record ho gaya — Advance balance updated');
  logAct('Refund entry: '+((D.associates.find(function(a){return a.id===assocId;})||{}).name||assocId)+' ₹'+rfAmt);
  render();
};

window.deleteSaleRec=function(saleId){saleId=typeof saleId==='object'?saleId.dataset.sid:saleId;
  if(!can('sales_delete')){toast('You do not have permission to delete sales!',false);return;}
  var s=D.sales.find(function(x){return x.id===saleId;});if(!s)return;
  if(!confirm('Sale will be deleted:\n\nProject: '+s.projName+'\nPlot: '+s.plotNo+'\nSeller: '+s.sellerName+'\n\nThe plot will be set back to Available and the associate Sq.Yd will also be reversed. Confirm?'))return;
  // Restore plot status
  for(var pi=0;pi<D.projects.length;pi++){
    var pli=D.projects[pi].plots?D.projects[pi].plots.findIndex(function(pl){return pl.id===s.plotId;}):- 1;
    if(pli>=0){D.projects[pi].plots[pli].status='available';break;}
  }
  // Restore associate gaj
  var sGaj=s.plotGaj||0;
  if(s.commissions)s.commissions.forEach(function(c){
    var ai=D.associates.findIndex(function(a){return a.id===c.id;});
    if(ai>=0){
      D.associates[ai].totalGaj=Math.max(0,Math.round((D.associates[ai].totalGaj-sGaj)*100)/100);
      D.associates[ai].salesGaj=Math.max(0,Math.round(((D.associates[ai].salesGaj||0)-sGaj)*100)/100);
    }
  });
  // ── Payment reverse — handle payments linked to this sale ──
  if(!D.payments)D.payments=[];
  if(!D.advances)D.advances=[];

  // restore usedInSale advances — mark pending again when sale deleted ho
  D.advances.forEach(function(adv,ai){
    if(adv.usedInSale===saleId&&adv.status==='used'){
      D.advances[ai].status='pending';
      delete D.advances[ai].usedInSale;
      delete D.advances[ai].usedAt;
    }
  });

  // New plot-wise payments (saleId based) — directly advance mein daalo
  // NOTE: sirf un payments ka advance banao jinpe advance adjust NAHI tha
  var linkedPlotPays=D.payments.filter(function(p){return p.saleId===saleId;});
  if(linkedPlotPays.length>0){
    var totalAdvAmt=0;
    linkedPlotPays.forEach(function(p){
      // netPaid = actual cash paid (0 if covered by advance)
      var cashAmt=p.netPaid!=null?p.netPaid:(p.paid||p.amount||0);
      if(cashAmt<=0)return; // purely advance-covered payment — already restored above
      totalAdvAmt+=cashAmt;
      D.advances.push({
        id:'_adv'+Date.now()+Math.random().toString(36).substr(2,5),
        assocId:p.assocId,
        assocName:p.assocName||'',
        amount:cashAmt,
        reason:'Sale delete: '+esc(s.projName)+' Plot '+esc(s.plotNo),
        saleId:saleId,
        createdAt:new Date().toISOString(),
        createdBy:SESSION?SESSION.name:'Admin',
        status:'pending'
      });
    });
    // Delete payment records
    D.payments=D.payments.filter(function(p){return p.saleId!==saleId;});
    if(totalAdvAmt>0)toast('💰 ₹'+fmt(totalAdvAmt)+' advance mein add kiya — Payment Detail se refund kar sakte ho');
  }

  // Old month-based payments (saleIds array) — adjust amount
  D.payments.forEach(function(pay,pi){
    if(!pay.saleIds||!pay.saleIds.includes(saleId))return;
    var salePays=(s.commissions||[]).filter(function(cm){return cm.id===pay.assocId;});
    var saleAmt=salePays.reduce(function(t,cm){return t+(cm.total||0);},0);
    var defPays=(s.defCommissions||[]).filter(function(cm){return cm.id===pay.assocId;});
    saleAmt+=defPays.reduce(function(t,cm){return t+(cm.amount||0);},0);
    if(saleAmt<=0)return;
    D.payments[pi].saleIds=pay.saleIds.filter(function(id){return id!==saleId;});
    D.payments[pi].amount=Math.max(0,(pay.amount||0)-saleAmt);
    D.payments[pi].pending=Math.max(0,(pay.pending||0)-saleAmt);

  });
  // remove zero-amount payments after loop (splice in forEach shifts index)
  D.payments=D.payments.filter(function(p){if(!p.saleIds)return true;return (p.amount||0)>0;});

  // Soft delete
  if(!D.deleted)D.deleted={associates:[],sales:[],projects:[]};
  if(!D.deleted.sales)D.deleted.sales=[];
  if(s)D.deleted.sales.push(Object.assign({},s,{deletedAt:new Date().toISOString(),deletedBy:SESSION?SESSION.name:'Admin'}));
  D.sales=D.sales.filter(function(x){return x.id!==saleId;});
  // Recompute month-end commissions after delete (month slab may drop)
  applyAllCommissions();
  saveD();logAct('Sale Soft Delete: '+(s?s.projName+' | Plot '+s.plotNo:''));toast('Sale deleted! You can restore it from Settings. ✓');closeM();render();
};

function rpt1(){
  if(!D.associates.length)return '<div class="empty">No associates found</div>';
  var PER_PAGE=10;

  function buildTree(pid,lv){
    return D.associates.filter(function(a){return pid===null?!a.parentId:a.parentId===pid;})
      .sort(function(a,b){return a.name.localeCompare(b.name);})
      .reduce(function(acc,a){return acc.concat([Object.assign({},a,{_l:lv})],buildTree(a.id,lv+1));},[]); 
  }
  var tree=buildTree(null,0);
  var clrs=['var(--bl)','var(--gr)','var(--am)','var(--pu)'];
  var bgs=['var(--blb)','var(--grb)','var(--amb)','var(--pub)'];

  // ── Top-level legs (L1 associates) ──
  var topLegs=D.associates.filter(function(a){return !a.parentId;});

  // ── Helper: get all ancestor IDs of a node ──
  function getAncestors(id){
    var ids=[];
    var cur=D.associates.find(function(a){return a.id===id;});
    while(cur&&cur.parentId){
      ids.push(cur.parentId);
      cur=D.associates.find(function(a){return a.id===cur.parentId;});
    }
    return ids;
  }
  // ── Helper: get all descendant IDs of a node ──
  function getDescendants(id){
    var ids=[];
    function walk(pid){
      D.associates.filter(function(a){return a.parentId===pid;}).forEach(function(a){
        ids.push(a.id);walk(a.id);
      });
    }
    walk(id);
    return ids;
  }

  var html='';
  r1Mode='total'; // Always total in Associate Info

  // ══════════════════════════════
  // MODE: TOTAL ASSOCIATES
  // ══════════════════════════════
  if(r1Mode==='total'){
    var filtered=r1F?tree.filter(function(a){
      var q=r1F.toLowerCase();
      return a.name.toLowerCase().includes(q)
        ||(a.phone||'').includes(q)
        ||(a.rera||'').toLowerCase().includes(q)
        ||(a.code||'').toLowerCase().includes(q)
        ||(a.pan||'').toLowerCase().includes(q);
    }).sort(function(a,b){return a.name.localeCompare(b.name);}):tree;

    var totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
    if(r1P>totalPages)r1P=1;
    var pageData=filtered.slice((r1P-1)*PER_PAGE, r1P*PER_PAGE);

    // Search bar
    var leftCount=(D.associates.filter(function(a){return isLeft(a.name);}).length);
    html+='<div class="card" style="margin-bottom:10px;padding:10px 14px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">'
      +'<div style="display:flex;gap:6px">'
      +(leftCount>0?'<button class="btn bsm" style="background:var(--reb);color:var(--re);border:1px solid var(--re);font-weight:700" onclick="r1LeftPage=true;render()">🚪 Left Associates ('+leftCount+')</button>':'')
      +'<button class="btn bbl bsm" onclick="expR1()">📥 Excel Export</button>'
      +'</div></div>'
      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      +'<input id="r1Search" type="text" autocomplete="off" placeholder="Search..." '
      +'value="'+r1F+'" oninput="doR1Search(this.value)" '
      +'style="flex:1;min-width:200px;font-size:13px;padding:8px 12px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)"/>'
      +(r1F?'<button class="btn bgh bsm" onclick="r1F=String();r1P=1;render()">✕ Clear</button>':'')
      +'<span style="font-size:12px;color:var(--t2);white-space:nowrap">'+filtered.length+' active</span>'
      +'</div></div>';

    html+=r1Table(pageData,r1P,PER_PAGE,totalPages,filtered.length,clrs,bgs,'','');
    return html;
  }

  // ══════════════════════════════
  // MODE: LEG WISE
  // ══════════════════════════════

  // Leg selector dropdown
  var legOpts='<option value="">— Select Leg (Top Associate) —</option>';
  topLegs.forEach(function(a){
    var downCount=getDescendants(a.id).length;
    legOpts+='<option value="'+a.id+'" '+(r1LegId===a.id?'selected':'')+'>'+esc(a.name)+' ('+downCount+' downline)</option>';
  });

  html+='<div class="card" style="margin-bottom:10px;padding:12px 14px">'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
    +'<div class="fld" style="flex:1;min-width:200px;margin:0"><label>Select Leg</label>'
    +'<select onchange="setR1Leg(this.value)">'+legOpts+'</select></div>';

  if(r1LegId){
    // Focus associate dropdown - show everyone in this leg
    var legTree=[];
    function buildLegTree(pid,lv){
      D.associates.filter(function(a){return pid===null?a.id===r1LegId:a.parentId===pid;})
        .forEach(function(a){
          legTree.push(Object.assign({},a,{_l:lv}));
          buildLegTree(a.id,lv+1);
        });
    }
    buildLegTree(null,0);

    var focusOpts='<option value="">— Highlight an Associate —</option>';
    legTree.forEach(function(a){
      var indent='&nbsp;'.repeat(a._l*2);
      focusOpts+='<option value="'+a.id+'" '+(r1FocusId===a.id?'selected':'')+'>'+indent+esc(a.name)+'</option>';
    });

    html+='<div class="fld" style="flex:1;min-width:200px;margin:0"><label>Focus Associate (optional)</label>'
      +'<select onchange="setR1Focus(this.value)">'+focusOpts+'</select></div>';
  }

  html+='<button class="btn bbl bsm" onclick="expR1()" style="align-self:flex-end">📥 Excel</button>'
    +'</div></div>';

  if(!r1LegId){
    html+='<div class="empty" style="padding:30px;text-align:center">👆 Select a leg from the dropdown above</div>';
    return html;
  }

  // Build leg tree
  var legData=[];
  function buildLeg(pid,lv){
    D.associates.filter(function(a){return pid===null?a.id===r1LegId:a.parentId===pid;})
      .forEach(function(a){
        legData.push(Object.assign({},a,{_l:lv}));
        buildLeg(a.id,lv+1);
      });
  }
  buildLeg(null,0);

  // If focus selected: show upline + focus + downline, rest dimmed
  var ancestorIds=r1FocusId?getAncestors(r1FocusId):[];
  var descendantIds=r1FocusId?getDescendants(r1FocusId):[];

  // Stats bar
  var legGaj=legData.reduce(function(s,a){return s+(a.totalGaj||0);},0);
  var legSales=D.sales.filter(function(s){
    return legData.some(function(a){return a.id===s.sellerId;});
  }).length;
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
    +'<div class="stat" style="flex:1;min-width:100px"><div class="sl">Associates in Leg</div><div class="sv" style="color:var(--bl)">'+legData.length+'</div></div>'
    +'<div class="stat" style="flex:1;min-width:100px"><div class="sl">Total Sq.Yd</div><div class="sv" style="color:var(--gr)">'+legGaj+'</div></div>'
    +'<div class="stat" style="flex:1;min-width:100px"><div class="sl">Total Sales</div><div class="sv" style="color:var(--am)">'+legSales+'</div></div>'
    +(r1FocusId?'<div class="stat" style="flex:1;min-width:100px;border:2px solid var(--am)"><div class="sl">Upline</div><div class="sv" style="color:var(--am)">'+ancestorIds.length+'</div></div>':'')
    +(r1FocusId?'<div class="stat" style="flex:1;min-width:100px;border:2px solid var(--gr)"><div class="sl">Downline</div><div class="sv" style="color:var(--gr)">'+descendantIds.length+'</div></div>':'')
    +'</div>';

  var totalPages=Math.max(1,Math.ceil(legData.length/PER_PAGE));
  if(r1P>totalPages)r1P=1;
  var pageData=legData.slice((r1P-1)*PER_PAGE,r1P*PER_PAGE);

  html+=r1Table(pageData,r1P,PER_PAGE,totalPages,legData.length,clrs,bgs,r1FocusId,ancestorIds);
  return html;
}

// ── Shared table renderer ──
function r1Table(pageData,page,PER_PAGE,totalPages,totalCount,clrs,bgs,focusId,ancestorIds){
  var html='<div class="card" style="padding:0;overflow:hidden">'
    +'<div style="padding:10px 14px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">'
    +'<div class="ct" style="margin:0">👥 Associate Directory</div>'
    +'<span style="font-size:12px;color:var(--t2)">Page '+page+' / '+totalPages+' &nbsp;('+totalCount+' total)</span>'
    +'</div>'
    +'<div class="tw" style="border:none;border-radius:0"><table><thead><tr>'
    +'<th>#</th><th>Level</th><th>Name</th><th>Father/Husband</th><th>Phone</th><th>RERA No.</th><th>Upliner</th><th>Joining</th>'
    +'</tr></thead><tbody id="r1TBody">';

  if(pageData.length===0){
    html+='<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--t3)">No associate found</td></tr>';
  } else {
    pageData.forEach(function(a,i){
      var par=a.parentId?D.associates.find(function(p){return p.id===a.parentId;}):null;
      var li=Math.min(a._l,3);
      var arr='&nbsp;'.repeat(a._l*3)+(a._l>0?'↳ ':'');
      var rowNum=(page-1)*PER_PAGE+i+1;
      var cs=slabOf(a.totalGaj);
      var waNum=a.phone?a.phone.replace(/\D/g,''):'';
      if(waNum.length===10)waNum='91'+waNum;

      // Highlight logic
      var isFocus=focusId&&a.id===focusId;
      var isAncestor=focusId&&ancestorIds.indexOf(a.id)>=0;
      var rowStyle='';
      if(isFocus){
        rowStyle='background:linear-gradient(90deg,rgba(239,159,39,.25),transparent);outline:2px solid var(--am);';
      } else if(isAncestor){
        rowStyle='background:rgba(53,167,120,.08);';
      } else if(focusId){
        rowStyle='opacity:.45;';
      }

      html+='<tr style="'+rowStyle+'">'
        +'<td style="color:var(--t3)">'+rowNum+'</td>'
        +'<td><span class="badge" style="background:'+bgs[li]+';color:'+clrs[li]+'">L'+(a._l+1)+'</span></td>'
        +'<td>'+arr
          +(isFocus?'<span style="background:var(--am);color:#fff;padding:1px 6px;border-radius:4px;font-size:11px;margin-right:4px;font-weight:700">★ Focus</span>':'')
          +(isAncestor?'<span style="background:var(--grb);color:var(--gr);padding:1px 6px;border-radius:4px;font-size:11px;margin-right:4px">↑ Upline</span>':'')
          +'<b data-aid="'+a.id+'" onclick="pushHistory();r1ProfileId=this.dataset.aid;r1DownPage=0;render()" style="cursor:pointer;color:var(--bl)">'+esc(a.name)+'</b>'
          +(function(){var tl=getTopLeader(a.id);return tl&&tl.id!==a.id?'<span style="font-size:10px;color:var(--t2);margin-left:5px">👑 '+esc(tl.name)+'</span>':'';}())
        +'</td>'
        +'<td style="font-size:12px">'+(a.fatherName?esc(a.fatherName):'—')+'</td>'
        +'<td>'+(a.phone?'<a href="https://wa.me/'+waNum+'" target="_blank" style="color:var(--gr);text-decoration:none;font-size:13px" title="WhatsApp">📱 '+esc(a.phone)+'</a>':'—')+'</td>'
        +'<td style="color:var(--bl);font-size:12px">'+(a.rera?esc(a.rera):'—')+'</td>'
        +'<td style="font-size:12px;color:var(--t2)">'+(par?esc(par.name):'— Top Level —')+'</td>'
        +'<td style="font-size:12px">'+(a.joiningDate?esc(a.joiningDate):'—')+'</td>'
        +'</tr>';
    });
  }
  html+='</tbody></table></div>';

  html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:.5px solid var(--bd);flex-wrap:wrap;gap:8px">'
    +'<span style="font-size:13px;color:var(--t2)">'+totalCount+' associates · Page '+page+' / '+totalPages+'</span>'
    +'<div style="display:flex;align-items:center;gap:5px;position:relative">'
    +'<button class="btn bgh bsm" onclick="if(r1P>1){r1P--;doR1Search(r1F,true)}" '+(page<=1?'disabled':'')+'>← Prev</button>'
    +'<div style="position:relative">'
    +'<button class="btn bbl bsm" onclick="toggleR1Pag()" style="min-width:110px">Page '+page+' / '+totalPages+' ▾</button>'
    +'<div id="r1PagDrop" style="display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--bg);border:.5px solid var(--bd);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px;z-index:200;min-width:200px">'
    +'<div style="font-size:11px;color:var(--t3);padding:2px 4px 6px;border-bottom:.5px solid var(--bd);margin-bottom:6px">Go to page</div>'
    +'<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px" id="r1PagGrid"></div>'
    +'</div></div>'
    +'<button class="btn bgh bsm" onclick="if(r1P<'+totalPages+'){r1P++;doR1Search(r1F,true)}" '+(page>=totalPages?'disabled':'')+'>Next →</button>'
    +'</div></div>';
  html+='</div>';
  return html;
}

function doR1Search(q,keepPage){
  r1F=q;
  if(!keepPage)r1P=1;
  // Update table body without full re-render to keep focus
  var PER_PAGE=10;
  function buildTree(pid,lv){
    return D.associates.filter(function(a){return pid===null?!a.parentId:a.parentId===pid;}).reduce(function(acc,a){return acc.concat([Object.assign({},a,{_l:lv})],buildTree(a.id,lv+1));},[]); 
  }
  var tree=buildTree(null,0);
  var filtered=q?tree.filter(function(a){
    var ql=q.toLowerCase();
    return a.name.toLowerCase().includes(ql)||(a.phone||'').includes(ql)||(a.rera||'').toLowerCase().includes(ql)||(a.code||'').toLowerCase().includes(ql)||(a.pan||'').toLowerCase().includes(ql);
  }).sort(function(a,b){return a.name.localeCompare(b.name);}):tree;
  var totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(r1P>totalPages)r1P=1;
  var pageData=filtered.slice((r1P-1)*PER_PAGE, r1P*PER_PAGE);
  var clrs=['var(--bl)','var(--gr)','var(--am)','var(--pu)'];
  var bgs=['var(--blb)','var(--grb)','var(--amb)','var(--pub)'];
  var tbody=document.getElementById('r1TBody');
  if(!tbody)return;
  var html='';
  if(pageData.length===0){
    html='<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--t3)">No results found for "'+q+'"</td></tr>';
  } else {
    pageData.forEach(function(a,i){
      var par=a.parentId?D.associates.find(function(p){return p.id===a.parentId;}):null;
      var li=Math.min(a._l,3);
      var arr='&nbsp;'.repeat(a._l*3)+(a._l>0?'↳ ':'');
      var cs=slabOf(a.totalGaj);
      var waNum=a.phone?a.phone.replace(/\D/g,''):'';
      if(waNum.length===10)waNum='91'+waNum;
      var rowNum=(r1P-1)*PER_PAGE+i+1;
      html+='<tr>'
        +'<td style="color:var(--t3)">'+rowNum+'</td>'
        +'<td><span class="badge" style="background:'+bgs[li]+';color:'+clrs[li]+'">L'+(a._l+1)+'</span></td>'
        +'<td>'+arr+'<b data-aid="'+a.id+'" onclick="pushHistory();r1ProfileId=this.dataset.aid;r1DownPage=0;render()" style="cursor:pointer;color:var(--bl)">'+esc(a.name)+'</b>'
          +(function(){var tl=getTopLeader(a.id);return tl&&tl.id!==a.id?'<span style="font-size:10px;color:var(--t2);margin-left:5px">👑 '+esc(tl.name)+'</span>':'';}())
          +'</td>'
        +'<td style="font-size:12px">'+(a.fatherName?esc(a.fatherName):'—')+'</td>'
        +'<td>'+(a.phone?'<a href="https://wa.me/'+waNum+'" target="_blank" style="color:var(--gr);text-decoration:none;font-size:13px" title="WhatsApp">📱 '+esc(a.phone)+'</a>':'—')+'</td>'
        +'<td style="color:var(--bl);font-size:12px">'+(a.rera?esc(a.rera):'—')+'</td>'
        +'<td style="font-size:12px;color:var(--t2)">'+(par?esc(par.name):'— Top Level —')+'</td>'
        +'<td style="font-size:12px">'+(a.joiningDate?esc(a.joiningDate):'—')+'</td>'
        +'</tr>';
    });
  }
  tbody.innerHTML=html;
  // Update count
  var cnt=document.querySelector('#r1Search')?.parentElement?.parentElement?.querySelector('span');
  if(cnt)cnt.textContent=filtered.length+' associates';
}


// ── Pagination bar helper ──

  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:.5px solid var(--bd);flex-wrap:wrap;gap:8px">'

    +'<button class="btn bgh bsm" '+(cur>=total?'disabled':('onclick="'+onNext+'render()"'))+'>Next →</button>'

}

function rpt2(){
  var allA=D.associates;
  if(!D.sales.length)return '<div class="empty">No sales yet hai</div>';

  // ── Build month list ──
  var monthSet={};
  D.sales.forEach(function(s){var d=getFilterDate(s);if(d&&d.length>=7)monthSet[d.substr(0,7)]=1;});
  var months=Object.keys(monthSet).sort().reverse();

  // ── Filter state: r2F = assoc id, r2M = month ──
  var sel=r2F?allA.find(function(a){return a.id===r2F;}):null;

  // ── Apply filters ──
  var filtered=D.sales.filter(function(s){
    if(r2F){
      var dl=getDownline(r2F);
      var dlIds=new Set(dl.map(function(x){return x.id;}));
      var inChain=s.commissions&&s.commissions.some(function(c){return dlIds.has(c.id);});
      if(!inChain)return false;
    }
    if(r2M){var d=getFilterDate(s);if(!(d&&d.startsWith(r2M)))return false;}
    return true;
  });

  // ── Stats ──
  var totGaj=Math.round(filtered.reduce(function(s,sl){return s+sl.plotGaj;},0)*100)/100;
  var totChain=filtered.reduce(function(s,sl){return s+(sl.chainTotal||0);},0);
  var totDef=filtered.reduce(function(s,sl){return s+(sl.defTotal||0);},0);

  // ── Associate opts ──
  var aOpts='<option value="">— All Associates —</option>';
  allA.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(a){
    var par=a.parentId?allA.find(function(p){return p.id===a.parentId;}):null;
    aOpts+='<option value="'+a.id+'"'+(r2F===a.id?' selected':'')+'>'+a.name+' '+(par?'(↑'+par.name+')':'(Top)')+' | '+dOf(a.totalGaj)+'</option>';
  });

  // ── Month opts ──
  var mOpts='<option value="">— All Months —</option>';

    +'<div class="fld" style="flex:1;min-width:200px;margin:0"><label>Associate Filter</label>'
    +'<select onchange="r2F=this.value;r2P=1;render()">'+aOpts+'</select></div>'
    +((r2F||r2M)?'<button class="btn bgh bsm" onclick="r2F=\'\';r2M=\'\';r2P=1;render()">✕ Clear</button>':'')
    +'<button class="btn bbl bsm" onclick="expR2()" style="align-self:flex-end">📥 Excel Export</button>'
    +'</div>'
    // Summary stats
    +'<div class="g4" style="margin-top:10px">'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Total Sales</div><div class="sv">'+filtered.length+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Total Sq.Yd</div><div class="sv" style="color:var(--pu)">'+fmtG(totGaj)+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Total Brokerage</div><div class="sv" style="font-size:15px;color:var(--gr)">₹'+fmtL(totChain+totDef)+'</div></div>'
    +'</div></div>';

  // ── Project-wise Summary Cards ──
  var projMap={};

// ── ASSOC WISE ──────────────────────────────────────────
function rpt4Assoc(){
  var assocMap={};
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    if(r4MonF){var d=getFilterDate(sl);if(!(d&&d.startsWith(r4MonF)))return;}
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(r4AssocF&&c.id!==r4AssocF)return;
      if(!c.total||c.total<=0)return;
      if(!assocMap[c.id])assocMap[c.id]={id:c.id,name:c.name,chain:0,def:0,sales:[],lastDate:''};
      assocMap[c.id].chain+=c.total;
      assocMap[c.id].sales.push({sl:sl,type:'Chain',amt:c.total});
      if((sl.bookingDate||'')>(assocMap[c.id].lastDate||''))assocMap[c.id].lastDate=sl.bookingDate||'';
    });
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(r4AssocF&&c.id!==r4AssocF)return;
      if(!c.amount||c.amount<=0)return;
      if(!assocMap[c.id])assocMap[c.id]={id:c.id,name:c.name,chain:0,def:0,sales:[],lastDate:''};
      assocMap[c.id].def+=c.amount;
      assocMap[c.id].sales.push({sl:sl,type:'Defence D'+c.depth,amt:c.amount});
    });
  });
  var list=Object.values(assocMap).filter(function(a){return (a.chain+a.def)>0;}).sort(function(a,b){return (b.chain+b.def)-(a.chain+a.def);});
  var totChain=list.reduce(function(s,a){return s+a.chain;},0);
  var totDef=list.reduce(function(s,a){return s+a.def;},0);
  if(!list.length)return '<div class="empty">No brokerage data for this filter</div>';

  var html='<div class="g4" style="margin-bottom:10px">'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Associates</div><div class="sv">'+list.length+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Total Brokerage</div><div class="sv" style="font-size:15px;color:var(--gr)">₹'+fmtL(totChain+totDef)+'</div></div>'
    +'</div>';

  html+='<div class="card" style="padding:0"><div class="tw" style="border:none;border-radius:0"><table><thead><tr>'
    +'<th>#</th><th>Associate</th><th>Phone</th><th>RERA</th><th>Designation</th>'
    +'<th>Sales</th><th>Total ₹</th><th style="color:var(--gr)">Paid ₹</th><th style="color:var(--re)">Pending ₹</th>'
    +'</tr></thead><tbody>';
  // Store sales data for popup — serialize to global
  var salesLookup={};
  list.forEach(function(a){salesLookup[a.id]=a.sales;});
  window._broSalesLookup=salesLookup;

  // ── Pagination rpt4Assoc ──
  var R4A_PER=15;
  var r4ATotalPages=Math.max(1,Math.ceil(list.length/R4A_PER));
  if(r4AP>r4ATotalPages)r4AP=1;
  var r4APageData=list.slice((r4AP-1)*R4A_PER,r4AP*R4A_PER);

  r4APageData.forEach(function(a,i){
    var aObj=D.associates.find(function(x){return x.id===a.id;});
    var rowNum=(r4AP-1)*R4A_PER+i+1;
    html+='<tr style="background:'+(i%2===0?'var(--bg)':'var(--bg3)')+'"><td style="color:var(--t3)">'+rowNum+'</td>'
      +'<td><b data-aid="'+a.id+'" onclick="pushHistory();rTab=\'r1\';r1ProfileId=this.dataset.aid;render()" style="cursor:pointer;color:var(--bl)">'+a.name+'</b></td>'
      +'<td>'+(aObj?aObj.phone||'—':'—')+'</td>'
      +'<td style="color:var(--bl);font-size:12px">'+(aObj?aObj.rera||'—':'—')+'</td>'
      +'<td style="font-size:11px">'+(aObj?dOf(aObj.totalGaj):'—')+'</td>'
      +'<td style="text-align:center">'
      +'<button class="btn bbl2" data-aid="'+a.id+'" onclick="showBroSales(this.dataset.aid,\''+a.name+'\')" '
      +'style="background:var(--blb);color:var(--bl);border:1px solid var(--bl);padding:3px 10px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer">'
      +a.sales.length+' 🔍</button>'
      +'</td>'
      +'<td style="color:var(--gr);font-weight:700">₹'+fmtL(a.chain+a.def)+'</td>'
      +'<td style="color:var(--gr);font-size:12px">'+( a.paid>0?'₹'+fmtL(a.paid):'—')+'</td>'
      +'<td style="color:'+(a.pending>0?'var(--re)':'var(--t3)')+';font-weight:'+(a.pending>0?'700':'400')+'">'+( a.pending>0?'₹'+fmtL(a.pending):'✅')+'</td>'
      +'</tr>';
  });
  html+='<tr style="background:var(--bg3);font-weight:700;border-top:2px solid var(--bd)"><td colspan="6" style="padding:8px 10px">TOTAL</td>'
    +'<td style="padding:8px 10px;color:var(--bl)">₹'+fmt(totChain)+'</td>'
    +'<td style="padding:8px 10px;color:var(--pu)">₹'+fmt(totDef)+'</td>'
    +'<td style="padding:8px 10px;color:var(--gr);font-size:15px">₹'+fmt(totChain+totDef)+'</td><td></td></tr>'
    +'</tbody></table></div>'
    +pagBar(r4AP,r4ATotalPages,'r4AP--;','r4AP++;',list.length+' associates · '+((r4AP-1)*R4A_PER+1)+'-'+Math.min(r4AP*R4A_PER,list.length)+' showing')
    +'</div>';
  return html;
}

function rpt4Plot(){
  var filtered=D.sales.filter(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return false;
    if(r4MonF){var d=getFilterDate(sl);if(!(d&&d.startsWith(r4MonF)))return false;}
    // Only show if has brokerage amount
    if(((sl.chainTotal||0)+(sl.defTotal||0))<=0)return false;
    return true;
  });
  if(!filtered.length)return '<div class="empty">No sales found for this filter</div>';
  var totChain=filtered.reduce(function(s,sl){return s+(sl.chainTotal||0);},0);

window.saveInvoicePDF=function(projName,plotNo){
  var content=document.getElementById('invoicePrint');
  if(!content)return;
  var fname='Brokerage_'+(projName||'').replace(/[^a-zA-Z0-9]/g,'_')+'_Plot_'+(plotNo||'').replace(/[^a-zA-Z0-9]/g,'_')+'.html';
  var fullHtml='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+fname+'</title>'
    +'<style>body{font-family:Arial,sans-serif;padding:30px;font-size:13px;color:#222}'
    +'table{width:100%;border-collapse:collapse;margin-bottom:16px}'
    +'th{background:#1a6fc4;color:#fff;padding:9px 12px;text-align:left;font-size:12px}'
    +'td{padding:8px 12px;border-bottom:1px solid #ddd}'
    +'tr:nth-child(even){background:#f9f9f9}'
    +'.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}'
    +'</style></head><body>'+content.innerHTML+'</body></html>';
  var blob=new Blob([fullHtml],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✅ '+fname+' save ho raha hai!');
};

window.expSingleAssoc=function(assocId){
  if(!window.XLSX){toast('XLSX library not loaded',false);return;}
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a){return;}
  var wb=XLSX.utils.book_new();
  var rows=[['#','Month','Project','Plot No','Plot Size','Saleable (Sq.Yd)','Seller','Buyer','Booking Date','Closing Date','Brokerage (Rs.)']];
  var ri=0;
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    var mon=getFilterDate(sl).substr(0,7)||'—';
    if(r4MonF&&!mon.startsWith(r4MonF))return;
    var plotSize=sl.plotSizeGaj||sl.plotGaj;
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(c.id!==assocId||!c.total||c.total<=0)return;
      ri++;rows.push([ri,mon,sl.projName,sl.plotNo,plotSize,sl.plotGaj,sl.sellerName||'',sl.partyName||'',sl.bookingDate||'',sl.closeDate||'',c.total]);
    });
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(c.id!==assocId||!c.amount||c.amount<=0)return;
      ri++;rows.push([ri,mon,sl.projName,sl.plotNo,plotSize,sl.plotGaj,sl.sellerName||'',sl.partyName||'',sl.bookingDate||'',sl.closeDate||'',c.amount]);
    });
  });
  if(!ri){toast('No data found!',false);return;}
  var total=rows.slice(1).reduce(function(s,r){return s+(r[10]||0);},0);
  rows.push(['','','TOTAL','','','','','','','',total]);
  var ws=XLSX.utils.aoa_to_sheet(rows);
  xlStyle(wb,ws,[{wch:4},{wch:10},{wch:24},{wch:10},{wch:13},{wch:13},{wch:22},{wch:22},{wch:13},{wch:13},{wch:16}]);
  XLSX.utils.book_append_sheet(wb,ws,a.name.substr(0,31));
  XLSX.writeFile(wb,'Brokerage_'+a.name.replace(/[^a-zA-Z0-9]/g,'_')+(r4MonF?'_'+r4MonF:'')+'.xlsx');
  toast('✅ '+a.name+' ka Excel ready! '+ri+' rows 📊');
};

window.openAssocInvoice=function(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a)return;
  var allSales=D.sales.filter(function(s){
    var inChain=s.commissions&&s.commissions.some(function(c){return c.id===assocId&&c.total>0;});
    var inDef=s.defCommissions&&s.defCommissions.some(function(c){return c.id===assocId&&c.amount>0;});
    return inChain||inDef;
  });
  if(!allSales.length){toast(a.name+' has no brokerage found!',false);return;}
  var monthSet={};
  allSales.forEach(function(s){var d=getFilterDate(s);if(d&&d.length>=7)monthSet[d.substr(0,7)]=1;});
  var months=Object.keys(monthSet).sort().reverse();
  var mOpts='<option value="">— Select Month (Zaroori) —</option>';
  months.forEach(function(m){mOpts+='<option value="'+m+'">'+m+'</option>';});

  // Build initial project opts (all projects for this associate)
  function buildProjOpts(mon){
    var salesForMon=mon?allSales.filter(function(s){
      var d=getFilterDate(s); return d&&d.startsWith(mon);
    }):allSales;
    var projSet={};
    salesForMon.forEach(function(s){projSet[s.projId]={id:s.projId,name:s.projName};});
    var projs=Object.values(projSet);
    var opts='<option value="">— All Projects —</option>';
    projs.forEach(function(p){
      var proj=D.projects.find(function(x){return x.id===p.id;});
      opts+='<option value="'+p.id+'">'+p.name+(proj&&proj.companyName?' | '+proj.companyName:'')+'</option>';
    });
    return opts;
  }

  // Store allSales globally for dynamic update
  window._invAllSales=allSales;
  window._invAssocId=assocId;

  openM('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<b style="font-size:15px">Invoice — '+a.name+'</b>'
    +'<button class="btn bgh bsm" onclick="closeM()">X</button></div>'
    +'<div class="info ibl" style="margin-bottom:12px;font-size:12px">📅 Month list <b>'+(dateMode==='closing'?'Closing Date':'Booking Date')+'</b> generated from</div>'
    +'<div class="g2" style="margin-bottom:14px">'
    +'<div class="fld"><label>Month *</label>'
    +'<select id="aiMon" onchange="_updateInvProj()">'+mOpts+'</select></div>'
    +'<div class="fld"><label>Project (Optional)</label><select id="aiProj">'+buildProjOpts('')+'</select></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn bgr" onclick="printAssocInvoice(\''+assocId+'\')">Generate Invoice</button>'
    +'<button class="btn bgh" onclick="closeM()">Cancel</button>'
    +'</div>');
};
window.printAssocInvoice=function(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a)return;
  var mon=(document.getElementById('aiMon')||{}).value||'';
  var projF=(document.getElementById('aiProj')||{}).value||'';
  if(!mon){toast('Month is required!',false);return;}
  var sales=D.sales.filter(function(s){
    if(projF&&s.projId!==projF)return false;

function rpt4Leg(){
  // ── Filters ──────────────────────────────────────
  // r4MonF, r4ProjF already exist; add sector filter var
  var secF=window.r4SecF||'';
  var assocF=window.r4LegAssocF||'';

  // Build unique location/sector list from associates
  var secSet={};
  D.associates.forEach(function(a){if(a.location)secSet[a.location.trim()]=1;});
  var sectors=Object.keys(secSet).sort();

  // Extra filters HTML (sector + specific associate)
  var secOpts='<option value="">— All Sectors/Location —</option>';
  sectors.forEach(function(s){secOpts+='<option value="'+s+'"'+(secF===s?' selected':'')+'>'+s+'</option>';});

  var aOpts='<option value="">— All Associates —</option>';
  D.associates.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(a){
    if(secF&&(a.location||'').trim()!==secF)return;
    aOpts+='<option value="'+a.id+'"'+(assocF===a.id?' selected':'')+'>'+a.name+(a.location?' ('+a.location+')':'')+'</option>';
  });

  var html='<div class="g4" style="margin-bottom:10px;gap:8px">'
    +'<div class="fld" style="margin:0"><label>Sector / Location</label>'
    +'<select onchange="window.r4SecF=this.value;window.r4LegAssocF=\'\';render()">'
    +secOpts+'</select></div>'
    +'<div class="fld" style="margin:0"><label>Associate</label>'
    +'<select onchange="window.r4LegAssocF=this.value;render()">'
    +aOpts+'</select></div>'
    +'</div>';

  // ── Build per-associate brokerage rows ────────────
  var assocMap={};
  function getOrCreate(id,name){
    if(!assocMap[id]){
      var a=D.associates.find(function(x){return x.id===id;})||{};
      assocMap[id]={id:id,name:name,phone:a.phone||'—',rera:a.rera||'—',
        pan:a.pan||'—',location:a.location||'',bankingName:a.bankingName||name,
        bankName:a.bankName||'—',accNo:a.accNo||'—',ifsc:a.ifsc||'—',
        rows:[],chain:0,def:0};
    }
    return assocMap[id];
  }

  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    if(r4MonF){var d=getFilterDate(sl);if(!(d&&d.startsWith(r4MonF)))return;}
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(!c.total||c.total<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;});
      if(!a)return;
      if(secF&&(a.location||'').trim()!==secF)return;
      if(assocF&&a.id!==assocF)return;
      var rec=getOrCreate(c.id,c.name);
      rec.rows.push({proj:sl.projName,plotNo:sl.plotNo,plotSize:sl.plotSizeGaj||sl.plotGaj,saleable:sl.plotGaj,seller:sl.sellerName||'—',buyer:sl.partyName||'—',booking:sl.bookingDate||'—',closing:sl.closeDate||'—',type:'Chain',amount:c.total});
      rec.chain+=c.total;
    });
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(!c.amount||c.amount<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;});
      if(!a)return;
      if(secF&&(a.location||'').trim()!==secF)return;
      if(assocF&&a.id!==assocF)return;
      var rec=getOrCreate(c.id,c.name);
      rec.rows.push({proj:sl.projName,plotNo:sl.plotNo,plotSize:sl.plotSizeGaj||sl.plotGaj,saleable:sl.plotGaj,seller:sl.sellerName||'—',buyer:sl.partyName||'—',booking:sl.bookingDate||'—',closing:sl.closeDate||'—',type:'Defence D'+c.depth,amount:c.amount});
      rec.def+=c.amount;
    });
  });

  var list=Object.values(assocMap).filter(function(a){return a.rows.length>0;})
    .sort(function(a,b){return (b.chain+b.def)-(a.chain+a.def);});

  if(!list.length){
    html+='<div class="empty" style="margin-top:16px">No brokerage data found for this filter</div>';
    return html;
  }

  // ── Summary stats ─────────────────────────────────
  var totChain=list.reduce(function(s,a){return s+a.chain;},0);
  var totDef=list.reduce(function(s,a){return s+a.def;},0);
  var totSales=list.reduce(function(s,a){return s+a.rows.length;},0);

  html+='<div class="g4" style="margin:10px 0">'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Associates</div><div class="sv">'+list.length+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Total Sales</div><div class="sv">'+totSales+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Chain + Defence</div><div class="sv" style="font-size:14px;color:var(--bl)">'+'\u20b9'+fmtL(totChain)+'  +  '+'\u20b9'+fmtL(totDef)+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Grand Total</div><div class="sv" style="font-size:15px;color:var(--gr)">'+'\u20b9'+fmtL(totChain+totDef)+'</div></div>'
    +'</div>';

  // ── Per-associate expandable cards ───────────────
  list.forEach(function(a){
    var tot=a.chain+a.def;
    var cardId='leg_'+a.id;
    html+='<div class="card" style="padding:0;margin-bottom:10px;overflow:hidden">'

      // Header row
      +'<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-bottom:.5px solid var(--bd);cursor:pointer" onclick="var b=document.getElementById(\''+cardId+'\');b.style.display=b.style.display===\'none\'?\'block\':\'none\'">'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<div style="width:36px;height:36px;border-radius:50%;background:var(--bl);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">'+a.name.charAt(0).toUpperCase()+'</div>'
      +'<div>'
      +'<div style="font-weight:700;font-size:14px">'+a.name+'</div>'
      +'<div style="font-size:11px;color:var(--t2)">'+a.phone+' &nbsp;|&nbsp; RERA: <span style="color:var(--bl)">'+a.rera+'</span>'+(a.location?' &nbsp;|&nbsp; 📍'+a.location:'')+'</div>'
      +'</div></div>'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<div style="text-align:right">'
      +'<div style="font-size:11px;color:var(--t2)">'+a.rows.length+' sale'+(a.rows.length>1?'s':'')+'</div>'
      +'<div style="font-weight:700;font-size:15px;color:var(--gr)">'+'\u20b9'+fmt(tot)+'</div>'
      +'</div>'
      +'<button class="btn bgr bsm" onclick="event.stopPropagation();openAssocInvoice(\''+a.id+'\')">'+'🧾'+' Invoice</button>'
      +'<button class="btn bgh bsm" onclick="event.stopPropagation();expSingleAssoc(\''+a.id+'\')" style="font-size:11px">📥</button>'
      +'</div></div>'

      // Expandable detail table
      +'<div id="'+cardId+'" style="display:none">'
      +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
      +'<thead><tr style="background:var(--bg3)">'
      +'<th style="padding:7px 10px;text-align:left">#</th>'
      +'<th style="padding:7px 10px;text-align:left">Project</th>'
      +'<th style="padding:7px 10px;text-align:left">Plot No</th>'
      +'<th style="padding:7px 10px;text-align:left">Plot Size</th>'
      +'<th style="padding:7px 10px;text-align:left">Saleable</th>'
      +'<th style="padding:7px 10px;text-align:left">Seller</th>'
      +'<th style="padding:7px 10px;text-align:left">Buyer</th>'
      +'<th style="padding:7px 10px;text-align:left">Booking</th>'
      +'<th style="padding:7px 10px;text-align:left">Closing</th>'
      +'<th style="padding:7px 10px;text-align:left">Type</th>'
      +'<th style="padding:7px 10px;text-align:right">Amount</th>'
      +'</tr></thead><tbody>'
      +a.rows.map(function(r,i){
        return '<tr style="background:'+(i%2===0?'#fff':'var(--bg3)')+'">'
          +'<td style="padding:7px 10px;color:var(--t3)">'+(i+1)+'</td>'
          +'<td style="padding:7px 10px;font-weight:600">'+r.proj+'</td>'
          +'<td style="padding:7px 10px"><span class="badge bbl2">'+r.plotNo+'</span></td>'
          +'<td style="padding:7px 10px">'+r.plotSize+'Sq.Yd</td>'
          +'<td style="padding:7px 10px;color:var(--pu);font-weight:700">'+r.saleable+'Sq.Yd</td>'
          +'<td style="padding:7px 10px">'+r.seller+'</td>'
          +'<td style="padding:7px 10px">'+r.buyer+'</td>'
          +'<td style="padding:7px 10px">'+r.booking+'</td>'
          +'<td style="padding:7px 10px">'+r.closing+'</td>'
          +'<td style="padding:7px 10px;font-size:11px">'+r.type+'</td>'
          +'<td style="padding:7px 10px;text-align:right;font-weight:700;color:var(--gr)">'+'\u20b9'+fmt(r.amount)+'</td>'
          +'</tr>';
      }).join('')
      +'<tr style="background:var(--bg3);font-weight:700">'
      +'<td colspan="9" style="padding:8px 10px;border-top:2px solid var(--bd)">Total</td>'
      +'<td style="padding:8px 10px;text-align:right;border-top:2px solid var(--bd);color:var(--gr);font-size:14px">'+'\u20b9'+fmt(tot)+'</td>'
      +'</tr></tbody></table></div>'

      // Bank details strip
      +'<div style="padding:8px 14px;background:var(--bg3);border-top:.5px solid var(--bd);font-size:11px;color:var(--t2);display:flex;gap:20px;flex-wrap:wrap">'

      +'<span>Bank: <b>'+a.bankName+'</b></span>'
      +'<span>A/c: <b>'+a.accNo+'</b></span>'
      +'<span>IFSC: <b>'+a.ifsc+'</b></span>'
      +'<span>PAN: <b>'+a.pan+'</b></span>'

  return html;

function expBroLeg(){
  if(!window.XLSX){toast('XLSX library not loaded',false);return;}
  var wb=XLSX.utils.book_new();

  // Single sheet — Associate+Plot ke hisaab se ek row, sirf total amount
  // Key: assocId + '|' + saleId → ek row
  var rowMap={};
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    var mon=getFilterDate(sl).substr(0,7)||'—';
    if(r4MonF&&!mon.startsWith(r4MonF))return;

    // Chain commissions
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(!c.total||c.total<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;})||{};
      if(r4SecF&&(a.location||'').trim()!==r4SecF)return;
      if(r4LegAssocF&&c.id!==r4LegAssocF)return;
      var key=c.id+'|'+sl.id;
      if(!rowMap[key])rowMap[key]={mon:mon,name:c.name,phone:a.phone||'',rera:a.rera||'',pan:a.pan||'',loc:a.location||'',proj:sl.projName,plot:sl.plotNo,amount:0};
      rowMap[key].amount+=c.total;
    });
    // Defence commissions — add to same row if same assoc+sale
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(!c.amount||c.amount<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;})||{};
      if(r4SecF&&(a.location||'').trim()!==r4SecF)return;
      if(r4LegAssocF&&c.id!==r4LegAssocF)return;
      var key=c.id+'|'+sl.id;
      if(!rowMap[key])rowMap[key]={mon:mon,name:c.name,phone:a.phone||'',rera:a.rera||'',pan:a.pan||'',loc:a.location||'',proj:sl.projName,plot:sl.plotNo,amount:0};
      rowMap[key].amount+=c.amount;
    });
  });

  var dataRows=Object.values(rowMap).filter(function(r){return r.amount>0;});
  if(!dataRows.length){toast('No data found for export!',false);return;}

  // Sort: month → associate name → project
  dataRows.sort(function(a,b){
    if(a.mon!==b.mon)return a.mon<b.mon?-1:1;
    if(a.name!==b.name)return a.name<b.name?-1:1;
    return a.proj<b.proj?-1:1;
  });

  var rows=[['#','Month','Associate Name','Phone','RERA No','PAN','Location / Sector','Project Name','Plot No','Amount (Rs.)']];
  dataRows.forEach(function(r,i){
    rows.push([i+1,r.mon,r.name,r.phone,r.rera,r.pan,r.loc,r.proj,r.plot,r.amount]);
  });

  // Grand total row
  var grandTotal=dataRows.reduce(function(s,r){return s+r.amount;},0);
  rows.push(['','','GRAND TOTAL','','','','','','',grandTotal]);

  var ws=XLSX.utils.aoa_to_sheet(rows);
  xlStyle(wb,ws,[{wch:4},{wch:10},{wch:26},{wch:14},{wch:18},{wch:13},{wch:16},{wch:24},{wch:10},{wch:16}]);
  XLSX.utils.book_append_sheet(wb,ws,'Brokerage Detail');

  var fname='TrueStars_Brokerage'
    +(r4ProjF?'_'+((D.projects.find(function(p){return p.id===r4ProjF;})||{}).name||'').replace(/[^a-zA-Z0-9]/g,'_'):'')
    +(r4MonF?'_'+r4MonF:'')
    +(r4SecF?'_'+r4SecF.replace(/[^a-zA-Z0-9]/g,'_'):'')
    +'.xlsx';
  XLSX.writeFile(wb,fname);
  toast('Excel ready! '+dataRows.length+' rows — Filter by Month/Associate/Project/Plot \uD83D\uDCCA');
}

function calcOfferStats(offer){
  // Returns array of {assocId, assocName, projectResults, qualifiedCount, rewardLevel}
  var today=new Date(); today.setHours(0,0,0,0);
  var start=new Date(offer.startDate); start.setHours(0,0,0,0);
  var end=new Date(offer.endDate); end.setHours(23,59,59,999);

  // Filter sales in date range
  var sales=D.sales.filter(function(s){
    if(!s.bookingDate)return false;
    var bd=new Date(s.bookingDate);
    return bd>=start && bd<=end;
  });

  // Get all associates who made direct sales
  var assocMap={};
  D.associates.forEach(function(a){
    assocMap[a.id]={id:a.id,name:a.name,projSales:{},salesList:[]};
  });

  sales.forEach(function(s){
    if(!s.sellerId)return;
    var proj=D.projects.find(function(p){return p.id===s.projId;});
    if(!proj)return;

    // Find plot gaj — use plotGaj saved on sale, fallback to plot lookup
    var gaj=s.plotGaj||0;
    if(!gaj){
      proj.plots=proj.plots||[];
      var pl=proj.plots.find(function(p){return p.id===s.plotId;});
      gaj=pl?(pl.saleableGaj||pl.sizeGaj||0):0;
    }

    // Only count if offer covers this project
    var covered=false;
    if(offer.condType==='combined'){
      covered=true;
    } else {
      covered=(offer.projects||[]).some(function(op){return op.projId===s.projId;});
    }
    if(!covered)return;

    if(!assocMap[s.sellerId])assocMap[s.sellerId]={id:s.sellerId,name:s.sellerName||s.sellerId,projSales:{},salesList:[]};
    if(!assocMap[s.sellerId].projSales[s.projId])assocMap[s.sellerId].projSales[s.projId]={plots:0,gaj:0,projName:proj.name,projId:s.projId};
    assocMap[s.sellerId].projSales[s.projId].plots++;
    assocMap[s.sellerId].projSales[s.projId].gaj+=Number(gaj);
    assocMap[s.sellerId].salesList.push({projName:proj.name,plotNo:s.plotNo||'—',gaj:Number(gaj),bookingDate:s.bookingDate||'—',closeDate:s.closeDate||'—',partyName:s.partyName||'—'});
  });

  // Calculate results per associate
  var results=[];
  Object.values(assocMap).forEach(function(a){
    var qualifiedProjects=0;
    var totalPlots=0, totalGaj=0;
    var projResults=[];

    if(offer.condType==='combined'){
      // All projects combined
      Object.values(a.projSales).forEach(function(ps){
        totalPlots+=ps.plots; totalGaj+=ps.gaj;
      });
      // Check if combined meets ANY level condition
      offer.levels.forEach(function(lv){
        var plotOk=lv.plots>0?totalPlots>=lv.plots:false;
        var gajOk=lv.gaj>0?totalGaj>=lv.gaj:false;
        if(plotOk||gajOk)qualifiedProjects=1;
      });
      projResults=[{label:'All Projects',plots:totalPlots,gaj:totalGaj,qualifies:qualifiedProjects>0}];
    } else {
      // Per project — each project has its own levels
      offer.projects.forEach(function(op){
        var ps=a.projSales[op.projId]||{plots:0,gaj:0,projName:op.projName||op.projId};
        totalPlots+=ps.plots; totalGaj+=ps.gaj;
        // Find highest level this associate qualifies for in this project
        var projLevels=(op.levels||[]).slice().sort(function(x,y){
          return ((y.plots||0)+(y.gaj||0))-((x.plots||0)+(x.gaj||0));
        });
        var projReward=null;
        for(var pi=0;pi<projLevels.length;pi++){
          var plv=projLevels[pi];
          var plotOk=plv.plots>0?ps.plots>=plv.plots:false;
          var gajOk=plv.gaj>0?ps.gaj>=plv.gaj:false;
          if(plotOk||gajOk){projReward=plv;break;}
        }
        if(projReward)qualifiedProjects++;
        projResults.push({
          label:ps.projName||op.projName,
          projId:op.projId,
          plots:ps.plots,
          gaj:Math.round(ps.gaj),
          levels:op.levels||[],
          projReward:projReward,
          qualifies:!!projReward
        });
      });
    }

    // Determine overall reward level
    var rewardLevel=null;
    if(offer.condType==='combined'){
      var sortedLevels=(offer.levels||[]).slice().sort(function(a,b){
        return ((b.plots||0)+(b.gaj||0))-((a.plots||0)+(a.gaj||0));
      });
      for(var i=0;i<sortedLevels.length;i++){
        var lv=sortedLevels[i];
        var plotOk2=lv.plots>0?totalPlots>=lv.plots:false;
        var gajOk2=lv.gaj>0?totalGaj>=lv.gaj:false;
        if(plotOk2||gajOk2){rewardLevel=lv;break;}
      }
    } else {
      // Per project: collect all earned rewards across projects
      var allRewards=[];
      projResults.forEach(function(pr){if(pr.projReward)allRewards.push({reward:pr.projReward.reward,proj:pr.label});});
      if(allRewards.length>0)rewardLevel={reward:allRewards.map(function(r){return r.reward;}).join(' + '),rewards:allRewards};
    }

    if(totalPlots>0||totalGaj>0||qualifiedProjects>0){
      results.push({
        id:a.id,name:a.name,
        qualifiedProjects:qualifiedProjects,
        totalPlots:totalPlots,totalGaj:Math.round(totalGaj),
        projResults:projResults,
        rewardLevel:rewardLevel,
        salesList:a.salesList||[]
      });
    }
  });

  // Sort: qualified first, then by gaj
  results.sort(function(a,b){
    if(b.qualifiedProjects!==a.qualifiedProjects)return b.qualifiedProjects-a.qualifiedProjects;
    return b.totalGaj-a.totalGaj;
  });
  return results;
}

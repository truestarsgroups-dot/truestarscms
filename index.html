<html lang="hi">
<head>

<title>TrueStars Real Estate — Commission Management</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Blues — softer, modern */
  --bl:#2563eb;--blb:#eff6ff;--bld:#1d4ed8;
  /* Greens — lighter */
  --gr:#16a34a;--grb:#f0fdf4;
  /* Amber — warmer */
  --am:#d97706;--amb:#fffbeb;
  /* Purple */
  --pu:#7c3aed;--pub:#f5f3ff;
  /* Red */
  --re:#dc2626;--reb:#fef2f2;
  /* Neutrals — cleaner */
  --bd:#e5e7eb;--bg:#f9fafb;--bg2:#ffffff;--bg3:#f3f4f6;
  --tx:#111827;--t2:#6b7280;--t3:#9ca3af;
  /* Shadows — softer */
  --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
  --shadow-lg:0 10px 15px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.05);
  --radius:8px;--radius-sm:6px;--radius-lg:12px;
  --transition:all .15s cubic-bezier(.4,0,.2,1);
}

/* ── BASE ── */
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

/* ── SPINNER ── */
#appSpinner{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .3s}
#appSpinner.hide{opacity:0;pointer-events:none}
.spinner-ring{width:44px;height:44px;border:3px solid var(--blb);border-top-color:var(--bl);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-text{font-size:13px;color:var(--t2);font-weight:500;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── PAGE TRANSITION ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-enter{animation:fadeUp .22s ease forwards}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(37,99,235,.2);flex-wrap:wrap;gap:8px}
.hdr-l{display:flex;align-items:center;gap:12px}
.hdr h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.2px}
.hdr p{font-size:10px;opacity:.75;margin:0;letter-spacing:.2px}

/* ── NAV ── */
.nav{background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;overflow-x:auto;padding:0 16px;gap:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:11px 14px;font-size:13px;font-weight:600;color:var(--t2);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;position:relative;z-index:2;transition:var(--transition)}
.nav a:hover{color:var(--bl);background:var(--blb)}
.nav a.on{color:var(--bl);border-color:var(--bl);background:var(--blb)}
#srchWrap{margin-left:auto;padding:4px 0;flex-shrink:0;position:relative;z-index:1}
#srchWrap input{font-size:12px;padding:6px 12px 6px 32px;border:1.5px solid var(--bd);border-radius:20px;width:200px;background:var(--bg3);transition:var(--transition)}
#srchWrap input:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(26,111,196,.12);background:#fff;outline:none}
#srchWrap::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}

/* ── MAIN ── */
.main{max-width:1200px;margin:0 auto;padding:18px}

/* ── CARDS ── */
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow);transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.ct{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--tx);letter-spacing:-.1px}

/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}

/* ── STAT CARDS ── */
.stat{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radius);padding:14px;text-align:center;transition:var(--transition)}
.stat:hover{border-color:var(--bl);box-shadow:0 0 0 3px rgba(26,111,196,.08)}
.sv{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.5px}
.sl{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* ── FORMS ── */
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
input,select{font-size:13px;padding:8px 11px;border:1.5px solid var(--bd);border-radius:var(--radius-sm);background:#fff;color:var(--tx);width:100%;transition:var(--transition)}
input[type='date']{width:auto;min-width:150px;cursor:pointer}
input:focus,select:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px rgba(26,111,196,.1)}
input:hover:not(:focus):not(:disabled),select:hover:not(:focus):not(:disabled){border-color:#94a3b8}
input:disabled,select:disabled{background:var(--bg3);color:var(--t3);cursor:not-allowed}

/* ── BUTTONS ── */
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:var(--transition);position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0);filter:brightness(.96)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:none;box-shadow:none}
.bbl{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 2px 4px rgba(37,99,235,.3)}
.bgr{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 2px 4px rgba(22,163,74,.3)}
.bgh{background:#fff;color:var(--t2);border:1.5px solid var(--bd);cursor:pointer}
.bgh:hover{background:var(--bg3);color:var(--tx);border-color:#94a3b8}
.bsm{padding:4px 10px;font-size:12px;border-radius:5px}
.bsm:hover{transform:translateY(0);box-shadow:var(--shadow)}
.bot{background:transparent;color:var(--bl);border:1.5px solid var(--bl)}
.bot:hover{background:var(--blb)}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.1px}
.bgn{background:var(--grb);color:var(--gr)}
.bam{background:var(--amb);color:var(--am)}
.bbl2{background:var(--blb);color:var(--bl)}
.bpu{background:var(--pub);color:var(--pu)}

/* ── TABLES ── */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:6px 10px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;letter-spacing:-.01em}
td{padding:5px 10px;border-bottom:1px solid var(--bg);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--blb)}
tbody tr:hover td:first-child{border-left:2.5px solid var(--bl)}

/* ── EMPTY STATES ── */
.empty{padding:40px 20px;text-align:center;color:var(--t3);border:2px dashed var(--bd);border-radius:var(--radius-lg);background:var(--bg3)}
.empty::before{content:'📭';display:block;font-size:32px;margin-bottom:10px}

/* ── INFO BOXES ── */
.info{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:10px;border-left:3px solid}
.ibl{background:var(--blb);color:var(--bld);border-color:var(--bl)}
.igr{background:var(--grb);color:var(--gr);border-color:var(--gr)}
.iam{background:var(--amb);color:var(--am);border-color:var(--am)}
.ipu{background:var(--pub);color:var(--pu);border-color:var(--pu)}

/* ── PROGRESS ── */
.sbar{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden;margin:5px 0;border:1px solid var(--bd)}
.sfil{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── MISC ── */
.divl{height:1px;background:var(--bd);margin:14px 0}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid;transition:var(--transition)}
.sdn{background:var(--grb);color:var(--gr);border-color:var(--gr)}
.sac{background:var(--bl);color:#fff;border-color:var(--bl)}
.std{background:var(--bg3);color:var(--t3);border-color:var(--bd)}

/* ── MODAL ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.ov.open{display:flex}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal{background:#fff;border-radius:var(--radius-lg);padding:22px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .2s cubic-bezier(.34,1.56,.64,1)}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);padding:11px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-lg)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--t3)}

/* ── MOBILE ── */
@media(max-width:768px){
  .main{padding:12px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  th,td{padding:4px 7px;font-size:12px}
  .btn{padding:7px 13px}
  .hdr{padding:10px 14px}
  .card{padding:12px 14px;border-radius:var(--radius)}
  .tw{border-radius:var(--radius-sm)}
  /* Hide top nav on mobile, show bottom nav */
  .nav{display:none}
  #bottomNav{display:flex!important}
  .main{padding-bottom:72px}
}
@media(max-width:480px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  #srchWrap input{width:140px}
  .sv{font-size:18px}
}

/* ── BOTTOM NAV ── */
#bottomNav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--bd);
  z-index:100;padding:6px 4px;
  box-shadow:0 -4px 12px rgba(0,0,0,.08);
  gap:0;align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom,6px);
}
#bottomNav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:4px 2px;border-radius:8px;cursor:pointer;
  font-size:9px;font-weight:600;color:var(--t3);transition:var(--transition);
  text-align:center;min-width:0;
}
#bottomNav a.on{color:var(--bl);background:var(--blb)}
#bottomNav a .bn-icon{font-size:18px;line-height:1}
#bottomNav a .bn-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52px}
/* ── STEP FORM ── */
.step-circle{width:28px;height:28px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:var(--transition)}
.step-label{font-size:11px;font-weight:600;white-space:nowrap}

/* ── LOGIN BUTTON LOADING ── */
#loginBtn:disabled{opacity:.8;cursor:not-allowed}

/* ── CLICKABLE ROWS ── */
tbody tr[style*="cursor:pointer"]:hover td{background:var(--blb);cursor:pointer}

/* ── PRINT STYLES ─────────────────────────────────── */
@media print{
  /* Hide non-essential elements */
  .hdr,.nav,#toast,.ov,
  button:not(.print-btn),
  .btn,input,select,textarea,
  [onclick],
  .sbar,.sfil,
  #offlineBanner,
  #remoteUpdateNotif,
  .no-print
  {display:none!important}

  /* Show only main content */
  body{background:#fff!important;color:#000!important;font-size:12pt;margin:0;padding:0}
  .main{padding:0!important;max-width:100%!important;margin:0!important}

  /* Tables print properly */
  .tw{overflow:visible!important}
  table{border-collapse:collapse;width:100%;page-break-inside:auto}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  th,td{border:1px solid #ccc!important;padding:5px 8px!important;font-size:10pt!important;color:#000!important;background:#fff!important}
  thead th{background:#f0f0f0!important;font-weight:700!important}

  /* Cards print cleanly */
  .card{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid;margin-bottom:12px}

  /* Stats grid */
  .stat{border:1px solid #ccc!important;background:#fff!important}
  .sv{color:#000!important}

  /* Page breaks */
  .card{page-break-inside:avoid}
  h2,h3,.ct{page-break-after:avoid}

  /* Show print header */
  .print-header{display:block!important}

  /* Badges readable in BW */
  .badge{border:1px solid #999!important;background:#f0f0f0!important;color:#000!important}

  /* Progress bars */
  .sbar{border:1px solid #ccc!important}
  .sfil{background:#666!important}

  /* Links */
  a{color:#000!important;text-decoration:none!important}

  /* Page setup */
  @page{margin:15mm;size:A4}
}
</style>

<script>
// ─── CONSTANTS ───────────────────────────────────────
var SK='ts8';
// ─── AUTH / SESSION ───────────────────────────────────
var SK_AUTH=SK+'_auth';
var SK_LOG=SK+'_log';
var SESSION=null;
var ACTLOG=[];

function hashPwd(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h)+s.charCodeAt(i);return(h>>>0).toString(36);}

function getAuth(){
  try{var r=localStorage.getItem(SK_AUTH);if(r)return JSON.parse(r);}catch(e){}
  return{admin:{id:'admin',pwd:hashPwd('admin'),name:'Admin'},staff:[]};
}
function saveAuth(a){try{localStorage.setItem(SK_AUTH,JSON.stringify(a));}catch(e){}}
function loadLog(){try{var r=localStorage.getItem(SK_LOG);if(r)ACTLOG=JSON.parse(r);}catch(e){}}
function saveLog(){try{localStorage.setItem(SK_LOG,JSON.stringify(ACTLOG));}catch(e){}}

function logAct(action){
  if(!SESSION)return;
  var entry={uid:SESSION.id,uname:SESSION.name,role:SESSION.role,action:action,time:new Date().toISOString()};
  ACTLOG.unshift(entry);
  if(ACTLOG.length>200)ACTLOG=ACTLOG.slice(0,200);
  saveLog(); // localStorage backup
  // Also save to Firebase (async, non-blocking)
  if(_fbReady&&_fbDB){
    _fbDB.collection('_actlog').add(entry).catch(function(){});
  }
}

var PERM_LABELS={
  dashboard:'🏠 Dashboard',
  projects_view:'🏗️ Projects View',
  projects_edit:'🏗️ Projects Add/Edit/Delete',
  associates_view:'👥 Associates View',
  associates_edit:'👥 Associates Add/Edit/Delete',
  newsale:'➕ New Sale',
  salesrec:'📋 Sales Record View',
  sales_delete:'🗑️ Sale Delete',
  reports:'📊 Reports',
  offers_view:'🎯 Campaigns View'
};

var DEFAULT_PERMS={dashboard:true,projects_view:false,projects_edit:false,associates_view:true,associates_edit:false,newsale:true,salesrec:true,sales_delete:false,reports:true,offers_view:true};

function can(perm){
  if(!SESSION)return false;
  if(SESSION.role==='admin')return true;
  return!!(SESSION.perms&&SESSION.perms[perm]);
}

var SESSION_TIMEOUT=8*60*60*1000; // 8 hours
var _sessionTimer=null;

function resetSessionTimer(){
  if(_sessionTimer)clearTimeout(_sessionTimer);
  if(!SESSION)return;
  _sessionTimer=setTimeout(function(){
    toast('⏰ Session expired (8 hours). Please login again.',false);
    doLogout();
  },SESSION_TIMEOUT);
}

function doLogin(uid,pwd){
  var auth=getAuth();
  if(uid.toLowerCase()==='admin'&&auth.admin.pwd===hashPwd(pwd)){
    SESSION={id:'admin',name:'Admin',role:'admin',perms:null,loginTime:Date.now()};
    logAct('Logged in');hideLoginScreen();TAB='dashboard';resetSessionTimer();render();return true;
  }
  var s=(auth.staff||[]).find(function(x){return x.id.toLowerCase()===uid.toLowerCase();});
  if(s&&s.pwd===hashPwd(pwd)){
    SESSION={id:s.id,name:s.name,role:'staff',perms:s.perms||{},loginTime:Date.now()};
    logAct('Logged in');hideLoginScreen();TAB='dashboard';resetSessionTimer();render();return true;
  }
  return false;
}

function doLogout(){
  if(_sessionTimer)clearTimeout(_sessionTimer);
  _sessionTimer=null;
  if(SESSION)logAct('Logged out');
  SESSION=null;
  document.getElementById('nav').innerHTML='';
  document.getElementById('main').innerHTML='';
  document.getElementById('hdrUserInfo').innerHTML='';
  document.getElementById('hdrDate').textContent='';
  showLoginScreen();
}

function showLoginScreen(){
  hideBottomNav();
  document.getElementById('loginWrap').style.display='flex';
  setTimeout(function(){var el=document.getElementById('loginId');if(el)el.focus();},100);
}
function hideLoginScreen(){
  document.getElementById('loginWrap').style.display='none';
}

function setLoginLoading(on){
  var btn=document.getElementById('loginBtn');
  if(!btn)return;
  if(on){btn.disabled=true;btn.innerHTML='<span style="width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block"></span> Verifying...';}
  else{btn.disabled=false;btn.innerHTML='Login →';}
}

function doLoginBtn(){
  var uid=(document.getElementById('loginId')||{}).value||'';
  var pwd=(document.getElementById('loginPwd')||{}).value||'';
  var err=document.getElementById('loginErr');
  uid=uid.trim();
  if(!uid||!pwd){
    if(err){err.style.display='block';err.textContent='❌ Please enter User ID and Password!';}
    return;
  }
  setLoginLoading(true);
  // ── Brute force protection — stored in Firebase ──
  var BF_KEY='bf_'+uid.toLowerCase().replace(/[^a-z0-9]/g,'_');
  var now=Date.now();

  function _bfFail(bfData){
    var fails=(bfData&&bfData.fails||0)+1;
    var lockedUntil=fails>=5?now+5*60*1000:0;
    var data={fails:fails,lockedUntil:lockedUntil,updatedAt:now};
    // Firebase save
    if(_fbReady&&_fbDB)_fbDB.collection('_security').doc(BF_KEY).set(data).catch(function(){});
    // localStorage fallback
    try{localStorage.setItem(BF_KEY,JSON.stringify(data));}catch(e){}
    var msg=fails>=5?'🔒 Too many failed attempts! Account locked for 5 minutes.':'❌ Invalid User ID or Password! ('+(5-fails)+' attempts remaining)';
    if(err){err.style.display='block';err.textContent=msg;}
    setLoginLoading(false);
    var pwdEl=document.getElementById('loginPwd');
    if(pwdEl){pwdEl.value='';pwdEl.focus();}
  }

  function _bfSuccess(){
    if(_fbReady&&_fbDB)_fbDB.collection('_security').doc(BF_KEY).delete().catch(function(){});
    try{localStorage.removeItem(BF_KEY);}catch(e){}
    if(err)err.style.display='none';
  }

  function _bfCheck(bfData){
    if(bfData&&bfData.lockedUntil&&now<bfData.lockedUntil){
      var secsLeft=Math.ceil((bfData.lockedUntil-now)/1000);
      if(err){err.style.display='block';err.textContent='🔒 Account locked! Please try again in '+secsLeft+' seconds.';}
      return;
    }
    if(!doLogin(uid,pwd)){_bfFail(bfData);}
    else{_bfSuccess();}
  }

  // Check Firebase first (primary), localStorage fallback
  if(_fbReady&&_fbDB){
    _fbDB.collection('_security').doc(BF_KEY).get()
      .then(function(doc){_bfCheck(doc.exists?doc.data():null);})
      .catch(function(){
        // Firebase fail — localStorage fallback
        var bfRaw=null;try{bfRaw=JSON.parse(localStorage.getItem(BF_KEY)||'null');}catch(e){}
        _bfCheck(bfRaw);
      });
  } else {
    var bfRaw=null;try{bfRaw=JSON.parse(localStorage.getItem(BF_KEY)||'null');}catch(e){}
    _bfCheck(bfRaw);
  }
}


var SLABS=[
  {l:1,min:0,max:249,rate:300,des:'Trainee'},
  {l:2,min:250,max:499,rate:350,des:'Sales Associate'},
  {l:3,min:500,max:999,rate:450,des:'Sales Exec (Jr)'},
  {l:4,min:1000,max:1999,rate:500,des:'Sales Executive'},
  {l:5,min:2000,max:3999,rate:600,des:'Sales Co-Ord (Jr)'},
  {l:6,min:4000,max:5999,rate:700,des:'Sales Co-Ordinator'},
  {l:7,min:6000,max:7999,rate:800,des:'Sales Co-Ord (Sr)'},
  {l:8,min:8000,max:9999,rate:900,des:'ASP Junior'},
  {l:9,min:10000,max:24999,rate:1000,des:'Asst. Sales Partner'},
  {l:10,min:25000,max:49999,rate:1100,des:'Asst. Business Partner'},
  {l:11,min:50000,max:99999,rate:1200,des:'Dy. Business Partner'},
  {l:12,min:100000,max:Infinity,rate:1300,des:'Business Partner+'}
];
var BENS=[
  {g:1000,l:'TAB'},{g:2500,l:'Rajasthan Tour'},{g:5000,l:'Goa Tour'},
  {g:10000,l:'Malaysia Tour'},{g:25000,l:'Dubai Tour'},{g:50000,l:'Switzerland Tour'},
  {g:100000,l:'London Tour'},{g:300000,l:'South Africa'},{g:500000,l:'Australia'},{g:1000000,l:'USA Tour'}
];
var RINC=[{min:25000,max:34999,pct:10},{min:35000,max:49999,pct:25},{min:50000,max:74999,pct:50},{min:75000,max:Infinity,pct:100}];

// ─── DATA ────────────────────────────────────────────
var D={projects:[],associates:[],sales:[],offers:[],deleted:{associates:[],sales:[],projects:[]},transfers:[],payments:[],advances:[],config:{}};

function loadD(){
  // Data only from Firebase — no localStorage
  // D already initialized with empty arrays at top
  D.deleted=D.deleted||{associates:[],sales:[],projects:[]};
  D.transfers=D.transfers||[];
  D.payments=D.payments||[];
  D.advances=D.advances||[];
  D.config=D.config||{};
}
function saveD(){
  if(!isOnline()){
    toast('📴 No internet connection — Changes will not be saved. Please connect first.',false);
    return;
  }
  var ts=Date.now();
  window._localTs=ts;
  // Only Firebase — no localStorage for data
  clearTimeout(window._saveDebounce);
  window._saveDebounce=setTimeout(function(){fbSave(ts);},400);
}

// ─── HELPERS ─────────────────────────────────────────
function slabOf(g){for(var i=SLABS.length-1;i>=0;i--)if(g>=SLABS[i].min)return SLABS[i];return SLABS[0];}
function rOf(g){return slabOf(g).rate;}
function dOf(g){return slabOf(g).des;}
function nSlab(g){var c=slabOf(g);return SLABS.find(function(s){return s.l===c.l+1;})||null;}
function nBen(g){return BENS.find(function(b){return g<b.g;})||null;}
// Get project rate based on booking date
function rInc(r){var x=RINC.find(function(x){return r>=x.min&&r<=x.max;});return x?x.pct:0;}
function getProjBonus(proj,bookingDate){
  if(!proj)return 0;
  // Use bonusHistory if available, find bonus active on bookingDate
  if(proj.bonusHistory&&proj.bonusHistory.length>0&&bookingDate){
    var sorted=proj.bonusHistory.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
    var pct=sorted[0].pct;
    for(var i=0;i<sorted.length;i++){
      if(sorted[i].date&&new Date(sorted[i].date)<=new Date(bookingDate))pct=sorted[i].pct;
      else break;
    }
    return pct;
  }
  // Fallback: use current bonusPct or ratePerGaj
  if(proj.bonusPct!==undefined)return proj.bonusPct;
  if(proj.ratePerGaj)return rInc(proj.ratePerGaj);
  return 0;
}

function getChain(id){
  var ch=[];var visited={};
  var c=D.associates.find(function(a){return a.id===id;});
  while(c){
    if(visited[c.id])break;
    visited[c.id]=true;
    ch.push(c);
    if(!c.parentId)break;
    c=D.associates.find(function(a){return a.id===c.parentId;});
  }
  return ch;
}
// Returns the effective parentId of an associate AS OF a given date,
// using parentHistory. If on `date` the associate was still under a parent
// who later left (parent-change happened AFTER date), return that old parent.
function parentIdAtDate(a,date){
  if(!a)return null;
  if(!date||!a.parentHistory||!a.parentHistory.length)return a.parentId||null;
  // parentHistory entries: {oldParentId,newParentId,date}. Find the earliest
  // change whose date is AFTER the sale date — before that change, the old
  // parent was effective.
  var changesAfter=a.parentHistory.filter(function(h){return h.date>date;})
    .sort(function(x,y){return x.date.localeCompare(y.date);});
  if(changesAfter.length)return changesAfter[0].oldParentId; // parent before first post-date change
  return a.parentId||null;
}
// Chain (seller→top) as it existed on a given date. Used for sales whose
// booking date is BEFORE a member left, so the left member still appears.
function getChainAtDate(id,date){
  var ch=[];var visited={};
  var c=D.associates.find(function(a){return a.id===id;});
  while(c){
    if(visited[c.id])break;
    visited[c.id]=true;
    ch.push(c);
    var pid=parentIdAtDate(c,date);
    if(!pid)break;
    c=D.associates.find(function(a){return a.id===pid;});
  }
  return ch;
}
function getDownline(id){
  var res=[];
  var visited={};
  function dfs(aid,d){
    if(visited[aid])return; // circular hierarchy protection
    visited[aid]=true;
    var a=D.associates.find(function(x){return x.id===aid;});
    if(!a)return;
    res.push(Object.assign({},a,{_d:d}));
    D.associates.filter(function(x){return x.parentId===aid;}).forEach(function(ch){dfs(ch.id,d+1);});
  }
  dfs(id,0);
  return res;
}
function subtreeGaj(id){
  var dl=getDownline(id);
  var ids=new Set(dl.map(function(x){return x.id;}));
  return D.sales.filter(function(s){return ids.has(s.sellerId);}).reduce(function(s,sl){return s+sl.plotGaj;},0);
}
function selfGaj(id){
  return D.sales.filter(function(s){return s.sellerId===id;}).reduce(function(s,sl){return s+sl.plotGaj;},0);
}
function daysBetween(d1,d2){

// ─── COMMISSION CALC ──────────────────────────────────
function calcChain(sGaj,ch,projRate,bk,cl,bonusOverride){
  if(!ch||!ch.length)return [];
  if(!sGaj||sGaj<0)sGaj=0; // Zero/negative gaj protection
  var rPct=(bonusOverride!==undefined)?bonusOverride:rInc(projRate);
  var d=daysBetween(bk,cl);
  var cPct=closingPct(d);
  return ch.map(function(a,i){
    var liveG=(a.totalGaj||0)+sGaj;
    var myR=rOf(liveG);
    var blLive=i>0?((ch[i-1].totalGaj||0)+sGaj):0;
    var blR=i>0?rOf(blLive):0;
    var diff=myR-blR;
    var base=Math.max(0,diff*sGaj);
    var rB=Math.round(base*rPct/100);
    var cA=Math.round(base*Math.abs(cPct)/100)*(cPct>=0?1:-1);
    var total=Math.max(0,base+rB+cA);
    return {id:a.id,name:a.name,myR:myR,diff:diff,base:base,rPct:rPct,rB:rB,cPct:cPct,cA:cA,total:total,days:d,curG:a.totalGaj,newG:liveG,up:myR>rOf(a.totalGaj)};
  });
}

function calcDef(ch,sGaj,bk,cl){
  if(!ch||!ch.length)return [];
  // Defence commission: only base rate applies
  // No rate increment (rInc) or closing day bonus/penalty
  var wComm=new Set();
  ch.forEach(function(a,i){
    var myR=rOf((a.totalGaj||0)+sGaj);
    var blR=i>0?rOf((ch[i-1].totalGaj||0)+sGaj):0;
    if(myR-blR>0)wComm.add(a.id);
  });
  var up=getChain(ch[0].id);
  var DR={1:100,2:75,3:50};
  var dep=0;var dc=[];
  for(var i=1;i<up.length&&dep<15;i++){
    var s=up[i];
    if(wComm.has(s.id))continue;
    var liveG=(s.totalGaj||0)+sGaj;
    if(liveG<10000)continue;
    dep++;
    var rate=DR[dep]||35;
    var baseAmt=rate*sGaj; // base rate × gaj only — no extra bonus
    var finalAmt=Math.max(0,baseAmt);
    dc.push({id:s.id,name:s.name,depth:dep,rate:rate,baseAmt:baseAmt,cAdj:0,cPct:0,amount:finalAmt,totalGaj:liveG,des:dOf(liveG)});
  }
  return dc;
}

// ═══════════════════════════════════════════════════════
// MONTH-END COMMISSION ENGINE
// Company rule: slab is based on MONTH-END cumulative gaj
// (lifetime: personal + team + manual, all months added up).
// All sales in a month get the slab achieved by that month's END total.
// Commission is NOT computed at sale-entry time; this engine recomputes
// every sale's commission whenever sales change.
//
// It replays all sales in closing-date (month) order, building each
// associate's cumulative gaj exactly as the real timeline did:
//   - dated manual gaj (gajHistory) applied in its month
//   - legacy manual gaj (no date) applied from the very start
//   - each sale adds its gaj to seller + entire upline chain
// For every sale, calcChain/calcDef get each chain member's gaj =
// (month-end cumulative − this sale's gaj), so liveG = month-end total.
// ═══════════════════════════════════════════════════════
function monthKeyOf(s){
  var d=s.closeDate||s.bookingDate||'';
  return d?d.substr(0,7):'0000-00';
}

// Returns the chain (seller→top) for a sale. If the sale has a frozen
// chainIds snapshot (members at sale time), use that so later hierarchy
// changes / Left actions do NOT alter past sales. Otherwise build live.
function chainForSale(s){
  if(s.chainIds&&s.chainIds.length){
    return s.chainIds.map(function(id){
      var a=D.associates.find(function(x){return x.id===id;});
      return a?a:{id:id,name:'(removed)',parentId:null,totalGaj:0};
    });
  }
  // Legacy sales (no chainIds): reconstruct frozen members from stored
  // commissions array (already frozen at entry time). Falls back to live.
  if(s.commissions&&s.commissions.length){
    return s.commissions.map(function(cm){
      var a=D.associates.find(function(x){return x.id===cm.id;});
      return a?a:{id:cm.id,name:cm.name||'(removed)',parentId:null,totalGaj:0};
    });
  }
  return getChain(s.sellerId);
}

function computeAllCommissions(){
  // 1. Manual gaj events (dated) + legacy (no-date) base
  var manualEvents=[];
  var legacyManual={};
  D.associates.forEach(function(a){
    if(a.gajHistory&&a.gajHistory.length){
      a.gajHistory.forEach(function(h){
        manualEvents.push({mk:(h.date||'').substr(0,7),assocId:a.id,amount:h.amount||0});
      });
    } else if(a.manualGaj!=null&&a.manualGaj>0){
      legacyManual[a.id]=a.manualGaj;
    } else {
      var dl=getDownline(a.id);var ids={};dl.forEach(function(z){ids[z.id]=1;});
      var sd=0;D.sales.forEach(function(s){if(ids[s.sellerId])sd+=(s.plotGaj||0);});
      var inf=Math.round(((a.totalGaj||0)-sd)*100)/100;
      if(inf>0)legacyManual[a.id]=inf;
    }
  });

  // 2. Group sales by closing month
  var sorted=D.sales.slice().sort(function(a,b){
    return (a.closeDate||a.bookingDate||'').localeCompare(b.closeDate||b.bookingDate||'');
  });
  var months={};var mset={};
  sorted.forEach(function(s){var mk=monthKeyOf(s);if(!months[mk])months[mk]=[];months[mk].push(s);mset[mk]=1;});
  manualEvents.forEach(function(e){mset[e.mk]=1;});
  var monthOrder=Object.keys(mset).sort();

  // 3. Running lifetime gaj — start with legacy manual base
  var lifeGaj={};
  D.associates.forEach(function(a){lifeGaj[a.id]=legacyManual[a.id]||0;});

  var perSale={};

  monthOrder.forEach(function(mk){
    var msales=months[mk]||[];
    // month-end snapshot
    var monthEnd={};
    Object.keys(lifeGaj).forEach(function(id){monthEnd[id]=lifeGaj[id];});
    manualEvents.forEach(function(e){if(e.mk===mk)monthEnd[e.assocId]=(monthEnd[e.assocId]||0)+e.amount;});
    msales.forEach(function(s){
      var sGaj=s.plotGaj||0;
      chainForSale(s).forEach(function(a){monthEnd[a.id]=(monthEnd[a.id]||0)+sGaj;});
    });
    // calc each sale at month-end slab
    msales.forEach(function(s){
      var sGaj=s.plotGaj||0;
      var rawChain=chainForSale(s);
      var ch=rawChain.map(function(a){return {id:a.id,name:a.name,totalGaj:(monthEnd[a.id]||0)-sGaj};});
      var bonusPct=(s.bonusPct!=null)?s.bonusPct:0;
      var newCh=calcChain(sGaj,ch,0,s.bookingDate,s.closeDate,bonusPct);
      var newDf=calcDefSnapshot(rawChain,ch,sGaj,s.bookingDate,s.closeDate,monthEnd);
      var cT=newCh.reduce(function(t,c){return t+c.total;},0);
      var dT=newDf.reduce(function(t,c){return t+c.amount;},0);
      perSale[s.id]={commissions:newCh,defCommissions:newDf,chainTotal:cT,defTotal:dT};
    });
    lifeGaj=monthEnd;
  });

  return {perSale:perSale,finalGaj:lifeGaj};
}

// Defence calc with gaj snapshot — mirrors original calcDef exactly
// (rates are ₹ per gaj: 100/75/50/35).
function calcDefSnapshot(rawChain,ch,sGaj,bk,cl,snap){
  if(!ch||!ch.length)return [];
  var wComm=new Set();
  ch.forEach(function(a,i){
    var myR=rOf((a.totalGaj||0)+sGaj);
    var blR=i>0?rOf((ch[i-1].totalGaj||0)+sGaj):0;
    if(myR-blR>0)wComm.add(a.id);
  });
  var up=rawChain.map(function(a){return {id:a.id,name:a.name,totalGaj:(snap[a.id]||0)-sGaj};});
  var DR={1:100,2:75,3:50};
  var dep=0;var dc=[];
  for(var i=1;i<up.length&&dep<15;i++){
    var s=up[i];
    if(wComm.has(s.id))continue;
    var liveG=(s.totalGaj||0)+sGaj;
    if(liveG<10000)continue;
    dep++;
    var rate=DR[dep]||35;
    var baseAmt=rate*sGaj;
    dc.push({id:s.id,name:s.name,depth:dep,rate:rate,baseAmt:baseAmt,cAdj:0,cPct:0,amount:Math.max(0,baseAmt),totalGaj:liveG,des:dOf(liveG)});
  }
  return dc;
}

// Apply computed commissions to all sales. Called after any sale add/delete.
function applyAllCommissions(){
  var r=computeAllCommissions();
  D.sales.forEach(function(s){
    var rs=r.perSale[s.id];
    if(rs){
      s.commissions=rs.commissions;
      s.defCommissions=rs.defCommissions;
      s.chainTotal=rs.chainTotal;
      s.defTotal=rs.defTotal;
    }
  });
}

function doAssocSearch(q){

  // This keeps input focus intact

    if(!q)return true;

      ||(a.phone||'').includes(lq)
      ||(a.rera||'').toLowerCase().includes(lq)
      ||(a.code||'').toLowerCase().includes(lq)
      ||(a.pan||'').toLowerCase().includes(lq)
      ||(a.fatherName||'').toLowerCase().includes(lq);
  }).sort(function(a,b){return a.name.localeCompare(b.name);});
  var totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(aPage>totalPages)aPage=totalPages;
  if(aPage<1)aPage=1;
  var pageData=filtered.slice((aPage-1)*PER_PAGE, aPage*PER_PAGE);

  // Update results count
  var rcEl=document.getElementById('aResCount');

  // Update clear button
  var clrEl=document.getElementById('aClrBtn');

  var tbody=document.getElementById('aListBody');

    html='<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--t3)">No results found for "'+q+'"</td></tr>';
  } else {
    pageData.forEach(function(a,i){

      var cs=slabOf(a.totalGaj);
      var level=0,cur=a;
      while(cur&&cur.parentId){level++;var tmp=D.associates.find(function(x){return x.id===cur.parentId;});cur=tmp;}
      var waNum=a.phone?a.phone.replace(/\D/g,''):'';

        +'<td style="color:var(--t3)">'+(i+1)+'</td>'

window.deleteBonusEntry=function(projId,bi){
  var p=D.projects.find(function(x){return x.id===projId;});if(!p)return;
  var bh=p.bonusHistory[bi];if(!bh)return;
  var isCurrent=bi===p.bonusHistory.length-1;
  var isOnly=p.bonusHistory.length===1;
  if(isOnly){toast('Only one entry exists — cannot be deleted!',false);return;}
  var label=bh.pct>0?'+'+bh.pct+'%':'No Bonus';
  var salesAffected=D.sales.filter(function(s){
    if(s.projId!==projId)return false;
    var nextDate=p.bonusHistory[bi+1]?p.bonusHistory[bi+1].date:'9999';
    return s.bookingDate&&s.bookingDate>=bh.date&&s.bookingDate<nextDate;
  });
  var warnMsg='Delete '+label+' ('+bh.date+')?';
  if(salesAffected.length>0){
    warnMsg+='\n\n⚠️ '+salesAffected.length+' sales are in this period — their commission will not change.';
  }
  if(isCurrent){
    warnMsg+='\n\n⚠️ This is the CURRENT bonus! After deletion, the previous bonus will become active.';
  }
  if(!confirm(warnMsg))return;
  var pi=D.projects.findIndex(function(x){return x.id===projId;});if(pi<0)return;
  D.projects[pi].bonusHistory.splice(bi,1);
  // If it was current, the new last entry becomes current
  if(isCurrent&&D.projects[pi].bonusHistory.length>0){
    var lastEntry=D.projects[pi].bonusHistory[D.projects[pi].bonusHistory.length-1];
    D.projects[pi].bonusPct=lastEntry.pct;
    toast('✅ Bonus entry deleted! Current bonus now: '+(lastEntry.pct>0?'+'+lastEntry.pct+'%':'No Bonus'));
  } else {
    toast('✅ Bonus entry deleted!');
  }
  saveD();closeM();render();
};

function rpt4Pay(){
  if(!D.payments)D.payments=[];

  // Associate detail view
  if(r4PayAssoc){return rpt4PayDetail(r4PayAssoc);}

  // ── Build associate commission summary WITH month+project filter ──
  var assocPay={};
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    if(r4MonF){var d=getFilterDate(sl);if(!(d&&d.startsWith(r4MonF)))return;}
    var allCm=(sl.commissions||[]).concat((sl.defCommissions||[]).map(function(d){return {id:d.id,name:d.name,total:d.amount||0};}));
    allCm.forEach(function(cm){
      if(!cm.id||!cm.total)return;
      if(!assocPay[cm.id])assocPay[cm.id]={id:cm.id,name:cm.name,total:0};
      assocPay[cm.id].total+=cm.total||0;
    });
  });

  // Merge with actual payments
  var paidMap={};
  D.payments.forEach(function(p){
    if(!paidMap[p.assocId])paidMap[p.assocId]=0;
    paidMap[p.assocId]+=(p.paid||p.amount||0);
  });

  // Orphan payments — show even those without a sale
  D.payments.forEach(function(p){
    if(!p.assocId)return;
    if(!assocPay[p.assocId]){
      var assocObj=D.associates.find(function(a){return a.id===p.assocId;});
      assocPay[p.assocId]={id:p.assocId,name:(assocObj&&assocObj.name)||p.assocName||p.assocId,total:0};
    }
  });

  // assocSaleIds: filtered sales ke saleIds per associate
  var assocSaleIdMap={};
  Object.keys(assocPay).forEach(function(aid){
    assocSaleIdMap[aid]=new Set();
  });
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    if(r4MonF){var d=getFilterDate(sl);if(!(d&&d.startsWith(r4MonF)))return;}
    var allCm=(sl.commissions||[]).concat((sl.defCommissions||[]).map(function(d){return{id:d.id};}));
    allCm.forEach(function(cm){if(cm.id&&assocSaleIdMap[cm.id])assocSaleIdMap[cm.id].add(sl.id);});
  });

  var rows=Object.values(assocPay).map(function(a){
    var sids=assocSaleIdMap[a.id]||new Set();
    var saleIdPaid=D.payments.filter(function(p){return p.assocId===a.id&&p.saleId&&sids.has(p.saleId);}).reduce(function(t,p){return t+(p.paid||p.amount||0);},0);
    var monthPaid=D.payments.filter(function(p){return p.assocId===a.id&&!p.saleId;}).reduce(function(t,p){return t+(p.paid||p.amount||0);},0);
    var paid=saleIdPaid+monthPaid;
    var rawPending=a.total-paid; // negative = overpaid
    var pending=Math.max(0,rawPending);
    var overpaid=rawPending<0?Math.abs(rawPending):0;
    var status=overpaid>0?'overpaid':paid<=0?'pending':pending<=0?'paid':'partial';
    return Object.assign({},a,{paid:paid,pending:pending,overpaid:overpaid,status:status});
  }).filter(function(a){return a.total>0||a.paid>0;});

  // Search filter
  var q=r4PaySearch.toLowerCase();
  if(q)rows=rows.filter(function(a){return a.name.toLowerCase().includes(q);});
  if(r4PayStatus)rows=rows.filter(function(a){return a.status===r4PayStatus;});
  rows.sort(function(a,b){return a.name.localeCompare(b.name);});

  // Summary
  var totComm=rows.reduce(function(t,a){return t+a.total;},0);
  var totPaid=rows.reduce(function(t,a){return t+a.paid;},0);
  var totPending=rows.reduce(function(t,a){return t+a.pending;},0);
  var pendCount=rows.filter(function(a){return a.status==='pending'||a.status==='partial';}).length;

  var html='';

  // Summary cards
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px">';
  html+='<div class="stat"><div class="sl">💰 Total Commission</div><div class="sv">₹'+fmtL(totComm)+'</div></div>';
  html+='<div class="stat" style="border-left:3px solid var(--gr)"><div class="sl">✅ Total Paid</div><div class="sv" style="color:var(--gr)">₹'+fmtL(totPaid)+'</div></div>';
  html+='<div class="stat" style="border-left:3px solid var(--am)"><div class="sl">🟡 Pending</div><div class="sv" style="color:var(--am)">₹'+fmtL(totPending)+'<div style="font-size:11px">('+pendCount+' associates)</div></div></div>';
  html+='</div>';

  // Filters
  html+='<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">'
    +'<input type="text" id="payAssocSearch" placeholder="🔍 Associate search..." value="'+esc(r4PaySearch)+'" oninput="r4PaySearch=this.value;_paySearchFocus=true;render()" style="flex:1;min-width:160px;font-size:13px;padding:7px 10px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)"/>'
    +'<select onchange="r4PayStatus=this.value;render()" style="font-size:13px;padding:7px 10px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)">'
    +'<option value="">All Status</option>'
    +'<option value="pending"'+(r4PayStatus==='pending'?' selected':'')+'>🟡 Pending</option>'
    +'<option value="partial"'+(r4PayStatus==='partial'?' selected':'')+'>🔵 Partial</option>'
    +'<option value="paid"'+(r4PayStatus==='paid'?' selected':'')+'>✅ Paid</option>'
    +'</select>'
    +(r4PaySearch||r4PayStatus?'<button class="btn bgh bsm" onclick="clearPayFilters()">✕ Clear</button>':'')
    +'</div>';

  if(!rows.length){
    return html+'<div class="empty">No commission data found</div>';
  }

  // Table
  html+='<div class="tw"><table><thead><tr>'
    +'<th>#</th><th>Associate</th><th>Total Commission</th><th>Paid</th><th>Pending</th><th>Status</th><th>Action</th>'
    +'</tr></thead><tbody>';

  rows.forEach(function(a,i){
    var statusBadge=a.status==='overpaid'
      ?'<span class="badge" style="background:#fff0e0;color:#c45c00;border:1px solid #c45c00">⚠️ Overpaid</span>'
      :a.status==='paid'
      ?'<span class="badge bgn">✅ Paid</span>'
      :a.status==='partial'
      ?'<span class="badge bbl2">🔵 Partial</span>'
      :'<span class="badge bam">🟡 Pending</span>';

    var lastPay=D.payments.filter(function(p){return p.assocId===a.id;}).sort(function(a,b){return (b.payDate||'').localeCompare(a.payDate||'');});
    var lastDate=lastPay.length?lastPay[0].payDate:'—';

    html+='<tr style="background:'+(a.overpaid>0?'#fff8f0':'')+'">'
      +'<td style="color:var(--t3)">'+(i+1)+'</td>'
      +'<td><b data-aid="'+a.id+'" onclick="pushHistory();r4PayAssoc=this.dataset.aid;render()" style="cursor:pointer;color:var(--bl)">'+esc(a.name)+'</b>'
      +'<div style="font-size:10px;color:var(--t3)">Last pay: '+lastDate+'</div></td>'
      +'<td style="font-weight:700">₹'+fmt(a.total)+'</td>'
      +'<td style="color:var(--gr);font-weight:700">₹'+fmt(a.paid)+'</td>'
      +'<td style="font-weight:700;color:'+(a.overpaid>0?'#c45c00':'var(--am)')+'">'+( a.overpaid>0?'⚠️ +₹'+fmt(a.overpaid)+' Overpaid':'₹'+fmt(a.pending))+'</td>'
      +'<td>'+statusBadge+'</td>'
      +'<td>'
      +'<button class="btn bbl bsm" data-aid="'+a.id+'" onclick="pushHistory();r4PayAssoc=this.dataset.aid;render()" style="margin-right:4px">📋 Detail</button>'
      +(a.status==='pending'||a.status==='partial'?'<button class="btn bsm" data-aid="'+a.id+'" onclick="openMarkPaidModal(this.dataset.aid)" style="background:var(--grb);color:var(--gr);border:1px solid var(--gr)">💳 Pay</button>':a.status==='overpaid'?'<button class="btn bsm" data-aid="'+a.id+'" onclick="pushHistory();r4PayAssoc=this.dataset.aid;render()" style="background:#fff0e0;color:#c45c00;border:1px solid #c45c00">🔍 Review</button>':'')
      +'</td>'
      +'</tr>';
  });

  html+='</tbody></table></div>';
  return html;
}

window.payAllPending=function(assocId){
  var pendingRows=[];
  var today=new Date().toISOString().slice(0,10);
  D.sales.forEach(function(s){
    var inChain=(s.commissions&&s.commissions.some(function(c){return c.id===assocId;}))||(s.defCommissions&&s.defCommissions.some(function(c){return c.id===assocId;}));
    if(!inChain&&s.sellerId!==assocId)return;
    var alreadyPaid=D.payments.some(function(p){return p.assocId===assocId&&p.saleId===s.id;});
    if(alreadyPaid)return;
    var cm=(s.commissions||[]).find(function(c){return c.id===assocId;});
    var df=(s.defCommissions||[]).find(function(c){return c.id===assocId;});
    var comm=(cm?cm.total:0)+(df?df.amount:0);
    if(comm>0)pendingRows.push({s:s,comm:comm});
  });
  if(!pendingRows.length){toast('No pending payments found!',false);return;}
  var total=pendingRows.reduce(function(t,r){return t+r.comm;},0);
  if(!D.advances)D.advances=[];
  var pendAdv=D.advances.filter(function(adv){return adv.assocId===assocId&&adv.status==='pending';});
  var totalAdvBal=pendAdv.reduce(function(t,adv){return t+adv.amount;},0);
  var advMsg=totalAdvBal>0?'\n\nAdvance Balance: ₹'+fmt(totalAdvBal)+' will be adjusted':'';
  if(!confirm('⚠️ '+pendingRows.length+' pending payments to mark at once?\n\nTotal: ₹'+fmt(total)+'\nDate: '+today+'\nMode: Online'+advMsg+'\n\nConfirm?'))return;
  if(!D.payments)D.payments=[];
  var a=D.associates.find(function(x){return x.id===assocId;});
  var advRemaining=totalAdvBal;
  pendingRows.forEach(function(row){
    var advUsed=0;var netPaid=row.comm;
    if(advRemaining>0){
      advUsed=Math.min(advRemaining,row.comm);
      netPaid=Math.max(0,row.comm-advUsed);
      advRemaining-=advUsed;
    }
    D.payments.push({
      id:'_pay'+Date.now()+Math.random().toString(36).substr(2,5),
      assocId:assocId,assocName:(a||{}).name||'',
      saleId:row.s.id,projName:row.s.projName,plotNo:row.s.plotNo,
      paid:row.comm,amount:row.comm,
      advanceDeducted:advUsed>0?advUsed:undefined,
      netPaid:netPaid,mode:'Online',payDate:today,utr:'',
      note:'Bulk payment'+(advUsed>0?' [Advance ₹'+fmt(advUsed)+' deducted]':''),
      markedBy:SESSION?SESSION.name:'Admin',createdAt:new Date().toISOString()
    });
  });
  if(totalAdvBal>advRemaining){
    var toUse=totalAdvBal-advRemaining;
    pendAdv.forEach(function(adv){
      var ai=D.advances.findIndex(function(x){return x.id===adv.id;});
      if(ai<0||toUse<=0)return;
      if(adv.amount<=toUse){D.advances[ai].status='used';D.advances[ai].usedAt=new Date().toISOString();toUse-=adv.amount;}
      else{
        D.advances.push(Object.assign({},adv,{id:'_adv'+Date.now()+Math.random().toString(36).substr(2,5),amount:toUse,status:'used',usedAt:new Date().toISOString()}));
        D.advances[ai].amount=adv.amount-toUse;toUse=0;
      }
    });
  }
  saveD();toast('✅ '+pendingRows.length+' payments marked! Total: ₹'+fmt(total)+(totalAdvBal>advRemaining?' (Advance ₹'+fmt(totalAdvBal-advRemaining)+' adjusted)':''));render();
};

function rpt4PayDetail(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a)return '<div class="empty">Associate not found</div>';

  function isSalePaid(sid){return D.payments.some(function(p){return p.assocId===assocId&&p.saleId===sid;});}
  function getSalePay(sid){
    return D.payments.filter(function(p){return p.assocId===assocId&&p.saleId===sid;})
      .sort(function(a,b){return (b.payDate||'').localeCompare(a.payDate||'');})[0]||null;
  }
  function getAllSalePays(sid){
    return D.payments.filter(function(p){return p.assocId===assocId&&p.saleId===sid;})
      .sort(function(a,b){return (b.payDate||'').localeCompare(a.payDate||'');});
  }
  var oldPays=D.payments.filter(function(p){return p.assocId===assocId&&!p.saleId;});
  var oldPaidAmt=oldPays.reduce(function(t,p){return t+(p.paid||p.amount||0);},0);

    var sp=getSalePay(s.id);
    var paid=sp?(sp.paid||sp.amount||0):0;
    projMap[pk].sales.push({s:s,comm:comm,paid:paid,isSelf:s.sellerId===assocId});
    projMap[pk].total+=comm;
    projMap[pk].paid+=paid;

  var projArr=Object.values(projMap).sort(function(a,b){return b.total-a.total;});

    +'<div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">'
    +'<button class="btn bsm" style="background:var(--amb);color:var(--am);border:1px solid var(--am);white-space:nowrap" data-aid="'+assocId+'" onclick="openAddAdvanceModal(this.dataset.aid)">💵 Add Advance</button>'

window.openLedgerWindow=function(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a){toast('Associate not found',false);return;}

  // Build ledger data
  var ledger=[];
  D.sales.forEach(function(s){
    var cm=(s.commissions||[]).find(function(c){return c.id===assocId;});
    var df=(s.defCommissions||[]).find(function(c){return c.id===assocId;});
    var comm=(cm?cm.total:0)+(df?df.amount:0);
    if(comm>0)ledger.push({date:s.closeDate||s.bookingDate||'',type:'COMMISSION',
      label:'Commission — '+s.projName+' Plot '+s.plotNo,amount:comm,dir:1});
  });
  (D.advances||[]).filter(function(adv){return adv.assocId===assocId;}).forEach(function(adv){
    if(adv.status==='pending'||adv.status==='used')
      ledger.push({date:adv.advDate||adv.createdAt||'',type:'ADVANCE PAID',
        label:'Advance Paid — '+(adv.reason||'General'),amount:adv.amount,dir:-1});
    if(adv.status==='deposit_received')
      ledger.push({date:adv.advDate||adv.createdAt||'',type:'DEPOSIT',
        label:'Deposit Received — '+(adv.reason||'General'),amount:adv.amount,dir:1});
    if(adv.status==='used'&&adv.usedInSale)
      ledger.push({date:adv.usedAt||adv.createdAt||'',type:'ADV ADJUST',
        label:'Advance Adjusted from commission',amount:adv.amount,dir:1});
    if(adv.status==='refunded')
      ledger.push({date:adv.refundedAt||adv.createdAt||'',type:'REFUND',
        label:'Advance Returned — '+(adv.reason||''),amount:adv.amount,dir:1});
  });
  (D.payments||[]).filter(function(p){return p.assocId===assocId;}).forEach(function(p){
    var amt=p.paid||p.amount||0;
    if(amt>0)ledger.push({date:p.payDate||'',type:'PAYMENT',
      label:'Payment — '+(p.projName||'')+(p.plotNo?' Plot '+p.plotNo:'')+(p.mode?' ('+p.mode+')':'')+(p.utr?' · '+p.utr:''),

    +(a.accNo?'<div class="assoc-sub">A/C: '+a.accNo+(a.ifsc?' · IFSC: '+a.ifsc:'')+'</div>':'')

window.expAssocLedger=function(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a)return;
  var rows=[['Date','Type','Description','Credit (+)','Debit (-)','Balance','Balance Type']];
  var ledger=[];
  D.sales.forEach(function(s){
    var cm=(s.commissions||[]).find(function(c){return c.id===assocId;});
    var df=(s.defCommissions||[]).find(function(c){return c.id===assocId;});
    var comm=(cm?cm.total:0)+(df?df.amount:0);
    if(comm>0)ledger.push({date:s.closeDate||s.bookingDate||'',type:'COMMISSION',label:'Commission — '+s.projName+' Plot '+s.plotNo,amount:comm,dir:1});
  });
  (D.advances||[]).filter(function(adv){return adv.assocId===assocId;}).forEach(function(adv){
    if(adv.status==='pending'||adv.status==='used')
      ledger.push({date:adv.advDate||adv.createdAt||'',type:'advance',
        label:'Advance Paid — '+(adv.reason||'General'),amount:adv.amount,dir:-1});
    if(adv.status==='deposit_received')
      ledger.push({date:adv.advDate||adv.createdAt||'',type:'deposit',
        label:'Deposit Received — '+(adv.reason||'General'),amount:adv.amount,dir:1});
    if(adv.status==='used'&&adv.usedInSale)
      ledger.push({date:adv.usedAt||adv.createdAt||'',type:'ADV ADJUST',label:'Advance Adjusted',amount:adv.amount,dir:1});
    if(adv.status==='refunded')
      ledger.push({date:adv.refundedAt||adv.createdAt||'',type:'REFUND',label:'Refund — '+(adv.reason||''),amount:adv.amount,dir:1});
  });
  (D.payments||[]).filter(function(p){return p.assocId===assocId;}).forEach(function(p){
    var amt=p.paid||p.amount||0;
    if(amt>0)ledger.push({date:p.payDate||'',type:'PAYMENT',label:'Payment — '+(p.projName||'')+(p.plotNo?' Plot '+p.plotNo:'')+(p.mode?' · '+p.mode:''),amount:amt,dir:-1});
  });
  ledger.sort(function(a,b){return (a.date||'').substr(0,10).localeCompare((b.date||'').substr(0,10));});
  var bal=0;
  ledger.forEach(function(e){
    bal+=e.dir*e.amount;
    rows.push([
      e.date?e.date.substr(0,10):'',e.type,e.label,
      e.dir>0?e.amount:0,e.dir<0?e.amount:0,
      Math.abs(Math.round(bal)),bal>0?'CR':bal<0?'DR':'NIL'
    ]);
  });
  rows.push(['','','CLOSING BALANCE','','',Math.abs(Math.round(bal)),bal>0?'CR (Company to pay)':bal<0?'DR (Associate to pay)':'SETTLED']);
  var wb=XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb,ws,'Ledger');
  XLSX.writeFile(wb,a.name.replace(/[^a-zA-Z0-9 ]/g,'')+'_Ledger.xlsx');
  toast('✅ Ledger exported!');
};

window.savePayEditPin=function(){
  var pin=((document.getElementById('payPinNew')||{}).value||'').trim();

  if(!/^\d+$/.test(pin)){toast('PIN must contain numbers only!',false);return;}
  var auth=getAuth();
  auth.payEditPin=pin;

};

};

window.verifyPayEditPin=function(dsJson){
  try{
    var ds=JSON.parse(dsJson);
    var auth=getAuth();
    var pin=auth&&auth.payEditPin;
    var input=((document.getElementById('payEditPinInput')||{}).value||'').trim();
    if(input===pin){closeM();openPlotPayModal(ds);}
    else{
      var err=document.getElementById('payPinErr');
      if(err){err.style.display='block';}
      var inp=document.getElementById('payEditPinInput');
      if(inp){inp.value='';inp.focus();}
    }
  }catch(e){toast('Error: '+e.message,false);}
};

window.savePlotPayment=function(btn){
  var assocId=btn.dataset.aid, saleId=btn.dataset.sid;
  var projName=btn.dataset.proj||'', plotNo=btn.dataset.plot||'';
  var editId=(btn.dataset.editid||'').trim();
  var mode=(document.getElementById('pmMode')||{}).value||'Online';
  var payDate=(document.getElementById('pmDate')||{}).value||new Date().toISOString().slice(0,10);
  var amt=parseFloat((document.getElementById('pmAmt')||{}).value||'0');
  var utr=((document.getElementById('pmUtr')||{}).value||'').trim();
  var note=((document.getElementById('pmNote')||{}).value||'').trim();
  var advCbCheck=document.getElementById('pmAdvAdj');
  var isAdvFullyCovered=advCbCheck&&advCbCheck.checked&&amt===0;
  if(!isAdvFullyCovered&&(!amt||amt<0)){toast('Please enter amount!',false);return;}
  if(!D.payments)D.payments=[];

  // Edit existing
  if(editId){
    var ei=D.payments.findIndex(function(p){return p.id===editId;});
    if(ei>=0){
      D.payments[ei].mode=mode; D.payments[ei].payDate=payDate;
      D.payments[ei].paid=amt; D.payments[ei].amount=amt;
      D.payments[ei].utr=utr; D.payments[ei].note=note;
      D.payments[ei].editedBy=SESSION?SESSION.name:'Admin';
      D.payments[ei].editedAt=new Date().toISOString();
      saveD();closeM();toast('✅ Payment updated!');render();return;
    }
  }

  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!D.advances)D.advances=[];

  // Duplicate payment guard — for same saleId+assocId
  var alreadyPaid=D.payments.find(function(p){return p.saleId===saleId&&p.assocId===assocId;});
  if(alreadyPaid){
    if(!confirm('⚠️ A payment already exists for this sale (₹'+fmt(alreadyPaid.paid||alreadyPaid.amount||0)+' on '+alreadyPaid.payDate+'). Save anyway?'))return;
  }

  // Advance adjust — user selected checkbox
  if(!D.advances)D.advances=[];
  var commAmt2=parseFloat(btn.dataset.comm||amt);
  var totalAdvBalance2=parseFloat(btn.dataset.advbal||0);
  var advCb=document.getElementById('pmAdvAdj');
  var doAdvAdj=advCb&&advCb.checked&&totalAdvBalance2>0;
  var pendingAdvances=D.advances.filter(function(adv){return adv.assocId===assocId&&adv.status==='pending';});
  var totalAdvance=pendingAdvances.reduce(function(t,adv){return t+adv.amount;},0);
  var finalAmt=amt;
  var advanceUsed=0;
  if(doAdvAdj&&totalAdvance>0){
    advanceUsed=Math.min(totalAdvance,commAmt2);
    finalAmt=Math.max(0,commAmt2-advanceUsed);
    // FIFO — mark advances as used
    var remaining=advanceUsed;
    pendingAdvances.forEach(function(adv){
      var ai=D.advances.findIndex(function(x){return x.id===adv.id;});
      if(ai<0||remaining<=0)return;
      if(adv.amount<=remaining){
        D.advances[ai].status='used';
        D.advances[ai].usedAt=new Date().toISOString();
        D.advances[ai].usedInSale=saleId;
        remaining-=adv.amount;
      } else {
        // Partial use — split
        D.advances.push(Object.assign({},adv,{
          id:'_adv'+Date.now()+Math.random().toString(36).substr(2,5),
          amount:remaining,status:'used',
          usedAt:new Date().toISOString(),usedInSale:saleId
        }));
        D.advances[ai].amount=adv.amount-remaining;
        remaining=0;
      }
    });
  }

  var commissionAmt=advanceUsed>0?commAmt2:amt; // save full commission value
  D.payments.push({
    id:'_pay'+Date.now()+Math.random().toString(36).substr(2,5),
    assocId:assocId,
    assocName:(a||{}).name||'',
    saleId:saleId,
    projName:projName,
    plotNo:plotNo,
    paid:commissionAmt, amount:commissionAmt, // full commission — advance adjusted
    advanceDeducted:advanceUsed>0?advanceUsed:undefined,
    netPaid:finalAmt, // actual cash paid (commission - advance)
    mode:mode, payDate:payDate,
    utr:utr, note:note+(advanceUsed>0?' [Advance ₹'+fmt(advanceUsed)+' deducted — Net: ₹'+fmt(finalAmt)+']':''),
    markedBy:SESSION?SESSION.name:'Admin',
    createdAt:new Date().toISOString()
  });
  logAct('Payment: '+(a?a.name:assocId)+' | '+projName+' Plot '+plotNo+' | ₹'+fmt(commissionAmt)+(advanceUsed>0?' [Adv ₹'+fmt(advanceUsed)+' adjusted]':''));

  if(advanceUsed>0){
    toast('✅ Payment saved! Advance ₹'+fmt(advanceUsed)+' deducted — Net pay: ₹'+fmt(finalAmt));
  }

  saveD(); closeM();

  // WhatsApp
  var waNum=a&&a.phone?a.phone.replace(/[^0-9]/g,''):'';
  if(waNum.length===10)waNum='91'+waNum;
  var msg='Dear '+((a&&a.name)||'')+',\n\nYour commission payment for '+projName+' Plot '+plotNo+' has been processed.\n\nCommission: Rs.'+fmt(commissionAmt)+(advanceUsed>0?'\nAdvance Adjusted: Rs.'+fmt(advanceUsed)+'\nNet Cash: Rs.'+fmt(finalAmt):'')+' \nMode: '+mode+(utr?'\nUTR/Ref: '+utr:'')+'\nDate: '+payDate+'\n\n— TrueStars Real Estate';
  toast('✅ Payment saved!');
  if(waNum){
    setTimeout(function(){
      if(confirm('Send WhatsApp payment slip?')){
        window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg),'_blank');
      }
    },300);
  }
  render();
};

window.deletePaymentConfirm=function(payId){
  if(!confirm('Are you sure you want to delete this payment record?'))return;
  var idx=D.payments.findIndex(function(p){return p.id===payId;});
  if(idx<0)return;
  var p=D.payments[idx];
  // Restore advance — if advance was deducted, mark back as pending
  if(p.advanceDeducted&&p.advanceDeducted>0&&p.saleId){
    if(!D.advances)D.advances=[];
    var toRestore=p.advanceDeducted;
    D.advances.forEach(function(adv,ai){
      if(adv.usedInSale===p.saleId&&adv.assocId===p.assocId&&adv.status==='used'&&toRestore>0){
        D.advances[ai].status='pending';
        delete D.advances[ai].usedInSale;
        delete D.advances[ai].usedAt;
        toRestore-=adv.amount;
      }
    });
  }
  logAct('Payment Deleted: '+(p.assocName||p.assocId)+' | '+(p.projName||'')+' Plot '+(p.plotNo||'')+' | ₹'+fmt(p.paid||p.amount||0));
  D.payments.splice(idx,1);
  saveD();toast('Payment deleted!');closeM();render();
};

    +'<ul style="margin:8px 0 0 16px;font-size:12px;line-height:1.8">'
    +'<li>This scan is <b>read-only</b> — no data will be changed</li>'
    +'<li>It only <b>reports problems</b> — you can fix them manually</li>'
    +'<li><b>'+totalRecords+' records</b> scan honge (Associates + Sales + Payments)</li>'
    +'<li>Scan will take <b>1-2 seconds</b></li>'
    +'</ul></div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn bbl" onclick="closeM();runIntegrityScanner()">✅ Understood — Run Scan</button>'
    +'<button class="btn bgh" onclick="closeM()">Cancel</button>'
    +'</div>';
  openM(html);
};

window.runIntegrityScanner=function(){
  var issues=[];
  var warnings=[];

  // ── CHECK 1: Associate totalGaj vs actual sales ──
  D.associates.forEach(function(a){
    // Actual gaj from sales (commissions array)
    var actualSalesGaj=D.sales.filter(function(s){
      return s.commissions&&s.commissions.some(function(cm){return cm.id===a.id;});
    }).reduce(function(t,s){return t+(s.plotGaj||0);},0);
    // Defence sales gaj (separate chain)
    var defGaj=D.sales.filter(function(s){
      return s.defCommissions&&s.defCommissions.some(function(cm){return cm.id===a.id;})
        &&!(s.commissions&&s.commissions.some(function(cm){return cm.id===a.id;}));
    }).reduce(function(t,s){return t+(s.plotGaj||0);},0);
    var actualFromSales=Math.round((actualSalesGaj+defGaj)*100)/100;

    // Manually added "Other Gaj" = totalGaj - salesGaj (system tracked)
    var storedSalesGaj=Math.round((a.salesGaj||0)*100)/100;
    var otherGajManual=Math.max(0,Math.round(((a.totalGaj||0)-storedSalesGaj)*100)/100);

    // Correct totalGaj = actual sales gaj + manually added gaj
    var correctTotal=Math.round((actualFromSales+otherGajManual)*100)/100;
    var stored=Math.round((a.totalGaj||0)*100)/100;

    // salesGaj mismatch check (stored vs actual)
    var salesGajMismatch=Math.abs(storedSalesGaj-actualFromSales)>0.1;
    // totalGaj mismatch — accounting for Other Gaj
    var totalGajMismatch=Math.abs(stored-correctTotal)>0.1;

    if(salesGajMismatch||totalGajMismatch){
      var msg='';
      if(salesGajMismatch)msg+='salesGaj mismatch: stored='+storedSalesGaj+', actual='+actualFromSales+'. ';
      if(totalGajMismatch)msg+='totalSq.Yd: stored='+stored+', correct='+correctTotal+' (sales '+actualFromSales+' + manual '+otherGajManual+')';
      issues.push({
        type:'gaj_mismatch',cat:'associate',severity:'high',
        id:a.id,name:a.name,
        msg:msg.trim(),
        fix:{field:'totalGaj',correctVal:correctTotal,salesGajVal:actualFromSales}
      });
    }
  });

  // ── CHECK 2: Orphan parentId ──
  D.associates.forEach(function(a){
    if(a.parentId){
      var exists=D.associates.find(function(x){return x.id===a.parentId;});
      if(!exists){
        issues.push({
          type:'orphan_parent',cat:'associate',severity:'medium',
          id:a.id,name:a.name,
          msg:'Upliner (parentId='+a.parentId+') does not exist',
          fix:{field:'parentId',correctVal:null}
        });
      }
    }
  });

  // ── CHECK 3: Circular hierarchy ──
  D.associates.forEach(function(a){
    var visited={};
    var cur=a;
    while(cur&&cur.parentId){
      if(visited[cur.id]){
        issues.push({
          type:'circular',cat:'associate',severity:'critical',
          id:a.id,name:a.name,
          msg:'Circular hierarchy detected! Stuck in a loop.',
          fix:{field:'parentId',correctVal:null}
        });
        break;
      }
      visited[cur.id]=true;
      cur=D.associates.find(function(x){return x.id===cur.parentId;});
    }
  });

  // ── CHECK 4: Duplicate phone ──
  var phoneMap={};
  D.associates.forEach(function(a){
    if(a.phone&&a.phone.trim()){
      var ph=a.phone.replace(/\D/g,'');
      if(ph.length>=10){
        if(phoneMap[ph]){
          warnings.push({
            type:'dup_phone',cat:'associate',severity:'low',
            id:a.id,name:a.name,
            msg:'Duplicate phone '+a.phone+' (same as '+phoneMap[ph]+')'
          });
        } else {
          phoneMap[ph]=a.name;
        }
      }
    }
  });

  // ── CHECK 5: Duplicate PAN ──
  var panMap={};
  D.associates.forEach(function(a){
    if(a.pan&&a.pan.trim()){
      var pan=a.pan.trim().toUpperCase();
      if(panMap[pan]){
        warnings.push({
          type:'dup_pan',cat:'associate',severity:'medium',
          id:a.id,name:a.name,
          msg:'Duplicate PAN '+pan+' (same as '+panMap[pan]+')'
        });
      } else {
        panMap[pan]=a.name;
      }
    }
  });

  // ── CHECK 6: Sale orphan (project/plot missing) ──
  D.sales.forEach(function(s){
    var proj=D.projects.find(function(p){return p.id===s.projId;});
    if(!proj){
      issues.push({
        type:'orphan_sale_proj',cat:'sale',severity:'high',
        id:s.id,name:s.projName+' Plot '+s.plotNo,
        msg:'Project ('+s.projId+') does not exist'
      });
    }
    if(!s.sellerId||!D.associates.find(function(a){return a.id===s.sellerId;})){
      warnings.push({
        type:'orphan_seller',cat:'sale',severity:'medium',
        id:s.id,name:s.projName+' Plot '+s.plotNo,
        msg:'Seller associate ('+s.sellerId+') does not exist'
      });
    }
  });

  // ── CHECK 7: Date mismatch ──
  D.sales.forEach(function(s){
    if(s.bookingDate&&s.closeDate&&s.closeDate<s.bookingDate){
      issues.push({
        type:'date_mismatch',cat:'sale',severity:'medium',
        id:s.id,name:s.projName+' Plot '+s.plotNo,
        msg:'Closing date ('+s.closeDate+') is before booking date ('+s.bookingDate+')!'
      });
    }
  });

  // ── CHECK 8: Payment stale saleIds ──
  if(D.payments&&D.payments.length){
    D.payments.forEach(function(p){
      var stale=(p.saleIds||[]).filter(function(sid){
        return !D.sales.find(function(s){return s.id===sid;});
      });
      if(stale.length>0){
        warnings.push({
          type:'stale_payment',cat:'payment',severity:'low',
          id:p.id,name:p.assocName+' ('+p.month+')',
          msg:stale.length+' payment records for deleted sales',
          fix:{removeSaleIds:stale}
        });
      }
    });
  }

  // ── CHECK 9: Duplicate sale (same project + same plot) ──
  var saleKey={};
  D.sales.forEach(function(s){
    var key=s.plotId||(s.projId+'__'+String(s.plotNo).trim().toLowerCase());
    if(!saleKey[key]){
      saleKey[key]=[];
    }
    saleKey[key].push(s);
  });
  Object.keys(saleKey).forEach(function(key){
    var group=saleKey[key];
    if(group.length>1){
      var names=group.map(function(s){
        return s.projName+' Plot '+s.plotNo+' (Seller: '+(s.sellerName||'?')+', Date: '+(s.bookingDate||'?')+')';
      });
      issues.push({
        type:'duplicate_sale',cat:'sale',severity:'high',
        id:group[0].id,
        name:group[0].projName+' — Plot '+group[0].plotNo,
        msg:'Sold '+group.length+' times — '+names.join(' | ')
      });
    }
  });

  // ── CHECK 10: Plot already sold but status mismatch ──
  D.sales.forEach(function(s){
    var proj=D.projects.find(function(p){return p.id===s.projId;});
    if(!proj||!proj.plots)return;
    var plot=proj.plots.find(function(pl){
      return pl.id===s.plotId||(String(pl.plotNo).trim().toLowerCase()===String(s.plotNo).trim().toLowerCase());
    });
    if(plot&&plot.status!=='sold'){
      issues.push({
        type:'plot_status_mismatch',cat:'sale',severity:'medium',
        id:s.id,
        name:s.projName+' Plot '+s.plotNo,
        msg:'Sale exists but plot status is "'+( plot.status||'available')+'" — should be "sold"'
      });
    }
  });

  // ── CHECK 11: Orphan payments — linked sale or associate does not exist ──
  if(D.payments&&D.payments.length){
    D.payments.forEach(function(p){
      // Associate missing
      if(p.assocId&&!D.associates.find(function(a){return a.id===p.assocId;})){
        warnings.push({
          type:'orphan_payment_assoc',cat:'payment',severity:'medium',
          id:p.id,name:(p.assocName||p.assocId)+' — ₹'+fmt(p.paid||p.amount||0),
          msg:'Payment associate does not exist (deleted?) — ₹'+fmt(p.paid||p.amount||0)+' on '+(p.payDate||'?')
        });
      }
      // Sale missing (for plot-based payments)
      if(p.saleId&&!D.sales.find(function(s){return s.id===p.saleId;})){
        warnings.push({
          type:'orphan_payment_sale',cat:'payment',severity:'medium',
          id:p.id,name:(p.assocName||'?')+' — '+( p.projName||'?')+' Plot '+(p.plotNo||'?'),
          msg:'Payment sale record does not exist (deleted?) — ₹'+fmt(p.paid||p.amount||0)+' on '+(p.payDate||'?')
        });
      }
    });
  }

  // ── RENDER RESULT ──
  var el=document.getElementById('scannerResult');
  if(!el){
    // Show in modal if called from modal
    showScannerResult(issues,warnings);
    return;
  }
  el.style.display='block';
  
  var totalIssues=issues.length+warnings.length;
  if(totalIssues===0){
    el.innerHTML='<div class="info igr" style="display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:24px">✅</span>'
      +'<div><b>All clear!</b><div style="font-size:12px">'+D.associates.length+' associates, '+D.sales.length+' sales, '+(D.payments||[]).length+' payments — no issues found.</div></div>'
      +'</div>';
    return;
  }

  var html='';
  // Summary
  html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">'
    +'<div style="background:var(--reb);border-radius:8px;padding:8px;text-align:center">'
    +'<div style="font-size:18px;font-weight:700;color:var(--re)">'+issues.filter(function(i){return i.severity==='critical';}).length+'</div>'
    +'<div style="font-size:11px;color:var(--re)">Critical</div></div>'
    +'<div style="background:var(--amb);border-radius:8px;padding:8px;text-align:center">'
    +'<div style="font-size:18px;font-weight:700;color:var(--am)">'+issues.filter(function(i){return i.severity!=='critical';}).length+'</div>'
    +'<div style="font-size:11px;color:var(--am)">Issues</div></div>'
    +'<div style="background:var(--blb);border-radius:8px;padding:8px;text-align:center">'
    +'<div style="font-size:18px;font-weight:700;color:var(--bl)">'+warnings.length+'</div>'
    +'<div style="font-size:11px;color:var(--bl)">Warnings</div></div>'
    +'</div>';

  window._scanIssues=issues;

  // Issues list
  if(issues.length>0){
    html+='<div style="font-size:12px;font-weight:700;color:var(--re);margin-bottom:6px">❌ Issues ('+issues.length+')</div>';
    issues.forEach(function(issue){
      // What to do guidance
      var guide='';
      if(issue.type==='gaj_mismatch')guide='Manual fix: Associate Edit → Use Add Sq.Yd to correct, or delete and re-enter the sale';
      else if(issue.type==='orphan_parent')guide='Manual fix: Associate Edit → Set the correct Upliner';
      else if(issue.type==='circular')guide='Manual fix: Associate Edit → Remove Upliner (set to Top Level)';
      else if(issue.type==='orphan_sale_proj')guide='Manual fix: Delete this sale (from Sales Record)';
      else if(issue.type==='duplicate_sale')guide='Manual fix: Go to Sales Record — delete the duplicate, keep only one entry';
      else if(issue.type==='plot_status_mismatch')guide='Manual fix: Projects → Edit Plot → set status to "Sold"';
      html+='<div style="background:var(--reb);border:1px solid var(--re);border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:12px">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">'
        +'<b style="color:var(--re)">'+esc(issue.name)+'</b>'
        +'<span style="font-size:10px;padding:2px 6px;border-radius:3px;background:var(--re);color:#fff;white-space:nowrap;margin-left:8px;flex-shrink:0">'
        +(issue.severity==='critical'?'🚨 Critical':issue.severity==='high'?'🔴 High':'🟡 Medium')+'</span>'
        +'</div>'
        +'<div style="color:var(--t2);margin-bottom:'+(guide?'4':'0')+'px">'+issue.msg+'</div>'
        +(guide?'<div style="color:var(--am);font-size:11px;background:var(--amb);padding:3px 8px;border-radius:5px">💡 '+guide+'</div>':'')
        +'</div>';
    });
  }

  // Warnings list
  if(warnings.length>0){
    html+='<div style="font-size:12px;font-weight:700;color:var(--bl);margin:8px 0 6px">⚠️ Warnings ('+warnings.length+')</div>';
    warnings.forEach(function(w){
      html+='<div style="background:var(--blb);border:1px solid var(--bl);border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:12px">'
        +'<b style="color:var(--bl)">'+esc(w.name)+'</b>'
        +'<div style="color:var(--t2);margin-top:2px">'+w.msg+'</div>'
        +'</div>';
    });
  }

  el.innerHTML=html;
};

function backupData(){
  var json=JSON.stringify(D,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var now=new Date();
  var ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  a.href=url;a.download='TrueStars_Backup_'+ts+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
  logAct('Data Backup liya');toast('✅ Backup downloaded! TrueStars_Backup_'+ts+'.json');
}
function restoreData(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      // Validate structure
      if(typeof imported!=='object'||!Array.isArray(imported.projects)||!Array.isArray(imported.associates)||!Array.isArray(imported.sales)){
        toast('❌ Invalid backup file! projects/associates/sales missing.',false);return;
      }
      if(!confirm('⚠️ This will restore data.\n\nProjects: '+imported.projects.length+'\nAssociates: '+imported.associates.length+'\nSales: '+imported.sales.length+'\n\nThis will replace all current data. Confirm?'))return;
      D=imported;
      if(!D.deleted)D.deleted={associates:[],sales:[],projects:[]};
      if(!D.transfers)D.transfers=[];
      if(!D.payments)D.payments=[];
      if(!D.advances)D.advances=[];
      if(!D.config)D.config={};
      if(!D.offers)D.offers=[];
      saveD();
      toast('✅ Data restored! Projects:'+D.projects.length+' Associates:'+D.associates.length+' Sales:'+D.sales.length);
      TAB='dashboard';render();
    }catch(err){toast('❌ File read error: '+err.message,false);}
  };
  reader.readAsText(file);
}

window.saveNewStaff=function(){
  var name=((document.getElementById('stName')||{}).value||'').trim();
  var uid=((document.getElementById('stId')||{}).value||'').trim().toLowerCase();
  var pwd=(document.getElementById('stPwd')||{}).value||'';
  var pwd2=(document.getElementById('stPwd2')||{}).value||'';
  if(!name||!uid||!pwd){toast('Name, User ID and Password are required!',false);return;}
  if(pwd.length<6){toast('Password must be at least 6 characters!',false);return;}
  if(pwd!==pwd2){toast('Passwords do not match!',false);return;}
  if(uid==='admin'){toast('This User ID is reserved!',false);return;}
  var auth=getAuth();
  if((auth.staff||[]).find(function(s){return s.id===uid;})){toast('This User ID already exists!',false);return;}
  if((auth.staff||[]).length>=5){toast('Maximum 5 staff members allowed!',false);return;}
  if(!auth.staff)auth.staff=[];
  auth.staff.push({id:uid,name:name,pwd:hashPwd(pwd),perms:Object.assign({},DEFAULT_PERMS)});
  saveAuth(auth);
  logAct('New Staff Add: '+name+' ('+uid+')');
  toast(name+' staff add ho gaya! ✓');closeM();render();
};

window.togglePerm=function(staffId,perm){
  var auth=getAuth();
  var si=(auth.staff||[]).findIndex(function(x){return x.id===staffId;});
  if(si<0)return;
  if(!auth.staff[si].perms)auth.staff[si].perms={};
  auth.staff[si].perms[perm]=!auth.staff[si].perms[perm];
  saveAuth(auth);
  // Update SESSION if this staff is logged in (different tab scenario)
  var btn=document.getElementById('pToggle_'+perm);
  if(btn){var isOn=auth.staff[si].perms[perm];btn.style.background=isOn?'var(--gr)':'#ccc';btn.textContent=isOn?'ON':'OFF';}
  logAct('Permission '+( auth.staff[si].perms[perm]?'ON':'OFF')+': '+perm+' for '+auth.staff[si].name);
};

window.deleteStaff=function(staffId){

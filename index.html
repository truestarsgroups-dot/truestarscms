  html+='<div style="background:'+statusBg+';border:1px solid;border-color:'+statusColor+';border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">';
  html+='<span style="color:'+statusColor+';font-weight:700;font-size:13px">'+statusText+'</span>';
  html+='<span style="font-size:12px;color:var(--t2)">📅 '+offer.startDate+' → '+offer.endDate+'</span>';
  html+='<span style="font-size:12px;color:var(--t2)">Type: <b>'+(offer.condType==='combined'?'All Projects Combined':'Per Project')+'</b></span>';
  html+='</div>';

  // Reward levels card
  html+='<div class="card" style="margin-bottom:14px">';
  html+='<div class="ct">🏆 Reward Structure</div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">';
  (offer.levels||[]).forEach(function(lv,i){
    var colors=['#1565c0','#6a1b9a','#e65100','#1b5e20'];
    var bgs=['#e3f2fd','#f3e5f5','#fff3e0','#e8f5e9'];
    var c=colors[i%colors.length],b=bgs[i%bgs.length];
    html+='<div style="background:'+b+';border:1px solid '+c+';border-radius:10px;padding:10px 14px;min-width:160px">';
    html+='<div style="font-size:11px;font-weight:700;color:'+c+';text-transform:uppercase;letter-spacing:.5px">Level '+(i+1)+'</div>';
    html+='<div style="font-size:13px;font-weight:700;color:#222;margin:4px 0">';
    if(offer.condType==='combined'){
      if(lv.plots&&lv.gaj)html+=lv.plots+' Plots  <span style="color:var(--t3)">or</span>  '+lv.gaj+' Sq.Yd';
      else if(lv.plots)html+=lv.plots+' Plots';
      else html+=lv.gaj+' Sq.Yd';
    } else {
      html+=lv.qualifyCount+' Project'+(lv.qualifyCount>1?'s':'')+' must qualify';
    }
    html+='</div>';
    html+='<div style="font-size:14px;color:'+c+';font-weight:800">🎁 '+esc(lv.reward)+'</div>';
    html+='</div>';
  });
  html+='</div>';

  // Per project conditions
  if(offer.condType==='per_project'){
    html+='<div style="margin-top:12px;padding-top:12px;border-top:.5px solid var(--bd)">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">Project Conditions</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
    (offer.projects||[]).forEach(function(op){
      html+='<div style="background:var(--bg2);border:.5px solid var(--bd);border-radius:8px;padding:6px 12px;font-size:12px">';
      html+='<b>'+esc(op.projName)+'</b>: ';
      if(op.plots&&op.gaj)html+=op.plots+' Plots <span style="color:var(--t3)">or</span> '+op.gaj+' Sq.Yd';
      else if(op.plots)html+=op.plots+' Plots';
      else html+=op.gaj+' Sq.Yd';
      html+='</div>';
    });
    html+='</div></div>';
  }
  html+='</div>';

  // Leaderboard
  var stats=calcOfferStats(offer);
  var qualifiers=stats.filter(function(s){return s.rewardLevel;});
  var inProgress=stats.filter(function(s){return !s.rewardLevel;});

  // ── LEADERBOARD ──
  html+='<div class="card">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">';
  html+='<div class="ct" style="margin:0">🏅 Leaderboard</div>';
  html+='<div style="display:flex;gap:8px">';
  html+='<span style="background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700">🏆 '+qualifiers.length+' Qualified</span>';
  html+='<span style="background:#e3f2fd;color:#1565c0;border:1px solid #90caf9;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700">🔥 '+inProgress.length+' In Progress</span>';
  html+='</div></div>';

  if(stats.length===0){
    html+='<div style="text-align:center;padding:30px;color:var(--t3)">No sales recorded in this campaign period yet.</div>';
  } else {
    html+='<div class="tw"><table><thead><tr>';
    html+='<th>#</th><th>Associate</th>';
    html+='<th>Plots</th><th>Sq.Yd</th>';
    if(offer.condType==='per_project') html+='<th>Projects Qualified</th>';
    html+='<th>Reward</th></tr></thead><tbody>';

    stats.forEach(function(s,i){
      var rowBg=s.rewardLevel?'background:linear-gradient(90deg,rgba(46,125,50,.07),transparent)':'';
      html+='<tr style="'+rowBg+'">';
      html+='<td style="color:var(--t3);font-weight:700">'+(i+1)+'</td>';
      // Store in global map for ALL associates (not just qualified)
      if(!window._campSalesMap)window._campSalesMap={};
      var mapKey='cs_'+s.id+'_'+offer.id;
      window._campSalesMap[mapKey]={name:s.name,sales:s.salesList||[]};
      html+='<td><div data-cskey="'+mapKey+'" onclick="showCampSalesDetail(this.dataset.cskey)" style="cursor:pointer;color:var(--bl);font-weight:700" title="Click for sale details">'+esc(s.name)+'</div></td>';

      html+='<td style="font-weight:700">'+s.totalPlots+'</td>';
      html+='<td style="font-weight:700">'+fmtG(s.totalGaj)+'</td>';
      if(offer.condType==='per_project'){
        html+='<td style="text-align:center">';
        html+='<span style="font-size:16px;font-weight:800;color:var(--bl)">'+s.qualifiedProjects+'</span>';
        html+='<span style="font-size:11px;color:var(--t2)"> / '+(offer.projects||[]).length+'</span>';
        html+='</td>';
      }

      if(s.rewardLevel){
        var rwLabel=s.rewardLevel.rewards
          ?s.rewardLevel.rewards.map(function(r){return '🏆 '+esc(r.reward);}).join(' + ')
          :'🏆 '+esc(s.rewardLevel.reward);
        html+='<td><div data-cskey="'+mapKey+'" onclick="showCampSalesDetail(this.dataset.cskey)" style="background:linear-gradient(135deg,#b8860b,#f0c040);color:#fff;padding:5px 12px;border-radius:10px;font-size:12px;font-weight:700;display:inline-block;cursor:pointer" title="Click for sale details">'+rwLabel+' 📋</div></td>';
      } else {
        // Combined: show what's needed
        if(offer.condType==='combined'){
          var nextLv=null;
          (offer.levels||[]).slice().sort(function(a,b){return ((a.plots||0)+(a.gaj||0))-((b.plots||0)+(b.gaj||0));}).forEach(function(lv){
            if(!nextLv){
              var plotOk=lv.plots>0?s.totalPlots>=lv.plots:false;
              var gajOk=lv.gaj>0?s.totalGaj>=lv.gaj:false;
              if(!plotOk&&!gajOk)nextLv=lv;
            }
          });
          if(nextLv){
            var needText=nextLv.gaj&&s.totalGaj<nextLv.gaj?(nextLv.gaj-s.totalGaj)+' more Sq.Yd':(nextLv.plots-s.totalPlots)+' more Plots';
            html+='<td><span style="font-size:11px;color:var(--am)">🔥 '+needText+' → '+esc(nextLv.reward)+'</span></td>';
          } else {
            html+='<td><span style="font-size:11px;color:var(--t3)">—</span></td>';
          }
        } else {
          html+='<td><span style="font-size:11px;color:var(--t3)">—</span></td>';
        }
      }
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  return html;
}

window.saveOffer=function(existingId){
  var name=(document.getElementById('ofNm')||{}).value||'';
  var startDate=(document.getElementById('ofSt')||{}).value||'';
  var endDate=(document.getElementById('ofEd')||{}).value||'';
  if(!name.trim()||!startDate||!endDate){toast('Campaign Name, Start & End Date are required!',false);return;}
  if(new Date(endDate)<new Date(startDate)){toast('End date cannot be before start date!',false);return;}

  var condType=document.getElementById('ofCTc')&&document.getElementById('ofCTc').checked?'combined':'per_project';

  // Read projects (per_project: each project has its own levels)
  var projects=[];
  var levels=[];

  if(condType==='per_project'){
    var pRows=document.getElementById('ofProjList');
    if(pRows){
      Array.from(pRows.children).forEach(function(row,i){
        var pjEl=document.getElementById('ofPrj_'+i);
        if(!pjEl||!pjEl.value)return;
        var proj=D.projects.find(function(p){return p.id===pjEl.value;});
        // Read levels for this project
        var projLevels=[];
        var lvWrap=document.getElementById('ofprlvwrap_'+i);
        if(lvWrap){
          Array.from(lvWrap.children).forEach(function(lrow,li){
            var plEl=document.getElementById('ofPrPl_'+i+'_'+li);
            var gjEl=document.getElementById('ofPrGaj_'+i+'_'+li);
            var rwEl=document.getElementById('ofPrRw_'+i+'_'+li);
            if(!rwEl||!rwEl.value.trim())return;
            projLevels.push({
              plots:parseInt(plEl&&plEl.value?plEl.value:0)||0,
              gaj:parseInt(gjEl&&gjEl.value?gjEl.value:0)||0,
              reward:rwEl.value.trim()
            });
          });
        }
        if(projLevels.length===0)return;
        projects.push({
          projId:pjEl.value,
          projName:proj?proj.name:pjEl.value,
          levels:projLevels
        });
      });
    }
    if(projects.length===0){toast('Add at least one project with reward levels!',false);return;}
  } else {
    // Combined: read from ofLevelList
    var lvRows=document.getElementById('ofLevelList');
    if(lvRows){
      Array.from(lvRows.children).forEach(function(row,i){
        var rwEl=document.getElementById('ofLvRw_'+i);
        if(!rwEl||!rwEl.value.trim())return;
        var lv={reward:rwEl.value.trim()};
        var plEl=document.getElementById('ofLvPl_'+i);
        var gjEl=document.getElementById('ofLvGaj_'+i);
        lv.plots=parseInt(plEl&&plEl.value?plEl.value:0)||0;
        lv.gaj=parseInt(gjEl&&gjEl.value?gjEl.value:0)||0;
        if(!lv.plots&&!lv.gaj)return;
        levels.push(lv);
      });
    }
    if(levels.length===0){toast('Add at least one reward level!',false);return;}
  }

  if(!D.offers)D.offers=[];
  if(existingId){
    var idx=D.offers.findIndex(function(o){return o.id===existingId;});
    if(idx>=0){
      D.offers[idx]=Object.assign(D.offers[idx],{name:name.trim(),startDate:startDate,endDate:endDate,condType:condType,projects:projects,levels:levels});
      logAct('Campaign Updated: '+name);
      toast('Campaign updated successfully! ✓');
    }
  } else {
    D.offers.push({id:uid(),name:name.trim(),startDate:startDate,endDate:endDate,condType:condType,projects:projects,levels:levels});
    logAct('New Campaign Created: '+name);
    toast('Campaign created successfully! ✓');
  }
  saveD();
  ofView='list';render();
};

window.editOffer=function(oid){
  var o=D.offers.find(function(x){return x.id===oid;});
  if(!o)return;

  });
  
  el=document.getElementById('btnAddMore');
  if(el)el.addEventListener('click',function(){
    var no=((document.getElementById('plNo')||{}).value||'').trim().toUpperCase();

    if(!no||!sz){toast('Plot No and Size are required!',false);return;}
    var sal=(document.getElementById('plSal')||{}).value||'';
    // Check duplicate in queue
    if(plotQueue.some(function(q){return q.plotNo.toUpperCase()===no;})){
      toast('Plot '+no+' is already in queue!',false);return;
    }
    // Check duplicate in existing project plots
    var proj=D.projects.find(function(p){return p.id===pId;});
    if(proj&&proj.plots&&proj.plots.some(function(pl){return pl.plotNo.toUpperCase()===no;})){
      toast('Plot '+no+' already exists in this project!',false);return;
    }
    plotQueue.push({
      id:uid(),plotNo:no,
      sizeGaj:parseFloat(sz),
      saleableGaj:sal?parseFloat(sal):parseFloat(sz),
      facing:((document.getElementById('plFc')||{}).value||'').trim(),
      location:((document.getElementById('plLc')||{}).value||'').trim(),
      status:'available'
    });
    ['plNo','plSz','plSal','plFc','plLc'].forEach(function(id){
      var el2=document.getElementById(id);if(el2)el2.value='';
    });
    document.getElementById('plNo').focus();
    toast('Plot '+no+' added to queue! ('+plotQueue.length+' total)');
    render();
  });

  el=document.getElementById('btnSPl');
  if(el)el.addEventListener('click',function(){
    var no=((document.getElementById('plNo')||{}).value||'').trim().toUpperCase();
    var sz=(document.getElementById('plSz')||{}).value||'';
    var sal=(document.getElementById('plSal')||{}).value||'';
    var proj=D.projects.find(function(p){return p.id===pId;});
    // Add current form if filled and not duplicate
    if(no&&sz){
      var dupInQueue=plotQueue.some(function(q){return q.plotNo.toUpperCase()===no;});
      var dupInProject=proj&&proj.plots&&proj.plots.some(function(pl){return pl.plotNo.toUpperCase()===no;});
      if(dupInQueue||dupInProject){
        toast('Plot '+no+' already exists — skipped',false);
      } else {
        plotQueue.push({
          id:uid(),plotNo:no,
          sizeGaj:parseFloat(sz),
          saleableGaj:sal?parseFloat(sal):parseFloat(sz),
          facing:((document.getElementById('plFc')||{}).value||'').trim(),
          location:((document.getElementById('plLc')||{}).value||'').trim(),
          status:'available'
        });
      }
    }
    if(plotQueue.length===0){toast('No plots in queue! Add plots first.',false);return;}
    var i=D.projects.findIndex(function(p){return p.id===pId;});if(i<0)return;
    if(!D.projects[i].plots)D.projects[i].plots=[];
    plotQueue.forEach(function(pl){D.projects[i].plots.push(pl);});
    var count=plotQueue.length;
    plotQueue=[];
    saveD();toast(count+' plots saved! ✅');pmMode='list';render();
  });
  
  el=document.getElementById('plFile');
  if(el)el.addEventListener('change',function(e){
    var f=e.target.files[0];
    if(!f){return;}
    if(!window.XLSX){
      toast('❌ XLSX library not loaded! Please open via internet or reload the page.',false);
      e.target.value='';return;
    }
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var wb=XLSX.read(ev.target.result,{type:'array'});
        var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
        if(!rows||rows.length===0){toast('❌ No data found in Excel! Please check the sheet.',false);return;}

        // Smart column finder — case insensitive, trims spaces
        function findCol(row,names){
          var keys=Object.keys(row);
          for(var ni=0;ni<names.length;ni++){
            var nl=names[ni].toLowerCase().replace(/\s/g,'_');
            for(var ki=0;ki<keys.length;ki++){
              if(keys[ki].toLowerCase().replace(/\s+/g,'_')===nl)return keys[ki];
            }
          }
          // Partial match fallback
          for(var ni=0;ni<names.length;ni++){
            var np=names[ni].toLowerCase().replace(/[\s_]/g,'');
            for(var ki=0;ki<keys.length;ki++){
              if(keys[ki].toLowerCase().replace(/[\s_]/g,'').includes(np))return keys[ki];
            }
          }
          return null;
        }

        var r0=rows[0];
        var colNo=findCol(r0,['plot_no','plot no','plot number','plotno','plot','no','number','sr no']);
        var colSz=findCol(r0,['size_gaj','size gaj','plot size','size','Sq.Yd','area','sqyd','sq yd']);
        var colSal=findCol(r0,['saleable_gaj','saleable gaj','saleable','sale gaj','commission gaj','comm gaj']);
        var colFc=findCol(r0,['facing','face','direction']);
        var colLc=findCol(r0,['location','loc','area','block']);

        // Show column mapping info in console
        

        if(!colNo){
          var foundCols=Object.keys(r0).join(', ');
          toast('❌ Plot No column not found! Columns: '+foundCols,false);
          return;
        }
        if(!colSz){
          var foundCols2=Object.keys(r0).join(', ');
          toast('❌ Size/Gaj column not found! Columns: '+foundCols2,false);
          return;
        }

        var existingNos=new Set((D.projects.find(function(p){return p.id===pId;})||{plots:[]}).plots.map(function(pl){return String(pl.plotNo).toUpperCase();}));
        var invalidRows=0;
        var plots=rows.map(function(r){
          var pno=String(r[colNo]||'').trim().toUpperCase();
          var sz=parseFloat(String(r[colSz]||'').replace(/[^0-9.]/g,''))||0;
          var sal=colSal?parseFloat(String(r[colSal]||'').replace(/[^0-9.]/g,''))||sz:sz;
          if(!sal||sal===0)sal=sz;
          return {
            id:uid(),
            plotNo:pno,
            sizeGaj:sz,
            saleableGaj:sal,
            facing:colFc?String(r[colFc]||'').trim():'',
            location:colLc?String(r[colLc]||'').trim():'',
            status:'available'
          };
        }).filter(function(p){
          if(!p.plotNo||p.sizeGaj<=0){invalidRows++;return false;}
          return true;
        });

        // Remove duplicates
        var seen=new Set();var dupCount=0;
        plots=plots.filter(function(p){
          var key=p.plotNo.toUpperCase();
          if(existingNos.has(key)||seen.has(key)){dupCount++;return false;}
          seen.add(key);return true;
        });

        if(plots.length===0){
          var msg='❌ Koi valid plot not found!';
          if(invalidRows>0)msg+=' '+invalidRows+' rows mein Plot No ya Size missing/zero tha.';
          if(dupCount>0)msg+=' '+dupCount+' duplicate plots the.';
          toast(msg,false);
          return;
        }

        var i=D.projects.findIndex(function(p){return p.id===pId;});if(i<0)return;
        if(!D.projects[i].plots)D.projects[i].plots=[];
        D.projects[i].plots=D.projects[i].plots.concat(plots);
        saveD();
        var msg='✅ '+plots.length+' plots uploaded successfully! 🎉';
        if(dupCount>0)msg+=' ('+dupCount+' duplicate skip)';
        if(invalidRows>0)msg+=' ('+invalidRows+' invalid rows skipped)';
        toast(msg);pmMode='list';render();
      }catch(err){toast('❌ File error: '+err.message+' — . Please use .xlsx or .csv file.',false);}
    };
    reader.readAsArrayBuffer(f);e.target.value='';
  });
  
  el=document.getElementById('btnSA');
  if(el)el.addEventListener('click',function(){
    var n=((document.getElementById('aNm')||{}).value||'').trim();
    if(!n){toast('Full Name is required!',false);document.getElementById('aNm').focus();return;}
    if(!gv('aFh')){toast('Father/Husband Name is required!',false);document.getElementById('aFh').focus();return;}
    if(!gv('aPh')){toast('Phone No. is required!',false);document.getElementById('aPh').focus();return;}

    var _frozenChainIds=getChainAtDate(sD.assocId,sD.bookingDate).map(function(a){return a.id;});
    D.sales.unshift({id:uid(),projId:proj.id,projName:proj.name,plotId:plot.id,plotNo:plot.plotNo,plotSizeGaj:plot.sizeGaj,plotGaj:sGaj,sellerName:sCh[0]?sCh[0].name:'',sellerId:sD.assocId,chainIds:_frozenChainIds,partyName:sD.partyName||'',remarks:sD.remarks||'',bookingDate:sD.bookingDate||'',closeDate:sD.closeDate||'',bonusPct:sD.bonusPct||0,commissions:sCh,defCommissions:sDf,chainTotal:cT,defTotal:dT,createdAt:new Date().toISOString()});
    // ── MONTH-END COMMISSION: recompute all sales so this month's slab

function xlStyle(wb,ws,cols,headerColor){
  // Column widths
  if(cols)ws['!cols']=cols;
  // Row height: header=22, data=18
  var range=XLSX.utils.decode_range(ws['!ref']||'A1');
  var rows=[];
  for(var r=0;r<=range.e.r;r++)rows.push({hpt:r===0?22:18});
  ws['!rows']=rows;
  // Header bold + background
  var hc=headerColor||'1A6FC4';
  for(var col=range.s.c;col<=range.e.c;col++){
    var addr=XLSX.utils.encode_cell({r:0,c:col});
    if(!ws[addr])continue;
    ws[addr].s={
      font:{bold:true,color:{rgb:'FFFFFF'},sz:11},
      fill:{fgColor:{rgb:hc},patternType:'solid'},
      alignment:{horizontal:'center',vertical:'center',wrapText:false},
      border:{bottom:{style:'medium',color:{rgb:'FFFFFF'}}}
    };
  }
  // Data rows alternating + alignment
  for(var r2=1;r2<=range.e.r;r2++){
    var fillRgb=r2%2===0?'EEF4FB':'FFFFFF';
    for(var col2=range.s.c;col2<=range.e.c;col2++){
      var addr2=XLSX.utils.encode_cell({r:r2,c:col2});
      if(!ws[addr2])ws[addr2]={t:'s',v:''};
      ws[addr2].s={
        fill:{fgColor:{rgb:fillRgb},patternType:'solid'},
        alignment:{vertical:'center',wrapText:false},
        border:{bottom:{style:'thin',color:{rgb:'D0D8E8'}},right:{style:'thin',color:{rgb:'D0D8E8'}}}
      };
    }
  }
  // Autofilter
  var lastColLetter=col<=26?String.fromCharCode(64+range.e.c+1):'A'+String.fromCharCode(64+(range.e.c-25));
  ws['!autofilter']={ref:'A1:'+lastColLetter+'1'};
  // Freeze first row
  ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
}

function fbSave(ts){
  if(!_fbReady||!_fbDB)return;
  ts=ts||Date.now();
  fbStatus('sync');
  // Direct overwrite — save D data as-is to Firebase
  // No merge — deleted items should not come back
  var clean=JSON.parse(JSON.stringify({
    projects:D.projects||[],
    associates:D.associates||[],
    sales:D.sales||[],
    offers:D.offers||[],
    deleted:D.deleted||{associates:[],sales:[],projects:[]},
    transfers:D.transfers||[],
    payments:D.payments||[],
    advances:D.advances||[],
    config:D.config||{},
    ts:ts
  }));
  _fbDB.collection('appdata').doc('main').set(clean)
    .then(function(){fbStatus('ok');})
    .catch(function(e){fbStatus('err');console.error('fbSave error:',e.code,e.message);});
}

function fbLoadIfEmpty(){
  if(!_fbReady||!_fbDB){return;}
  fbStatus('sync');
  _fbDB.collection('appdata').doc('main').get()
    .catch(function(e){fbStatus('err');console.error('fbLoad error:',e.message);})
    .then(function(doc){
      if(!doc)return;
      if(!doc.exists){
        // Nothing in Firebase — push local data
        if(D.projects.length||D.associates.length||D.sales.length){
          fbSave();
        } else {
          fbStatus('ok');
        }
        return;
      }
      var r=doc.data();
      if(!r){fbStatus('ok');return;}

      var remoteTs=r.ts||0;

      // SAFETY: New file load pe hamesha Firebase ka data lo
      // Never overwrite Firebase with local data on page load
      // Sirf jab user explicitly kuch save kare (saveD) tab Firebase update ho
      if(r.projects)D.projects=r.projects;
      if(r.associates)D.associates=r.associates;
      if(r.sales)D.sales=r.sales;
      D.offers=r.offers||[];
      if(r.deleted)D.deleted=r.deleted;else if(!D.deleted)D.deleted={associates:[],sales:[],projects:[]};
      if(r.transfers)D.transfers=r.transfers;else if(!D.transfers)D.transfers=[];
      if(r.payments)D.payments=r.payments;else if(!D.payments)D.payments=[];
      if(r.advances)D.advances=r.advances;else if(!D.advances)D.advances=[];
      if(r.config)D.config=r.config;else if(!D.config)D.config={};
      window._localTs=remoteTs;
      fbStatus('ok');
      if(SESSION)render();
    })
    .catch(function(e){
      fbStatus('err');
      console.warn('fbLoad error:',e.message);
    });
}

      if(r.payments)D.payments=r.payments;else if(!D.payments)D.payments=[];
      if(r.advances)D.advances=r.advances;else if(!D.advances)D.advances=[];
      if(r.config)D.config=r.config;else if(!D.config)D.config={};

            document.body.appendChild(n);

          }

          render();
          toast('🔄 Data updated by another admin',true);
        }

      console.warn('Realtime listener error:',e.message);

window.importAssocExcel=function(input){
  if(!isOnline()){toast('📴 No internet connection!',false);return;}
  var file=input.files[0];
  if(!file){return;}
  if(!window.XLSX){toast('XLSX library could not load!',false);return;}
  input.value=String();

  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:''});

      if(!rows.length){toast('No data found in file!',false);return;}

      // Column mapping — flexible
      function findCol(row,keys){
        var k=Object.keys(row);
        for(var i=0;i<keys.length;i++){
          var found=k.find(function(c){return c.toLowerCase().replace(/[^a-z0-9]/g,'').includes(keys[i].toLowerCase().replace(/[^a-z0-9]/g,''));});
          if(found)return found;
        }
        return null;
      }

      var r0=rows[0];
      var colName=findCol(r0,['fullname','name']);
      if(!colName){toast('❌ "Full Name" column not found!',false);return;}

      var added=0, skipped=0, errors=[];
      var newAssocs=[];

      rows.forEach(function(row,i){
        var name=(row[colName]||'').toString().trim();
        if(!name){skipped++;return;}

        // Check required fields
        var colFather=findCol(row,['father','husband','fathername']);
        var colPhone=findCol(row,['phone','mobile','phoneno']);
        var colPan=findCol(row,['pan','panno']);
        var colBnm=findCol(row,['bankingname','accountholder','bankingname']);
        var colBnk=findCol(row,['bankname','bank']);
        var colAc=findCol(row,['accountno','accno','account']);
        var colIfs=findCol(row,['ifsc','ifsccode']);

        var father=colFather?(row[colFather]||'').toString().trim():'';
        var phone=colPhone?(row[colPhone]||'').toString().trim():'';
        var pan=colPan?(row[colPan]||'').toString().trim():'';
        var bnm=colBnm?(row[colBnm]||'').toString().trim():'';
        var bnk=colBnk?(row[colBnk]||'').toString().trim():'';
        var ac=colAc?(row[colAc]||'').toString().trim():'';
        var ifs=colIfs?(row[colIfs]||'').toString().trim():'';

        // Check duplicate phone
        var impPhone=(phone||'').replace(/\D/g,'');
        if(impPhone){
          var existingPhone=D.associates.find(function(x){return x.phone&&x.phone.replace(/\D/g,'')===impPhone;});
          if(existingPhone){
            errors.push('Row '+(i+2)+' ('+name+'): Phone '+phone+' already registered to '+existingPhone.name);
            skipped++;return;
          }
        }
        // Validate required
        var missing=[];
        if(!father)missing.push('Father Name');
        if(!phone)missing.push('Phone');
        if(!pan)missing.push('PAN');
        if(!bnm)missing.push('Banking Name');
        if(!bnk)missing.push('Bank Name');
        if(!ac)missing.push('Account No');
        if(!ifs)missing.push('IFSC');

        if(missing.length>0){
          errors.push('Row '+(i+2)+' ('+name+'): '+missing.join(', ')+' missing');
          skipped++;
          return;
        }

        // Optional fields
        var colRera=findCol(row,['rera','rerano']);
        var colAdh=findCol(row,['aadhaar','aadhar']);
        var colCode=findCol(row,['code','associatecode']);
        var colLoc=findCol(row,['location','city']);
        var colEm=findCol(row,['email']);
        var colAdr=findCol(row,['address']);
        var colJd=findCol(row,['joiningdate','joining']);

        newAssocs.push({
          id:uid(),
          name:name,
          fatherName:father,
          phone:phone,
          pan:pan,
          bankingName:bnm,
          bankName:bnk,
          accNo:ac,
          ifsc:ifs,
          rera:colRera?(row[colRera]||'').toString().trim():'',
          aadhaar:colAdh?(row[colAdh]||'').toString().trim():'',
          code:colCode?(row[colCode]||'').toString().trim():'',
          location:colLoc?(row[colLoc]||'').toString().trim():'',
          email:colEm?(row[colEm]||'').toString().trim():'',
          address:colAdr?(row[colAdr]||'').toString().trim():'',
          joiningDate:colJd?(row[colJd]||'').toString().trim():'',
          parentId:null,
          totalGaj:0,
          createdAt:new Date().toISOString()
        });
        added++;
      });

      if(added===0){
        var msg='No associates were imported!';
        if(errors.length)msg+=' Errors: '+errors.slice(0,3).join(' | ');
        toast(msg,false);
        return;
      }

      // Preview modal
      var prevHtml='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
        +'<b style="font-size:15px">📤 Import Preview</b>'
        +'<button class="btn bgh bsm" onclick="closeM()">✕</button></div>';

      prevHtml+='<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">'
        +'<div style="background:var(--grb);border:1px solid var(--gr);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--gr)">✅ '+added+' Ready to Import</div>'
        +(skipped>0?'<div style="background:var(--reb);border:1px solid var(--re);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--re)">⚠️ '+skipped+' Skipped</div>':'')
        +'</div>';

      if(errors.length){
        prevHtml+='<div style="background:var(--reb);border:1px solid var(--re);border-radius:8px;padding:10px;font-size:12px;color:var(--re);margin-bottom:12px">'
          +'<b>Skipped rows:</b><br>'+errors.slice(0,5).join('<br>')+(errors.length>5?'<br>...more '+(errors.length-5)+' more':'')
          +'</div>';
      }

      prevHtml+='<div class="tw" style="max-height:250px;overflow-y:auto"><table><thead><tr>'
        +'<th>#</th><th>Name</th><th>Phone</th><th>PAN</th><th>Bank</th>'
        +'</tr></thead><tbody>';
      newAssocs.slice(0,10).forEach(function(a,i){
        prevHtml+='<tr>'
          +'<td style="color:var(--t3)">'+(i+1)+'</td>'
          +'<td><b>'+esc(a.name)+'</b></td>'
          +'<td>'+esc(a.phone)+'</td>'
          +'<td>'+esc(a.pan)+'</td>'
          +'<td style="font-size:11px">'+esc(a.bankName)+'</td>'
          +'</tr>';
      });
      if(newAssocs.length>10)prevHtml+='<tr><td colspan="5" style="text-align:center;color:var(--t2);font-size:12px">...more '+(newAssocs.length-10)+' more</td></tr>';
      prevHtml+='</tbody></table></div>';

      prevHtml+='<div class="info ibl" style="margin-top:12px;font-size:12px">⚠️ Upliner (Senior) must be set manually later — in the Associate list Transfer button se.</div>';

      prevHtml+='<div style="display:flex;gap:8px;margin-top:14px">'
        +'<button class="btn bgr" id="btnConfirmImport">✅ Import ('+added+')</button>'
        +'<button class="btn bgh" onclick="closeM()">Cancel</button>'
        +'</div>';

      openM(prevHtml);

      // Attach confirm handler
      setTimeout(function(){
        var btn=document.getElementById('btnConfirmImport');
        if(btn){
          btn.addEventListener('click',function(){
            newAssocs.forEach(function(a){D.associates.push(a);});
            saveD();
            logAct('Bulk Import: '+added+' associates added');
            toast('✅ '+added+' associates import ho gaye! Upliner set karne ke liye Transfer button use karo.');
            closeM();render();
          });
        }
      },200);

    }catch(err){
      toast('❌ File read error: '+err.message,false);
    }
  };
  reader.readAsArrayBuffer(file);
};

      +(isSelf?'':' onclick="r1ProfileId=\''+node.id+'\';render()"')+'>'
      +'L'+(i+1)+' · '+esc(node.name.replace(' (Left)',''))
      +(isSelf?' ★':'')
      +'</span>';
    if(i<chain.length-1)h+='<span style="color:var(--t3);font-size:10px">→</span>';
  });
  h+='</div>';

  // Direct downline with pagination
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
    +'<div style="font-size:12px;font-weight:700;color:var(--t2)">👇 Direct Downline ('+directDown.length+')</div>'
    +(directDown.length>downPerPage
      ?'<div style="display:flex;align-items:center;gap:4px">'
        +'<button class="btn bgh bsm" style="padding:2px 8px;font-size:11px" '
        +(r1DownPage===0?'disabled':'data-p="'+(r1DownPage-1)+'" onclick="r1DownPage=parseInt(this.dataset.p);render()"')+'>←</button>'
        +'<span style="font-size:11px;color:var(--t2)">'+(r1DownPage+1)+'/'+downTotalPages+'</span>'
        +'<button class="btn bgh bsm" style="padding:2px 8px;font-size:11px" '
        +(r1DownPage>=downTotalPages-1?'disabled':'data-p="'+(r1DownPage+1)+'" onclick="r1DownPage=parseInt(this.dataset.p);render()"')+'>→</button>'
        +'</div>'
      :'')
    +'</div>';
  if(directDown.length===0){
    h+='<div style="color:var(--t3);font-size:12px;padding:8px 0">No direct downline</div>';
  } else {
    downPageData.forEach(function(d){
      var dSales=D.sales.filter(function(s){return s.commissions&&s.commissions.some(function(c){return c.id===d.id;});}).length;
      h+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid var(--bd);cursor:pointer" data-did="'+d.id+'" onclick="r1ProfileId=this.dataset.did;r1DownPage=0;render()">'
        +'<span class="badge bbl2" style="font-size:10px">'+esc(dOf(d.totalGaj).substring(0,12))+'</span>'
        +'<span style="flex:1;color:var(--bl);font-weight:600">'+esc(d.name)+'</span>'
        +'<span style="font-size:11px;color:var(--t2)">'+d.totalGaj+'Sq.Yd · '+dSales+' sales</span>'
        +'</div>';
    });
  }
  h+='</div>';

  // Benefits
  h+='<div class="card" style="margin:0">'
    +'<div class="ct" style="margin-bottom:10px">🎁 Benefits Progress <span style="font-size:11px;font-weight:400;color:var(--t2)">(Sales Sq.Yd: '+salesGajForBen+')</span></div>';
  BENS.forEach(function(ben){
    var done=salesGajForBen>=ben.g;
    var isNext=!done&&nBen(salesGajForBen)&&nBen(salesGajForBen).g===ben.g;
    var bpct=isNext?Math.min(100,Math.round((salesGajForBen/ben.g)*100)):0;
    h+='<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:4px;border-radius:7px;background:'+(done?'var(--grb)':isNext?'var(--amb)':'var(--bg3)')+';opacity:'+(done||isNext?1:.55)+'">'
      +'<span style="font-size:16px">'+(done?'✅':isNext?'🎯':'🔒')+'</span>'
      +'<div style="flex:1">'
      +'<div style="font-size:12px;font-weight:600;color:'+(done?'var(--gr)':isNext?'var(--am)':'var(--t2)')+'">'+ben.l+'</div>'
      +'<div style="font-size:10px;color:var(--t3)">'+fmt(ben.g)+' sales gaj needed</div>'
      +(isNext?'<div class="sbar" style="margin:3px 0 0"><div class="sfil" style="width:'+bpct+'%;background:'+(isNext?'var(--am)':'var(--bl)')+'"></div></div>':'')
      +'</div>'
      +'<span class="badge" style="background:'+(done?'var(--grb)':isNext?'var(--amb)':'var(--bg2)')+';color:'+(done?'var(--gr)':isNext?'var(--am)':'var(--t3)')+';">'+(done?'Done ✓':isNext?bpct+'%':'—')+'</span>'
      +'</div>';
  });
  h+='</div>';

  h+='</div>'; // end row2 grid

  // ── All Sales — Combined Table (Personal + Team) ──
  var allSalesForProfile=[];
  mySales.forEach(function(s){
    var cm=(s.commissions||[]).find(function(c){return c.id===a.id;});
    var comm=cm?cm.total:0;
    allSalesForProfile.push({s:s,comm:comm,type:'self'});
  });
  teamSales.forEach(function(s){
    var cm=(s.commissions||[]).find(function(c){return c.id===a.id;});
    var df=(s.defCommissions||[]).find(function(c){return c.id===a.id;});
    var comm=(cm?cm.total:0)+(df?df.amount:0);
    allSalesForProfile.push({s:s,comm:comm,type:'team'});
  });
  // Sort by close date desc
  allSalesForProfile.sort(function(a,b){
    var da=a.s.closeDate||a.s.bookingDate||'';
    var db=b.s.closeDate||b.s.bookingDate||'';
    return db.localeCompare(da);
  });

  var totalAllComm=allSalesForProfile.reduce(function(t,r){return t+r.comm;},0);
  var totalAllGaj=allSalesForProfile.reduce(function(t,r){return t+(r.s.plotGaj||0);},0);
  var showCount=r1SalesShow;
  var visibleRows=allSalesForProfile.slice(0,showCount);
  var moreCount=allSalesForProfile.length-showCount;

  h+='<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">'
    +'<div style="padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    +'<div style="font-size:13px;font-weight:700">📋 All Sales ('+(mySales.length+teamSales.length)+' records)</div>'
    +'<div style="display:flex;gap:10px;font-size:12px">'
    +'<span style="color:var(--gr)">🌟 Self: '+mySales.length+'</span>'
    +'<span style="color:var(--pu)">👥 Team: '+teamSales.length+'</span>'
    +'<span style="color:var(--t2)">Total Gaj: <b>'+fmtG(totalAllGaj)+'</b></span>'
    +'<span style="color:var(--gr);font-weight:700">₹'+fmtL(totalAllComm)+'</span>'
    +'</div></div>'
    +'<div class="tw" style="border:none;border-radius:0">'
    +'<table style="table-layout:fixed;width:100%"><thead><tr>'
    +'<th style="width:32px">#</th>'
    +'<th style="width:160px">Project</th>'
    +'<th style="width:55px">Plot</th>'
    +'<th style="width:75px">Saleable</th>'
    +'<th style="width:120px">Seller</th>'
    +'<th style="width:85px">Close Date</th>'
    +'<th style="width:95px">Commission</th>'
    +'<th style="width:55px">Type</th>'
    +'</tr></thead><tbody>';

  if(allSalesForProfile.length===0){
    h+='<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--t3)">No sales found</td></tr>';
  } else {
    visibleRows.forEach(function(row,i){
      var s=row.s;
      h+='<tr style="background:'+(i%2===0?'':'var(--bg3)')+'">'
        +'<td style="color:var(--t3)">'+(i+1)+'</td>'
        +'<td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>'+esc(s.projName)+'</b></td>'
        +'<td><span class="badge bbl2" style="font-size:11px">'+esc(String(s.plotNo))+'</span></td>'
        +'<td style="color:var(--pu);font-weight:700">'+fmtG(s.plotGaj)+'</td>'
        +'<td style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)">'+(row.type==='self'?'<span style="color:var(--gr)">Self</span>':esc(s.sellerName||'—'))+'</td>'
        +'<td style="font-size:12px;white-space:nowrap">'+(s.closeDate||s.bookingDate||'—')+'</td>'
        +'<td style="font-weight:700;color:var(--gr);white-space:nowrap">'+( row.comm>0?'₹'+fmt(Math.round(row.comm)):'₹0')+'</td>'
        +'<td>'+(row.type==='self'
          ?'<span class="badge bgn" style="font-size:10px">🌟 Self</span>'
          :'<span class="badge bpu" style="font-size:10px">👥 Team</span>')+'</td>'
        +'</tr>';
    });
  }

  h+='</tbody></table></div>';

  if(moreCount>0){
    h+='<div style="text-align:center;padding:10px 0 4px"><button class="btn bgh bsm" onclick="r1SalesShow+=15;render()">⬇ Load More ('+moreCount+' more)</button></div>';
  }
  h+='</div>';

    return h;
}

window.showAssocView=function(id){
  var a=D.associates.find(function(x){return x.id===id;});
  if(!a)return;
  var par=a.parentId?D.associates.find(function(x){return x.id===a.parentId;}):null;
  var cs=slabOf(a.totalGaj);var ns=nSlab(a.totalGaj);
  var pct=ns?Math.min(100,Math.round(((a.totalGaj-cs.min)/(ns.min-cs.min))*100)):100;
  var level=0,cur=a;
  while(cur&&cur.parentId){level++;cur=D.associates.find(function(x){return x.id===cur.parentId;});}
  var waNum=a.phone?(a.phone.replace(/\D/g,'').length===10?'91'+a.phone.replace(/\D/g,''):a.phone.replace(/\D/g,'')):'';

  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<div><div style="font-size:18px;font-weight:700">'+esc(a.name)+'</div>'
    +'<div style="display:flex;gap:6px;margin-top:4px">'
    +'<span class="badge bbl2">L'+(level+1)+'</span>'
    +'<span class="badge" style="background:var(--grb);color:var(--gr)">'+cs.des+'</span>'
    +'</div></div>'
    +'<button class="btn bgh bsm" onclick="closeM()">✕</button>'
    +'</div>';

  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;gap:16px;align-items:center">'
    +'<div><div style="font-size:22px;font-weight:700;color:var(--bl)">'+fmtG(a.totalGaj)+'</div><div style="font-size:11px;color:var(--t2)">Total Sq.Yd</div></div>'
    +'<div style="flex:1">'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:3px"><span>₹'+cs.rate+'/Sq.Yd</span><span>'+(ns?(ns.min-a.totalGaj)+' more for next':'Max slab!')+'</span></div>'
    +'<div class="sbar"><div class="sfil" style="width:'+pct+'%"></div></div>'
    +'</div>'
    +(a.phone?'<a href="https://wa.me/'+waNum+'" target="_blank" class="btn bsm" style="background:#25D366;color:#fff;border:none;text-decoration:none;white-space:nowrap">📱 WhatsApp</a>':'')
    +'</div>';

  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px 12px">'
    +'<div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">👤 Personal</div>'
    +'<div style="font-size:12px;display:grid;gap:5px">'
    +'<div><span style="color:var(--t3)">Phone: </span><b>'+esc(a.phone||'—')+'</b></div>'
    +'<div><span style="color:var(--t3)">Father/Husband: </span>'+esc(a.fatherName||'—')+'</div>'
    +'<div><span style="color:var(--t3)">PAN: </span><b style="font-family:Courier New,monospace">'+esc(a.pan||'—')+'</b></div>'
    +'<div><span style="color:var(--t3)">Aadhaar: </span>'+esc(a.aadhaar||'—')+'</div>'
    +'<div><span style="color:var(--t3)">RERA: </span><span style="color:var(--bl)">'+esc(a.rera||'—')+'</span></div>'
    +'<div><span style="color:var(--t3)">Email: </span>'+esc(a.email||'—')+'</div>'
    +'<div><span style="color:var(--t3)">Location: </span>'+esc(a.location||'—')+'</div>'
    +'<div><span style="color:var(--t3)">Joining: </span>'+esc(a.joiningDate||'—')+'</div>'
    +'<div><span style="color:var(--t3)">Upliner: </span><b>'+(par?esc(par.name):'— Top Level —')+'</b></div>'
    +'</div></div>';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px 12px">'
    +'<div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">🏦 Banking</div>'
    +'<div style="font-size:12px;display:grid;gap:5px">'
    +'<div><span style="color:var(--t3)">Holder: </span><b>'+esc(a.bankingName||'—')+'</b></div>'
    +'<div><span style="color:var(--t3)">Bank: </span>'+esc(a.bankName||'—')+'</div>'
    +'<div><span style="color:var(--t3)">A/C No: </span><b style="font-family:Courier New,monospace;font-size:13px">'+esc(a.accNo||'—')+'</b></div>'
    +'<div><span style="color:var(--t3)">IFSC: </span><b style="font-family:Courier New,monospace">'+esc(a.ifsc||'—')+'</b></div>'
    +'<div><span style="color:var(--t3)">Address: </span>'+esc(a.address||'—')+'</div>'
    +'</div></div>';
  html+='</div>';

  // Action buttons - NO Edit
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">';
  if(a.phone){
    html+='<a href="https://wa.me/'+waNum+'" target="_blank" class="btn bsm" style="background:#25D366;color:#fff;border:none;text-decoration:none;white-space:nowrap">📱 WhatsApp</a>';
  }
  html+='<button class="btn bgh bsm" onclick="closeM()">Close</button>';
  html+='</div>';

  openM(html);

};

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bl:#1a6fc4;--blb:#e8f1fb;--bld:#0d4a8a;
  --gr:#2e7d1e;--grb:#eaf5e6;
  --am:#8a5200;--amb:#fff3e0;
  --pu:#5b4ac7;--pub:#eeecfd;
  --re:#c0392b;--reb:#fdecea;
  --bd:#ddd;--bg:#f5f5f5;--bg2:#fff;--bg3:#f9f9f9;
  --tx:#222;--t2:#666;--t3:#999
}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.hdr{background:var(--bl);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.2);flex-wrap:wrap;gap:8px}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:16px;font-weight:700;margin:0}
.hdr p{font-size:11px;opacity:.8;margin:0}
.nav{background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;overflow-x:auto;padding:0 16px;gap:0}
.nav a{padding:10px 14px;font-size:13px;font-weight:600;color:var(--t2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;flex-shrink:0}
.nav a.on{color:var(--bl);border-color:var(--bl)}
#srchWrap{margin-left:auto;padding:4px 0;flex-shrink:0}
#srchWrap input{font-size:12px;padding:5px 10px;border:1px solid var(--bd);border-radius:6px;width:200px}
.main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.ct{font-size:14px;font-weight:700;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:12px;text-align:center}
.sv{font-size:22px;font-weight:700;margin-top:2px}
.sl{font-size:11px;color:var(--t3);font-weight:500}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.3px}
input,select{font-size:13px;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:#fff;color:var(--tx);width:100%}
input:focus,select:focus{outline:none;border-color:var(--bl)}
input:disabled,select:disabled{background:var(--bg3);color:var(--t3)}
.btn{padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bbl{background:var(--bl);color:#fff}
.bgr{background:var(--gr);color:#fff}
.bgh{background:var(--bg3);color:var(--t2);border:1px solid var(--bd);cursor:pointer}
.bsm{padding:4px 10px;font-size:12px;border-radius:5px}
.bot{background:transparent;color:var(--bl);border:1px solid var(--bl)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bgn{background:var(--grb);color:var(--gr)}
.bam{background:var(--amb);color:var(--am)}
.bbl2{background:var(--blb);color:var(--bl)}
.bpu{background:var(--pub);color:var(--pu)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 10px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--t2);white-space:nowrap;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--blb)}
.empty{padding:32px;text-align:center;color:var(--t3);border:2px dashed var(--bd);border-radius:10px}
.info{padding:9px 13px;border-radius:8px;font-size:12px;margin-bottom:10px}
.ibl{background:var(--blb);color:var(--bld);border:1px solid #b3d1f5}
.igr{background:var(--grb);color:var(--gr);border:1px solid #b8e0b0}
.iam{background:var(--amb);color:var(--am);border:1px solid #ffd08a}
.ipu{background:var(--pub);color:var(--pu);border:1px solid #c5bef5}
.sbar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin:4px 0}
.sfil{height:100%;background:var(--bl);border-radius:3px}
.divl{height:1px;background:var(--bd);margin:12px 0}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid}
.sdn{background:var(--grb);color:var(--gr);border-color:var(--gr)}
.sac{background:var(--bl);color:#fff;border-color:var(--bl)}
.std{background:var(--bg3);color:var(--t3);border-color:var(--bd)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:600px){.main{padding:10px}th,td{padding:6px 7px;font-size:12px}}
</style>

<script>
// ─── CONSTANTS ───────────────────────────────────────
var SK='ts8';
// ─── AUTH / SESSION ───────────────────────────────────
var SK_AUTH=SK+'_auth';
var SK_LOG=SK+'_log';
var SESSION=null;
var ACTLOG=[];

function hashPwd(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h)+s.charCodeAt(i);return(h>>>0).toString(36);}

function getAuth(){
  try{var r=localStorage.getItem(SK_AUTH);if(r)return JSON.parse(r);}catch(e){}
  return{admin:{id:'admin',pwd:hashPwd('admin'),name:'Admin'},staff:[]};
}
function saveAuth(a){try{localStorage.setItem(SK_AUTH,JSON.stringify(a));}catch(e){}}
function loadLog(){try{var r=localStorage.getItem(SK_LOG);if(r)ACTLOG=JSON.parse(r);}catch(e){}}
function saveLog(){try{localStorage.setItem(SK_LOG,JSON.stringify(ACTLOG));}catch(e){}}

function logAct(action){
  if(!SESSION)return;
  ACTLOG.unshift({uid:SESSION.id,uname:SESSION.name,role:SESSION.role,action:action,time:new Date().toISOString()});
  if(ACTLOG.length>200)ACTLOG=ACTLOG.slice(0,200);
  saveLog();
}

var PERM_LABELS={
  dashboard:'🏠 Dashboard',
  projects_view:'🏗️ Projects View',
  projects_edit:'🏗️ Projects Add/Edit/Delete',
  associates_view:'👥 Associates View',
  associates_edit:'👥 Associates Add/Edit/Delete',
  newsale:'➕ New Sale',
  salesrec:'📋 Sales Record View',
  sales_delete:'🗑️ Sale Delete',
  reports:'📊 Reports',
  offers_view:'🎯 Campaigns View'
};

var DEFAULT_PERMS={dashboard:true,projects_view:false,projects_edit:false,associates_view:true,associates_edit:false,newsale:true,salesrec:true,sales_delete:false,reports:true,offers_view:true};

function can(perm){
  if(!SESSION)return false;
  if(SESSION.role==='admin')return true;
  return!!(SESSION.perms&&SESSION.perms[perm]);
}

function doLogin(uid,pwd){
  var auth=getAuth();
  if(uid.toLowerCase()==='admin'&&auth.admin.pwd===hashPwd(pwd)){
    SESSION={id:'admin',name:'Admin',role:'admin',perms:null};
    logAct('Login kiya');hideLoginScreen();TAB='dashboard';render();return true;
  }
  var s=(auth.staff||[]).find(function(x){return x.id.toLowerCase()===uid.toLowerCase();});
  if(s&&s.pwd===hashPwd(pwd)){
    SESSION={id:s.id,name:s.name,role:'staff',perms:s.perms||{}};
    logAct('Login kiya');hideLoginScreen();TAB='dashboard';render();return true;
  }
  return false;
}

function doLogout(){
  if(SESSION)logAct('Logout kiya');
  SESSION=null;
  document.getElementById('nav').innerHTML='';
  document.getElementById('main').innerHTML='';
  document.getElementById('hdrUserInfo').innerHTML='';
  document.getElementById('hdrDate').textContent='';
  showLoginScreen();
}

function showLoginScreen(){
  document.getElementById('loginWrap').style.display='flex';
  setTimeout(function(){var el=document.getElementById('loginId');if(el)el.focus();},100);
}
function hideLoginScreen(){
  document.getElementById('loginWrap').style.display='none';
}

function doLoginBtn(){
  var uid=(document.getElementById('loginId')||{}).value||'';
  var pwd=(document.getElementById('loginPwd')||{}).value||'';
  var err=document.getElementById('loginErr');
  uid=uid.trim();
  if(!uid||!pwd){
    if(err){err.style.display='block';err.textContent='❌ User ID aur Password dono daalo!';}
    return;
  }
  // ── Brute force protection ──
  var BF_KEY='bf_'+uid;
  var bfRaw=null;try{bfRaw=JSON.parse(localStorage.getItem(BF_KEY)||'null');}catch(e){}
  var now=Date.now();
  if(bfRaw&&bfRaw.lockedUntil&&now<bfRaw.lockedUntil){
    var secsLeft=Math.ceil((bfRaw.lockedUntil-now)/1000);

function slabOf(g){for(var i=SLABS.length-1;i>=0;i--)if(g>=SLABS[i].min)return SLABS[i];return SLABS[0];}
function rOf(g){return slabOf(g).rate;}
function dOf(g){return slabOf(g).des;}
function nSlab(g){var c=slabOf(g);return SLABS.find(function(s){return s.l===c.l+1;})||null;}
function nBen(g){return BENS.find(function(b){return g<b.g;})||null;}
// salesGaj = sirf sales entry se aaya gaj (Tour/Tab for)
function salesGajOf(a){return a.salesGaj||0;}
// Get project rate based on booking date
function rInc(r){var x=RINC.find(function(x){return r>=x.min&&r<=x.max;});return x?x.pct:0;}
function getProjBonus(proj,bookingDate){
  if(!proj)return 0;
  // Use bonusHistory if available, find bonus active on bookingDate
  if(proj.bonusHistory&&proj.bonusHistory.length>0&&bookingDate){
    var sorted=proj.bonusHistory.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
    var pct=sorted[0].pct;
    for(var i=0;i<sorted.length;i++){
      if(sorted[i].date&&new Date(sorted[i].date)<=new Date(bookingDate))pct=sorted[i].pct;
      else break;
    }
    return pct;
  }
  // Fallback: use current bonusPct or ratePerGaj
  if(proj.bonusPct!==undefined)return proj.bonusPct;
  if(proj.ratePerGaj)return rInc(proj.ratePerGaj);
  return 0;
}

function getChain(id){
  var ch=[];var c=D.associates.find(function(a){return a.id===id;});
  while(c){ch.push(c);if(!c.parentId)break;c=D.associates.find(function(a){return a.id===c.parentId;});}
  return ch;
}
function getDownline(id){
  var res=[];
  function dfs(aid,d){
    var a=D.associates.find(function(x){return x.id===aid;});
    if(!a)return;
    res.push(Object.assign({},a,{_d:d}));
    D.associates.filter(function(x){return x.parentId===aid;}).forEach(function(ch){dfs(ch.id,d+1);});
  }
  dfs(id,0);
  return res;
}
function subtreeGaj(id){
  var dl=getDownline(id);
  var ids=new Set(dl.map(function(x){return x.id;}));
  return D.sales.filter(function(s){return ids.has(s.sellerId);}).reduce(function(s,sl){return s+sl.plotGaj;},0);
}
function selfGaj(id){
  return D.sales.filter(function(s){return s.sellerId===id;}).reduce(function(s,sl){return s+sl.plotGaj;},0);
}
function daysBetween(d1,d2){
  if(!d1||!d2)return null;
  return Math.floor((new Date(d2)-new Date(d1))/864e5);
}
function closingPct(d){
  if(d===null||d===undefined)return 0;
  if(d<=25)return 10;
  if(d<=60)return 0;
  return -10;
}
function nextPayDate(dateStr){

}

// ─── COMMISSION CALC ──────────────────────────────────
function calcChain(sGaj,ch,projRate,bk,cl,bonusOverride){
  var rPct=(bonusOverride!==undefined)?bonusOverride:rInc(projRate);
  var d=daysBetween(bk,cl);
  var cPct=closingPct(d);
  return ch.map(function(a,i){
    var liveG=(a.totalGaj||0)+sGaj;
    var myR=rOf(liveG);
    var blLive=i>0?((ch[i-1].totalGaj||0)+sGaj):0;
    var blR=i>0?rOf(blLive):0;
    var diff=myR-blR;
    var base=Math.max(0,diff*sGaj);
    var rB=Math.round(base*rPct/100);
    var cA=Math.round(base*Math.abs(cPct)/100)*(cPct>=0?1:-1);
    var total=Math.max(0,base+rB+cA);
    return {id:a.id,name:a.name,myR:myR,diff:diff,base:base,rPct:rPct,rB:rB,cPct:cPct,cA:cA,total:total,days:d,curG:a.totalGaj,newG:liveG,up:myR>rOf(a.totalGaj)};
  });
}

function calcDef(ch,sGaj,bk,cl){
  var d=daysBetween(bk,cl);
  var cPct=closingPct(d);
  var wComm=new Set();
  ch.forEach(function(a,i){
    var myR=rOf((a.totalGaj||0)+sGaj);
    var blR=i>0?rOf((ch[i-1].totalGaj||0)+sGaj):0;
    if(myR-blR>0)wComm.add(a.id);
  });
  var up=getChain(ch[0].id);
  var DR={1:100,2:75,3:50};
  var dep=0;var dc=[];
  for(var i=1;i<up.length&&dep<15;i++){
    var s=up[i];
    if(wComm.has(s.id))continue;
    var liveG=(s.totalGaj||0)+sGaj;
    if(liveG<10000)continue;
    dep++;
    var rate=DR[dep]||35;
    var baseAmt=rate*sGaj;
    var cAdj=Math.round(baseAmt*Math.abs(cPct)/100)*(cPct>=0?1:-1);
    var finalAmt=Math.max(0,baseAmt+cAdj);
    dc.push({id:s.id,name:s.name,depth:dep,rate:rate,baseAmt:baseAmt,cAdj:cAdj,cPct:cPct,amount:finalAmt,totalGaj:liveG,des:dOf(liveG)});
  }
  return dc;
}

function backupData(){
  var json=JSON.stringify(D,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var now=new Date();
  var ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  a.href=url;a.download='TrueStars_Backup_'+ts+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
  logAct('Data Backup liya');toast('✅ Backup downloaded! TrueStars_Backup_'+ts+'.json');
}
function restoreData(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      // Validate structure
      if(typeof imported!=='object'||!Array.isArray(imported.projects)||!Array.isArray(imported.associates)||!Array.isArray(imported.sales)){
        toast('❌ Invalid backup file! projects/associates/sales missing.',false);return;
      }
      if(!confirm('⚠️ Restore karega?\n\nProjects: '+imported.projects.length+'\nAssociates: '+imported.associates.length+'\nSales: '+imported.sales.length+'\n\nSaara current data replace ho jaayega. Confirm?'))return;
      D=imported;
      if(!D.deleted)D.deleted={associates:[],sales:[],projects:[]};
      if(!D.transfers)D.transfers=[];
      saveD();
      toast('✅ Data restored! Projects:'+D.projects.length+' Associates:'+D.associates.length+' Sales:'+D.sales.length);
      TAB='dashboard';render();
    }catch(err){toast('❌ File read error: '+err.message,false);}
  };
  reader.readAsText(file);
}

window.deleteStaff=function(staffId){
  var auth=getAuth();

};


function pgDash(){
  var tp=D.projects.reduce(function(s,p){return s+(p.plots?p.plots.length:0);},0);
  var sold=D.projects.reduce(function(s,p){return s+(p.plots?p.plots.filter(function(x){return x.status==='sold';}).length:0);},0);
  var booked=D.projects.reduce(function(s,p){return s+(p.plots?p.plots.filter(function(x){return x.status==='booked';}).length:0);},0);
  var cT=D.sales.reduce(function(s,sl){return s+(sl.chainTotal||0);},0);
  var dT=D.sales.reduce(function(s,sl){return s+(sl.defTotal||0);},0);
  var totGaj=D.sales.reduce(function(s,sl){return s+(sl.plotGaj||0);},0);
  var nowM=new Date().toISOString().substr(0,7);
  var thisMonSales=D.sales.filter(function(s){return s.bookingDate&&s.bookingDate.startsWith(nowM);}).length;
  var rec=D.sales.slice(0,8);

  // ── Stats ──
  var html='<div class="g4" style="margin-bottom:14px">'
    +'<div class="stat"><div class="sl">Projects</div><div class="sv" style="color:var(--bl)">'+D.projects.length+'</div></div>'
    +'<div class="stat"><div class="sl">Total Plots</div><div class="sv">'+tp+'</div></div>'
    +'<div class="stat"><div class="sl">Available</div><div class="sv" style="color:var(--gr)">'+(tp-sold-booked)+'</div></div>'
    +'<div class="stat"><div class="sl">Sold</div><div class="sv" style="color:var(--am)">'+sold+'</div></div>'
    +'<div class="stat"><div class="sl">Associates</div><div class="sv" style="color:var(--pu)">'+D.associates.length+'</div></div>'
    +'<div class="stat"><div class="sl">Total Gaj Sold</div><div class="sv" style="color:var(--pu)">'+totGaj+'</div></div>'
    +'<div class="stat"><div class="sl">Total Brokerage</div><div class="sv" style="font-size:16px;color:var(--gr)">₹'+fmtL(cT+dT)+'</div></div>'
    +'<div class="stat"><div class="sl">This Month Sales</div><div class="sv" style="color:var(--am)">'+thisMonSales+'</div></div>'
    +'</div>';

  // ── Project Progress + Top Associates side by side ──
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">';

  // Project Progress
  html+='<div class="card"><div class="ct">🏗️ Project Progress</div>';
  if(!D.projects.length){
    html+='<div style="color:var(--t3);font-size:12px">No projects yet</div>';
  } else {
    D.projects.forEach(function(p){
      var ptotal=p.plots?p.plots.length:0;if(!ptotal)return;
      var psold=p.plots.filter(function(x){return x.status==='sold';}).length;
      var pct=Math.round((psold/ptotal)*100);
      var barColor=pct>=75?'var(--gr)':pct>=40?'var(--am)':'var(--bl)';
      html+='<div style="margin-bottom:12px">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:4px">'
        +'<span style="font-weight:600;font-size:13px">'+p.name+'</span>'
        +'<span style="font-size:11px;color:var(--t2)">'+psold+'/'+ptotal+' sold</span>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +'<div style="flex:1;background:var(--bg3);border-radius:99px;height:7px;overflow:hidden">'
        +'<div style="width:'+pct+'%;height:7px;border-radius:99px;background:'+barColor+'"></div>'
        +'</div>'
        +'<span style="font-size:11px;color:var(--t2);white-space:nowrap">'+(ptotal-psold)+' bache</span>'
        +'</div></div>';
    });
  }
  html+='</div>';

  // Top Associates — toggle All Time / This Month / Custom
  var dashATab=window.dashATab||'all';
  var dashAMon=window.dashAMon||nowM;

  // Top Associates - DIRECT SALES GAJ ONLY
  // Sirf us associate ka gaj jo usne KHUD directly plot beja
  // Team ka gaj add nahi hoga
  var aMap={};
  D.sales.forEach(function(sl){
    if(dashATab==='month'&&!(sl.bookingDate&&sl.bookingDate.startsWith(nowM)))return;
    if(dashATab==='custom'&&!(sl.bookingDate&&sl.bookingDate.startsWith(dashAMon)))return;
    if(!sl.sellerId)return;
    var sname=sl.sellerName||sl.sellerId;
    if(!aMap[sl.sellerId])aMap[sl.sellerId]={name:sname,gaj:0,sales:0};
    aMap[sl.sellerId].gaj+=(sl.plotGaj||0);  // sirf is sale ka gaj
    aMap[sl.sellerId].sales++;
  });
  Object.keys(aMap).forEach(function(id){
    var a=D.associates.find(function(x){return x.id===id;});
    if(a)aMap[id].name=a.name;
  });
  var topList=Object.values(aMap).sort(function(a,b){return b.gaj-a.gaj;}).slice(0,5);

  html+='<div class="card">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div class="ct" style="margin:0">🏆 Top Associates</div>'
    
    +'<div style="display:flex;gap:0;border:1px solid var(--bd);border-radius:6px;overflow:hidden">'
    +'<button class="btn bsm" onclick="window.dashATab=\'all\';render()" style="border-radius:0;border:none;padding:3px 9px;font-size:11px;'+(dashATab==='all'?'background:var(--blb);color:var(--bld);font-weight:700':'')+'">All Time</button>'
    +'<button class="btn bsm" onclick="window.dashATab=\'month\';render()" style="border-radius:0;border:none;border-left:1px solid var(--bd);padding:3px 9px;font-size:11px;'+(dashATab==='month'?'background:var(--blb);color:var(--bld);font-weight:700':'')+'">This Month</button>'
    +'<button class="btn bsm" onclick="window.dashATab=\'custom\';render()" style="border-radius:0;border:none;border-left:1px solid var(--bd);padding:3px 9px;font-size:11px;'+(dashATab==='custom'?'background:var(--blb);color:var(--bld);font-weight:700':'')+'">Custom</button>'
    +'</div></div>';

  if(dashATab==='custom'){
    html+='<input type="month" value="'+dashAMon+'" onchange="window.dashAMon=this.value;render()" style="margin-bottom:10px;font-size:12px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--t1)"/>';
  }

  if(!topList.length){
    html+='<div style="color:var(--t3);font-size:12px;padding:8px 0">No data for this period</div>';
  } else {
    topList.forEach(function(a,i){
      var initial=a.name.charAt(0).toUpperCase();
      var colors=[['var(--blb)','var(--bld)'],['var(--grb)','var(--gr)'],['var(--pub)','var(--pu)'],['var(--amb)','var(--am)'],['var(--bg3)','var(--t2)']];
      var c=colors[i%colors.length];
      html+='<div style="display:flex;align-items:center;gap:10px;padding:7px 0;'+(i<topList.length-1?'border-bottom:1px solid var(--bd)':'')+'">'
        +'<div style="width:30px;height:30px;border-radius:50%;background:'+c[0]+';color:'+c[1]+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">'+initial+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+a.name+'</div>'
        +'<div style="font-size:11px;color:var(--t2)">'+(a.sales||0)+' sale'+(a.sales!==1?'s':'')+' · Direct</div>'
        +'</div>'
        +'<div style="font-weight:700;color:var(--pu);font-size:14px;white-space:nowrap">'+a.gaj+' gaj</div>'
        +'</div>';
    });
  }
  html+='</div></div>';

  // ── Recent Sales ──
  if(rec.length===0){
    html+='<div class="empty">No sales yet. Setup Projects and Associates then create a New Sale.</div>';
  } else {
    html+='<div class="card"><div class="ct">📈 Recent Sales</div><div class="tw"><table><thead><tr>'
      +'<th>#</th><th>Project</th><th>Plot</th><th>Buyer</th><th>Seller</th><th>Gaj</th><th>Date</th><th>Total ₹</th>'
      +'</tr></thead><tbody>';
    rec.forEach(function(s,i){
      html+='<tr>'
        +'<td style="color:var(--t3)">'+(i+1)+'</td>'
        +'<td><b>'+esc(s.projName)+'</b></td>'
        +'<td><span class="badge bbl2">'+esc(s.plotNo)+'</span></td>'
        +'<td>'+(s.partyName?esc(s.partyName):'—')+'</td>'
        +'<td>'+esc(s.sellerName)+'</td>'
        +'<td><b>'+s.plotGaj+'</b></td>'
        +'<td>'+(s.bookingDate?esc(s.bookingDate):'—')+'</td>'

        +'</tr>';
    });
    html+='</tbody></table></div></div>';
  }

  // ── Active Campaigns Widget ──
  try{
  var activeCampaigns=(D.offers||[]).filter(function(o){

  });
  if(activeCampaigns.length>0){
    html+='<div class="card" style="margin-top:14px">';

    html+='<div class="ct" style="margin:0">🎯 Active Campaigns</div>';
    html+='<button class="btn bgh bsm" onclick="sw(\'offers\')">View All</button>';
    html+='</div>';
    activeCampaigns.forEach(function(o){
      var end=new Date(o.endDate); end.setHours(0,0,0,0);
      var today=new Date(); today.setHours(0,0,0,0);
      var daysLeft=Math.ceil((end-today)/(1000*60*60*24));
      var stats=calcOfferStats(o);

      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg2);border-radius:8px;margin-bottom:6px;cursor:pointer;flex-wrap:wrap;gap:6px" onclick="ofId=\''+o.id+'\';ofView=\'detail\';sw(\'offers\')">';
      html+='<div>';

      html+='<div style="font-size:11px;color:var(--t2)">Ends: '+o.endDate+'</div>';

      html+='<div style="display:flex;gap:12px;align-items:center">';

      html+='</div>';
      html+='</div>';
    });
    html+='</div>';
  }
  }catch(e){console.error('Campaign widget error:',e);}

  return html;
}

  return html;
}

// Get top level (L1) ancestor of an associate
function getTopLeader(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a)return null;
  if(!a.parentId)return a; // Already L1
  var visited={};
  while(a&&a.parentId&&!visited[a.id]){
    visited[a.id]=true;
    var parent=D.associates.find(function(x){return x.id===a.parentId;});
    if(!parent)break;
    a=parent;
  }
  return a;
}

window.doTransfer=function(){
  var leftId=(document.getElementById('trLeft')||{}).value||'';
  if(!leftId){toast('Please select an associate!',false);return;}
  var leftA=D.associates.find(function(a){return a.id===leftId;});
  if(!leftA){return;}

  var newParentId=leftA.parentId||null;
  var directChildren=D.associates.filter(function(a){return a.parentId===leftId;});
  var count=directChildren.length;

  // Shift all direct children to leftA's parent
  directChildren.forEach(function(child){
    var ci=D.associates.findIndex(function(a){return a.id===child.id;});
    if(ci>=0)D.associates[ci].parentId=newParentId;
  });

  // Mark left associate name
  var li=D.associates.findIndex(function(a){return a.id===leftId;});
  if(li>=0&&!D.associates[li].name.includes('(Left)')){
    D.associates[li].name=D.associates[li].name+' (Left)';
  }

  saveD();
  closeM();
  toast('✅ '+count+' associates shifted successfully! '+leftA.name+' marked as (Left).');
  render();
};

function pgSale(){
  if(!can('newsale'))return '<div class="empty">⛔ New Sale banane ki permission nahi hai.</div>';
  var steps=[{n:1,l:'Project & Plot'},{n:2,l:'Associate & Dates'},{n:3,l:'Commission Review'}];
  var sh='<div class="steps">'+steps.map(function(s){
    var cls=sStep>s.n?'sdn':sStep===s.n?'sac':'std';
    return '<div class="step '+cls+'">'+(sStep>s.n?'✓ ':s.n+'. ')+s.l+'</div>';
  }).join('')+'</div>';

function pgSalesRec(){
  if(!can('salesrec'))return '<div class="empty">⛔ Sales Record dekhne ki permission nahi hai.</div>';
  var PER_PAGE=15;

  // Build project options
  var projOpts='<option value="">— All Projects —</option>';
  D.projects.forEach(function(p){
    projOpts+='<option value="'+p.id+'"'+(srProjF===p.id?' selected':'')+'>'+p.name+'</option>';
  });

  // Filter sales
  var filtered=D.sales.filter(function(s){
    if(srProjF&&s.projId!==srProjF)return false;
    if(srPlotF&&!s.plotNo.toUpperCase().includes(srPlotF.toUpperCase()))return false;
    return true;
  });

  var totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));

    // Chain table
    +(chainRows?'<div class="tw" style="margin-bottom:10px"><table><thead><tr><th>Associate</th><th>Diff Rate</th><th>Base ₹</th><th>Commission ₹</th></tr></thead><tbody>'+chainRows+'</tbody></table></div>':'')
    +(defRows?'<div class="tw" style="margin-bottom:10px"><table><thead><tr><th>Defence Associate</th><th>Depth · Rate</th><th></th><th>Amount ₹</th></tr></thead><tbody>'+defRows+'</tbody></table></div>':'')

    // ── Section 3: Plot Info ──

    +'<div class="fld"><label>Plot No</label><input value="'+s.plotNo+'" disabled style="background:var(--bg3);color:var(--t3)"/></div>'
    +'<div class="fld"><label>Plot Size Gaj</label><input value="'+(s.plotSizeGaj||s.plotGaj)+'" disabled style="background:var(--bg3);color:var(--t3)"/></div>'
    +'<div class="fld"><label>Saleable Gaj</label><input value="'+s.plotGaj+'" disabled style="background:var(--bg3);color:var(--t3)"/></div>'

  });
};

// Delete Sale Record
window.deleteSaleRec=function(saleId){saleId=typeof saleId==='object'?saleId.dataset.sid:saleId;
  if(!can('sales_delete')){toast('Sale delete ki permission nahi hai!',false);return;}
  var s=D.sales.find(function(x){return x.id===saleId;});if(!s)return;
  if(!confirm('Sale delete hogi:\n\nProject: '+s.projName+'\nPlot: '+s.plotNo+'\nSeller: '+s.sellerName+'\n\nPlot wapas Available ho jaayega more associate ka gaj bhi wapas hoga. Confirm?'))return;
  // Restore plot status
  for(var pi=0;pi<D.projects.length;pi++){
    var pli=D.projects[pi].plots?D.projects[pi].plots.findIndex(function(pl){return pl.id===s.plotId;}):- 1;
    if(pli>=0){D.projects[pi].plots[pli].status='available';break;}
  }
  // Restore associate gaj
  var sGaj=s.plotGaj||0;
  if(s.commissions)s.commissions.forEach(function(c){
    var ai=D.associates.findIndex(function(a){return a.id===c.id;});
    if(ai>=0){
      D.associates[ai].totalGaj=Math.max(0,Math.round((D.associates[ai].totalGaj-sGaj)*100)/100);
      D.associates[ai].salesGaj=Math.max(0,Math.round(((D.associates[ai].salesGaj||0)-sGaj)*100)/100);
    }
  });
  var _sd=D.sales.find(function(x){return x.id===saleId;});
  // Soft delete
  if(!D.deleted)D.deleted={associates:[],sales:[],projects:[]};
  if(!D.deleted.sales)D.deleted.sales=[];
  if(_sd)D.deleted.sales.push(Object.assign({},_sd,{deletedAt:new Date().toISOString(),deletedBy:SESSION?SESSION.name:'Admin'}));
  D.sales=D.sales.filter(function(x){return x.id!==saleId;});
  saveD();logAct('Sale Soft Delete: '+(_sd?_sd.projName+' | Plot '+_sd.plotNo:''));toast('Sale deleted! Restore Settings se kar sakte ho. ✓');closeM();render();
};

function pgRpt(){
  if(!can('reports'))return '<div class="empty">⛔ Reports dekhne ki permission nahi hai.</div>';
  // Staff ko: Associate Info (r1), Project/Plot (r3), Brokerage (r4) - view only
  var isAdmin=SESSION&&SESSION.role==='admin';
  var tabs=isAdmin
    ?[['r1','1️⃣ Associate Info'],['r2','2️⃣ Sales & Gaj'],['r3','3️⃣ Project/Plot'],['r4','💰 Brokerage'],['r5','📅 Monthly'],['r6','🧾 Statement']]
    :[['r1','1️⃣ Associate Info'],['r3','3️⃣ Project/Plot'],['r4','💰 Brokerage']];
  // Staff ka rTab sirf r1/r3/r4 ho sakta hai
  if(!isAdmin&&rTab!=='r1'&&rTab!=='r3'&&rTab!=='r4')rTab='r1';
  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">'
    +'<h2 style="font-size:15px;font-weight:700">📊 Reports</h2>'
    +'</div>'
    +'<div style="display:flex;border-bottom:2px solid var(--bd);margin-bottom:14px;overflow-x:auto">';
  tabs.forEach(function(t){
    html+='<button onclick="rTab=\''+t[0]+'\';render()" style="padding:9px 14px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid '+(rTab===t[0]?'var(--bl)':'transparent')+';color:'+(rTab===t[0]?'var(--bl)':'var(--t2)')+'">'+t[1]+'</button>';
  });
  html+='</div>';
  if(rTab==='r1')html+=rpt1();
  else if(rTab==='r2')html+=rpt2();
  else if(rTab==='r3')html+=rpt3();
  else if(rTab==='r4')html+=rpt4();
  else if(rTab==='r5')html+=rpt5();
  else html+=rpt6();
  return html;
}

function setR1Mode(m){r1Mode=m===0?'total':'legwise';r1LegId='';r1FocusId='';r1P=1;render();}
function setR1Leg(v){r1LegId=v;r1FocusId='';r1P=1;render();}
function setR1Focus(v){r1FocusId=v;r1P=1;render();}

function rpt1(){
  if(!D.associates.length)return '<div class="empty">Koi associate nahi</div>';
  var PER_PAGE=10;

  function buildTree(pid,lv){
    return D.associates.filter(function(a){return pid===null?!a.parentId:a.parentId===pid;})
      .sort(function(a,b){return a.name.localeCompare(b.name);})
      .reduce(function(acc,a){return acc.concat([Object.assign({},a,{_l:lv})],buildTree(a.id,lv+1));},[]); 
  }
  var tree=buildTree(null,0);
  var clrs=['var(--bl)','var(--gr)','var(--am)','var(--pu)'];
  var bgs=['var(--blb)','var(--grb)','var(--amb)','var(--pub)'];

  // ── Top-level legs (L1 associates) ──
  var topLegs=D.associates.filter(function(a){return !a.parentId;});

  // ── Helper: get all ancestor IDs of a node ──
  function getAncestors(id){
    var ids=[];
    var cur=D.associates.find(function(a){return a.id===id;});
    while(cur&&cur.parentId){
      ids.push(cur.parentId);
      cur=D.associates.find(function(a){return a.id===cur.parentId;});
    }
    return ids;
  }
  // ── Helper: get all descendant IDs of a node ──
  function getDescendants(id){
    var ids=[];
    function walk(pid){
      D.associates.filter(function(a){return a.parentId===pid;}).forEach(function(a){
        ids.push(a.id);walk(a.id);
      });
    }
    walk(id);
    return ids;
  }

  var html='';
  r1Mode='total'; // Always total in Associate Info

  // ══════════════════════════════
  // MODE: TOTAL ASSOCIATES
  // ══════════════════════════════
  if(r1Mode==='total'){
    var filtered=r1F?tree.filter(function(a){
      var q=r1F.toLowerCase();
      return a.name.toLowerCase().includes(q)
        ||(a.phone||'').includes(q)
        ||(a.rera||'').toLowerCase().includes(q)
        ||(a.code||'').toLowerCase().includes(q)
        ||(a.pan||'').toLowerCase().includes(q);
    }).sort(function(a,b){return a.name.localeCompare(b.name);}):tree;

    var totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
    if(r1P>totalPages)r1P=1;
    var pageData=filtered.slice((r1P-1)*PER_PAGE, r1P*PER_PAGE);

    // Search bar
    html+='<div class="card" style="margin-bottom:10px;padding:10px 14px">'
      +'<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">'
      +'<input id="r1Search" type="text" autocomplete="off" placeholder="Search by Name, Phone, RERA, PAN..." '
      +'value="'+r1F+'" oninput="doR1Search(this.value)" '
      +'style="flex:1;min-width:200px;font-size:13px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)"/>'
      +(r1F?'<button class="btn bgh bsm" onclick="r1F=String();r1P=1;render()">✕ Clear</button>':'')
      +'<span style="font-size:12px;color:var(--t2);white-space:nowrap">'+filtered.length+' associates</span>'
      +'<button class="btn bbl bsm" onclick="expR1()">📥 Excel Export</button>'
      +'</div></div>';

    html+=r1Table(pageData,r1P,PER_PAGE,totalPages,filtered.length,clrs,bgs,'','');
    return html;
  }

  // ══════════════════════════════
  // MODE: LEG WISE
  // ══════════════════════════════

  // Leg selector dropdown
  var legOpts='<option value="">— Select Leg (Top Associate) —</option>';
  topLegs.forEach(function(a){
    var downCount=getDescendants(a.id).length;
    legOpts+='<option value="'+a.id+'" '+(r1LegId===a.id?'selected':'')+'>'+esc(a.name)+' ('+downCount+' downline)</option>';
  });

  html+='<div class="card" style="margin-bottom:10px;padding:12px 14px">'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
    +'<div class="fld" style="flex:1;min-width:200px;margin:0"><label>Select Leg</label>'
    +'<select onchange="setR1Leg(this.value)">'+legOpts+'</select></div>';

  if(r1LegId){
    // Focus associate dropdown - show everyone in this leg
    var legTree=[];
    function buildLegTree(pid,lv){
      D.associates.filter(function(a){return pid===null?a.id===r1LegId:a.parentId===pid;})
        .forEach(function(a){
          legTree.push(Object.assign({},a,{_l:lv}));
          buildLegTree(a.id,lv+1);
        });
    }
    buildLegTree(null,0);

    var focusOpts='<option value="">— Highlight an Associate —</option>';
    legTree.forEach(function(a){
      var indent='&nbsp;'.repeat(a._l*2);
      focusOpts+='<option value="'+a.id+'" '+(r1FocusId===a.id?'selected':'')+'>'+indent+esc(a.name)+'</option>';
    });

    html+='<div class="fld" style="flex:1;min-width:200px;margin:0"><label>Focus Associate (optional)</label>'
      +'<select onchange="setR1Focus(this.value)">'+focusOpts+'</select></div>';
  }

  html+='<button class="btn bbl bsm" onclick="expR1()" style="align-self:flex-end">📥 Excel</button>'
    +'</div></div>';

  if(!r1LegId){
    html+='<div class="empty" style="padding:30px;text-align:center">👆 Select a leg from the dropdown above</div>';
    return html;
  }

  // Build leg tree
  var legData=[];
  function buildLeg(pid,lv){
    D.associates.filter(function(a){return pid===null?a.id===r1LegId:a.parentId===pid;})
      .forEach(function(a){
        legData.push(Object.assign({},a,{_l:lv}));
        buildLeg(a.id,lv+1);
      });
  }
  buildLeg(null,0);

  // If focus selected: show upline + focus + downline, rest dimmed
  var ancestorIds=r1FocusId?getAncestors(r1FocusId):[];
  var descendantIds=r1FocusId?getDescendants(r1FocusId):[];

  // Stats bar
  var legGaj=legData.reduce(function(s,a){return s+(a.totalGaj||0);},0);
  var legSales=D.sales.filter(function(s){
    return legData.some(function(a){return a.id===s.sellerId;});
  }).length;
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
    +'<div class="stat" style="flex:1;min-width:100px"><div class="sl">Associates in Leg</div><div class="sv" style="color:var(--bl)">'+legData.length+'</div></div>'
    +'<div class="stat" style="flex:1;min-width:100px"><div class="sl">Total Gaj</div><div class="sv" style="color:var(--gr)">'+legGaj+'</div></div>'
    +'<div class="stat" style="flex:1;min-width:100px"><div class="sl">Total Sales</div><div class="sv" style="color:var(--am)">'+legSales+'</div></div>'
    +(r1FocusId?'<div class="stat" style="flex:1;min-width:100px;border:2px solid var(--am)"><div class="sl">Upline</div><div class="sv" style="color:var(--am)">'+ancestorIds.length+'</div></div>':'')
    +(r1FocusId?'<div class="stat" style="flex:1;min-width:100px;border:2px solid var(--gr)"><div class="sl">Downline</div><div class="sv" style="color:var(--gr)">'+descendantIds.length+'</div></div>':'')
    +'</div>';

  var totalPages=Math.max(1,Math.ceil(legData.length/PER_PAGE));
  if(r1P>totalPages)r1P=1;
  var pageData=legData.slice((r1P-1)*PER_PAGE,r1P*PER_PAGE);

  html+=r1Table(pageData,r1P,PER_PAGE,totalPages,legData.length,clrs,bgs,r1FocusId,ancestorIds);
  return html;
}

// ── Shared table renderer ──
function r1Table(pageData,page,PER_PAGE,totalPages,totalCount,clrs,bgs,focusId,ancestorIds){
  var html='<div class="card" style="padding:0;overflow:hidden">'
    +'<div style="padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">'
    +'<div class="ct" style="margin:0">👥 Associate Directory</div>'
    +'<span style="font-size:12px;color:var(--t2)">Page '+page+' / '+totalPages+' &nbsp;('+totalCount+' total)</span>'
    +'</div>'
    +'<div class="tw" style="border:none;border-radius:0"><table><thead><tr>'
    +'<th>#</th><th>Level</th><th>Name</th><th>Father/Husband</th><th>Phone</th><th>RERA No.</th><th>Upliner</th><th>Joining</th>'
    +'</tr></thead><tbody id="r1TBody">';

  if(pageData.length===0){
    html+='<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--t3)">No associate found</td></tr>';
  } else {
    pageData.forEach(function(a,i){
      var par=a.parentId?D.associates.find(function(p){return p.id===a.parentId;}):null;
      var li=Math.min(a._l,3);
      var arr='&nbsp;'.repeat(a._l*3)+(a._l>0?'↳ ':'');
      var rowNum=(page-1)*PER_PAGE+i+1;
      var cs=slabOf(a.totalGaj);
      var waNum=a.phone?a.phone.replace(/\D/g,''):'';
      if(waNum.length===10)waNum='91'+waNum;

      // Highlight logic
      var isFocus=focusId&&a.id===focusId;
      var isAncestor=focusId&&ancestorIds.indexOf(a.id)>=0;
      var rowStyle='';
      if(isFocus){
        rowStyle='background:linear-gradient(90deg,rgba(239,159,39,.25),transparent);outline:2px solid var(--am);';
      } else if(isAncestor){
        rowStyle='background:rgba(53,167,120,.08);';
      } else if(focusId){
        rowStyle='opacity:.45;';
      }

      html+='<tr style="'+rowStyle+'">'
        +'<td style="color:var(--t3)">'+rowNum+'</td>'
        +'<td><span class="badge" style="background:'+bgs[li]+';color:'+clrs[li]+'">L'+(a._l+1)+'</span></td>'
        +'<td>'+arr
          +(isFocus?'<span style="background:var(--am);color:#fff;padding:1px 6px;border-radius:4px;font-size:11px;margin-right:4px;font-weight:700">★ Focus</span>':'')
          +(isAncestor?'<span style="background:var(--grb);color:var(--gr);padding:1px 6px;border-radius:4px;font-size:11px;margin-right:4px">↑ Upline</span>':'')
          +'<b data-aid="'+a.id+'" onclick="showAssocView(this.dataset.aid)" style="cursor:pointer;color:var(--bl)">'+esc(a.name)+'</b>'
          +(function(){var tl=getTopLeader(a.id);return tl&&tl.id!==a.id?'<span style="font-size:10px;color:var(--t2);margin-left:5px">👑 '+esc(tl.name)+'</span>':'';}())
        +'</td>'
        +'<td style="font-size:12px">'+(a.fatherName?esc(a.fatherName):'—')+'</td>'
        +'<td>'+(a.phone?'<a href="https://wa.me/'+waNum+'" target="_blank" style="color:var(--gr);text-decoration:none;font-size:13px" title="WhatsApp">📱 '+esc(a.phone)+'</a>':'—')+'</td>'
        +'<td style="color:var(--bl);font-size:12px">'+(a.rera?esc(a.rera):'—')+'</td>'
        +'<td style="font-size:12px;color:var(--t2)">'+(par?esc(par.name):'— Top Level —')+'</td>'
        +'<td style="font-size:12px">'+(a.joiningDate?esc(a.joiningDate):'—')+'</td>'
        +'</tr>';
    });
  }
  html+='</tbody></table></div>';

  html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--bd);flex-wrap:wrap;gap:8px">'
    +'<span style="font-size:13px;color:var(--t2)">'+totalCount+' associates · Page '+page+' / '+totalPages+'</span>'
    +'<div style="display:flex;align-items:center;gap:5px;position:relative">'
    +'<button class="btn bgh bsm" onclick="if(r1P>1){r1P--;doR1Search(r1F,true)}" '+(page<=1?'disabled':'')+'>← Prev</button>'
    +'<div style="position:relative">'
    +'<button class="btn bbl bsm" onclick="toggleR1Pag()" style="min-width:110px">Page '+page+' / '+totalPages+' ▾</button>'
    +'<div id="r1PagDrop" style="display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px;z-index:200;min-width:200px">'
    +'<div style="font-size:11px;color:var(--t3);padding:2px 4px 6px;border-bottom:1px solid var(--bd);margin-bottom:6px">Page pe jaao</div>'
    +'<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px" id="r1PagGrid"></div>'

    +'</div></div>';

}

function doR1Search(q,keepPage){
  r1F=q;
  if(!keepPage)r1P=1;
  // Update table body without full re-render to keep focus
  var PER_PAGE=10;
  function buildTree(pid,lv){
    return D.associates.filter(function(a){return pid===null?!a.parentId:a.parentId===pid;}).reduce(function(acc,a){return acc.concat([Object.assign({},a,{_l:lv})],buildTree(a.id,lv+1));},[]); 
  }
  var tree=buildTree(null,0);
  var filtered=q?tree.filter(function(a){
    var ql=q.toLowerCase();
    return a.name.toLowerCase().includes(ql)||(a.phone||'').includes(ql)||(a.rera||'').toLowerCase().includes(ql)||(a.code||'').toLowerCase().includes(ql)||(a.pan||'').toLowerCase().includes(ql);
  }).sort(function(a,b){return a.name.localeCompare(b.name);}):tree;
  var totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(r1P>totalPages)r1P=1;
  var pageData=filtered.slice((r1P-1)*PER_PAGE, r1P*PER_PAGE);
  var clrs=['var(--bl)','var(--gr)','var(--am)','var(--pu)'];
  var bgs=['var(--blb)','var(--grb)','var(--amb)','var(--pub)'];
  var tbody=document.getElementById('r1TBody');
  if(!tbody)return;
  var html='';
  if(pageData.length===0){
    html='<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--t3)">No results found for "'+q+'"</td></tr>';
  } else {
    pageData.forEach(function(a,i){
      var par=a.parentId?D.associates.find(function(p){return p.id===a.parentId;}):null;
      var li=Math.min(a._l,3);
      var arr='&nbsp;'.repeat(a._l*3)+(a._l>0?'↳ ':'');
      var cs=slabOf(a.totalGaj);
      var waNum=a.phone?a.phone.replace(/\D/g,''):'';
      if(waNum.length===10)waNum='91'+waNum;
      var rowNum=(r1P-1)*PER_PAGE+i+1;
      html+='<tr>'
        +'<td style="color:var(--t3)">'+rowNum+'</td>'
        +'<td><span class="badge" style="background:'+bgs[li]+';color:'+clrs[li]+'">L'+(a._l+1)+'</span></td>'
        +'<td>'+arr+'<b data-aid="'+a.id+'" onclick="showAssocView(this.dataset.aid)" style="cursor:pointer;color:var(--bl)">'+esc(a.name)+'</b>'
          +(function(){var tl=getTopLeader(a.id);return tl&&tl.id!==a.id?'<span style="font-size:10px;color:var(--t2);margin-left:5px">👑 '+esc(tl.name)+'</span>':'';}())
          +'</td>'
        +'<td style="font-size:12px">'+(a.fatherName?esc(a.fatherName):'—')+'</td>'
        +'<td>'+(a.phone?'<a href="https://wa.me/'+waNum+'" target="_blank" style="color:var(--gr);text-decoration:none;font-size:13px" title="WhatsApp">📱 '+esc(a.phone)+'</a>':'—')+'</td>'
        +'<td style="color:var(--bl);font-size:12px">'+(a.rera?esc(a.rera):'—')+'</td>'
        +'<td style="font-size:12px;color:var(--t2)">'+(par?esc(par.name):'— Top Level —')+'</td>'
        +'<td style="font-size:12px">'+(a.joiningDate?esc(a.joiningDate):'—')+'</td>'
        +'</tr>';
    });
  }
  tbody.innerHTML=html;
  // Update count
  var cnt=document.querySelector('#r1Search')?.parentElement?.parentElement?.querySelector('span');
  if(cnt)cnt.textContent=filtered.length+' associates';
}

// ── ASSOC WISE ──────────────────────────────────────────
function rpt4Assoc(){
  var assocMap={};
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    if(r4MonF&&!(sl.bookingDate&&sl.bookingDate.startsWith(r4MonF)))return;
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(r4AssocF&&c.id!==r4AssocF)return;
      if(!c.total||c.total<=0)return;
      if(!assocMap[c.id])assocMap[c.id]={id:c.id,name:c.name,chain:0,def:0,sales:[],lastDate:''};
      assocMap[c.id].chain+=c.total;
      assocMap[c.id].sales.push({sl:sl,type:'Chain',amt:c.total});
      if((sl.bookingDate||'')>(assocMap[c.id].lastDate||''))assocMap[c.id].lastDate=sl.bookingDate||'';
    });
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(r4AssocF&&c.id!==r4AssocF)return;
      if(!c.amount||c.amount<=0)return;
      if(!assocMap[c.id])assocMap[c.id]={id:c.id,name:c.name,chain:0,def:0,sales:[],lastDate:''};
      assocMap[c.id].def+=c.amount;
      assocMap[c.id].sales.push({sl:sl,type:'Defence D'+c.depth,amt:c.amount});
    });
  });
  var list=Object.values(assocMap).filter(function(a){return (a.chain+a.def)>0;}).sort(function(a,b){return (b.chain+b.def)-(a.chain+a.def);});
  var totChain=list.reduce(function(s,a){return s+a.chain;},0);
  var totDef=list.reduce(function(s,a){return s+a.def;},0);
  if(!list.length)return '<div class="empty">Filter mein koi brokerage data nahi</div>';

  var html='<div class="g4" style="margin-bottom:10px">'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Associates</div><div class="sv">'+list.length+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Total Brokerage</div><div class="sv" style="font-size:15px;color:var(--gr)">₹'+fmtL(totChain+totDef)+'</div></div>'
    +'</div>';

  html+='<div class="card" style="padding:0"><div class="tw" style="border:none;border-radius:0"><table><thead><tr>'
    +'<th>#</th><th>Associate</th><th>Phone</th><th>RERA</th><th>Designation</th>'
    +'<th>Sales Count</th><th>Total Brokerage ₹</th>'
    +'</tr></thead><tbody>';
  // Store sales data for popup — serialize to global
  var salesLookup={};
  list.forEach(function(a){salesLookup[a.id]=a.sales;});
  window._broSalesLookup=salesLookup;

  list.forEach(function(a,i){
    var aObj=D.associates.find(function(x){return x.id===a.id;});
    html+='<tr style="background:'+(i%2===0?'#fff':'var(--bg3)')+'"><td style="color:var(--t3)">'+(i+1)+'</td>'
      +'<td><b>'+a.name+'</b></td>'
      +'<td>'+(aObj?aObj.phone||'—':'—')+'</td>'
      +'<td style="color:var(--bl);font-size:12px">'+(aObj?aObj.rera||'—':'—')+'</td>'
      +'<td style="font-size:11px">'+(aObj?dOf(aObj.totalGaj):'—')+'</td>'
      +'<td style="text-align:center">'
      +'<button class="btn bbl2" data-aid="'+a.id+'" onclick="showBroSales(this.dataset.aid,\''+a.name+'\')" '
      +'style="background:var(--blb);color:var(--bl);border:1px solid var(--bl);padding:3px 10px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer">'
      +a.sales.length+' 🔍</button>'
      +'</td>'
      +'<td style="color:var(--gr);font-weight:700;font-size:15px">₹'+fmt(a.chain+a.def)+'</td>'
      
      +'</tr>';
  });
  html+='<tr style="background:var(--bg3);font-weight:700;border-top:2px solid var(--bd)"><td colspan="6" style="padding:8px 10px">TOTAL</td>'
    +'<td style="padding:8px 10px;color:var(--bl)">₹'+fmt(totChain)+'</td>'
    +'<td style="padding:8px 10px;color:var(--pu)">₹'+fmt(totDef)+'</td>'
    +'<td style="padding:8px 10px;color:var(--gr);font-size:15px">₹'+fmt(totChain+totDef)+'</td><td></td></tr>'
    +'</tbody></table></div></div>';
  return html;
}

window.showBroSales=function(assocId,assocName){
  var sales=window._broSalesLookup&&window._broSalesLookup[assocId];
  if(!sales||!sales.length){toast('No sales yet',false);return;}

window.expSingleAssoc=function(assocId){
  if(!window.XLSX){toast('XLSX library not loaded',false);return;}
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a){return;}
  var wb=XLSX.utils.book_new();
  var rows=[['#','Month','Project','Plot No','Plot Size','Saleable Gaj','Seller','Buyer','Booking Date','Closing Date','Brokerage (Rs.)']];
  var ri=0;
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    var mon=sl.bookingDate?sl.bookingDate.substr(0,7):'—';
    if(r4MonF&&!mon.startsWith(r4MonF))return;
    var plotSize=sl.plotSizeGaj||sl.plotGaj;
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(c.id!==assocId||!c.total||c.total<=0)return;
      ri++;rows.push([ri,mon,sl.projName,sl.plotNo,plotSize,sl.plotGaj,sl.sellerName||'',sl.partyName||'',sl.bookingDate||'',sl.closeDate||'',c.total]);
    });
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(c.id!==assocId||!c.amount||c.amount<=0)return;
      ri++;rows.push([ri,mon,sl.projName,sl.plotNo,plotSize,sl.plotGaj,sl.sellerName||'',sl.partyName||'',sl.bookingDate||'',sl.closeDate||'',c.amount]);
    });
  });
  if(!ri){toast('No data found!',false);return;}
  var total=rows.slice(1).reduce(function(s,r){return s+(r[10]||0);},0);
  rows.push(['','','TOTAL','','','','','','','',total]);
  var ws=XLSX.utils.aoa_to_sheet(rows);
  xlStyle(wb,ws,[{wch:4},{wch:10},{wch:24},{wch:10},{wch:13},{wch:13},{wch:22},{wch:22},{wch:13},{wch:13},{wch:16}]);
  XLSX.utils.book_append_sheet(wb,ws,a.name.substr(0,31));
  XLSX.writeFile(wb,'Brokerage_'+a.name.replace(/[^a-zA-Z0-9]/g,'_')+(r4MonF?'_'+r4MonF:'')+'.xlsx');
  toast('✅ '+a.name+' ka Excel ready! '+ri+' rows 📊');
};

window.openAssocInvoice=function(assocId){
  var a=D.associates.find(function(x){return x.id===assocId;});
  if(!a)return;
  var allSales=D.sales.filter(function(s){
    var inChain=s.commissions&&s.commissions.some(function(c){return c.id===assocId&&c.total>0;});
    var inDef=s.defCommissions&&s.defCommissions.some(function(c){return c.id===assocId&&c.amount>0;});
    return inChain||inDef;
  });
  if(!allSales.length){toast(a.name+' has no brokerage found!',false);return;}
  var monthSet={};
  allSales.forEach(function(s){if(s.bookingDate&&s.bookingDate.length>=7)monthSet[s.bookingDate.substr(0,7)]=1;});
  var months=Object.keys(monthSet).sort().reverse();
  var projSet={};
  allSales.forEach(function(s){projSet[s.projId]={id:s.projId,name:s.projName};});
  var projs=Object.values(projSet);
  var mOpts='<option value="">— Select Month (Zaroori) —</option>';
  months.forEach(function(m){mOpts+='<option value="'+m+'">'+m+'</option>';});
  var pOpts='<option value="">— All Projects —</option>';

function rpt4Leg(){
  // ── Filters ──────────────────────────────────────
  // r4MonF, r4ProjF already exist; add sector filter var
  var secF=window.r4SecF||'';
  var assocF=window.r4LegAssocF||'';

  // Build unique location/sector list from associates
  var secSet={};
  D.associates.forEach(function(a){if(a.location)secSet[a.location.trim()]=1;});
  var sectors=Object.keys(secSet).sort();

  // Extra filters HTML (sector + specific associate)
  var secOpts='<option value="">— All Sectors/Location —</option>';
  sectors.forEach(function(s){secOpts+='<option value="'+s+'"'+(secF===s?' selected':'')+'>'+s+'</option>';});

  var aOpts='<option value="">— All Associates —</option>';
  D.associates.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(a){
    if(secF&&(a.location||'').trim()!==secF)return;
    aOpts+='<option value="'+a.id+'"'+(assocF===a.id?' selected':'')+'>'+a.name+(a.location?' ('+a.location+')':'')+'</option>';
  });

  var html='<div class="g4" style="margin-bottom:10px;gap:8px">'
    +'<div class="fld" style="margin:0"><label>Sector / Location</label>'
    +'<select onchange="window.r4SecF=this.value;window.r4LegAssocF=\'\';render()">'
    +secOpts+'</select></div>'
    +'<div class="fld" style="margin:0"><label>Associate</label>'
    +'<select onchange="window.r4LegAssocF=this.value;render()">'
    +aOpts+'</select></div>'
    +'</div>';

  // ── Build per-associate brokerage rows ────────────
  var assocMap={};
  function getOrCreate(id,name){
    if(!assocMap[id]){
      var a=D.associates.find(function(x){return x.id===id;})||{};
      assocMap[id]={id:id,name:name,phone:a.phone||'—',rera:a.rera||'—',
        pan:a.pan||'—',location:a.location||'',bankingName:a.bankingName||name,
        bankName:a.bankName||'—',accNo:a.accNo||'—',ifsc:a.ifsc||'—',
        rows:[],chain:0,def:0};
    }
    return assocMap[id];
  }

  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    if(r4MonF&&!(sl.bookingDate&&sl.bookingDate.startsWith(r4MonF)))return;
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(!c.total||c.total<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;});
      if(!a)return;
      if(secF&&(a.location||'').trim()!==secF)return;
      if(assocF&&a.id!==assocF)return;
      var rec=getOrCreate(c.id,c.name);
      rec.rows.push({proj:sl.projName,plotNo:sl.plotNo,plotSize:sl.plotSizeGaj||sl.plotGaj,saleable:sl.plotGaj,seller:sl.sellerName||'—',buyer:sl.partyName||'—',booking:sl.bookingDate||'—',closing:sl.closeDate||'—',type:'Chain',amount:c.total});
      rec.chain+=c.total;
    });
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(!c.amount||c.amount<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;});
      if(!a)return;
      if(secF&&(a.location||'').trim()!==secF)return;
      if(assocF&&a.id!==assocF)return;
      var rec=getOrCreate(c.id,c.name);
      rec.rows.push({proj:sl.projName,plotNo:sl.plotNo,plotSize:sl.plotSizeGaj||sl.plotGaj,saleable:sl.plotGaj,seller:sl.sellerName||'—',buyer:sl.partyName||'—',booking:sl.bookingDate||'—',closing:sl.closeDate||'—',type:'Defence D'+c.depth,amount:c.amount});
      rec.def+=c.amount;
    });
  });

  var list=Object.values(assocMap).filter(function(a){return a.rows.length>0;})
    .sort(function(a,b){return (b.chain+b.def)-(a.chain+a.def);});

  if(!list.length){
    html+='<div class="empty" style="margin-top:16px">No brokerage data found for this filter</div>';
    return html;
  }

    +'<div class="stat" style="padding:8px 12px"><div class="sl">Total Sales</div><div class="sv">'+totSales+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Chain + Defence</div><div class="sv" style="font-size:14px;color:var(--bl)">'+'\u20b9'+fmtL(totChain)+'  +  '+'\u20b9'+fmtL(totDef)+'</div></div>'
    +'<div class="stat" style="padding:8px 12px"><div class="sl">Grand Total</div><div class="sv" style="font-size:15px;color:var(--gr)">'+'\u20b9'+fmtL(totChain+totDef)+'</div></div>'
    +'</div>';

      +'<div style="font-weight:700;font-size:15px;color:var(--gr)">'+'\u20b9'+fmt(tot)+'</div>'

function expBrokerage(){

  // Sheet 1: Associate-wise summary
  var s1=[['#','Associate Name','Phone','RERA No','Total Brokerage (Rs.)','Payment Date']];
  var assocMap={};
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    if(r4MonF&&!(sl.bookingDate&&sl.bookingDate.startsWith(r4MonF)))return;
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(!c.total||c.total<=0)return;
      if(!assocMap[c.id])assocMap[c.id]={name:c.name,rera:'',phone:'',total:0,lastDate:sl.bookingDate||''};
      assocMap[c.id].total+=c.total;
      if((sl.bookingDate||'')>assocMap[c.id].lastDate)assocMap[c.id].lastDate=sl.bookingDate||'';
    });
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(!c.amount||c.amount<=0)return;
      if(!assocMap[c.id])assocMap[c.id]={name:c.name,rera:'',phone:'',total:0,lastDate:sl.bookingDate||''};
      assocMap[c.id].total+=c.amount;
    });
  });
  D.associates.forEach(function(a){if(assocMap[a.id]){assocMap[a.id].rera=a.rera||'';assocMap[a.id].phone=a.phone||'';}});
  var list=Object.values(assocMap).filter(function(a){return a.total>0;}).sort(function(a,b){return b.total-a.total;});
  list.forEach(function(a,i){
    s1.push([i+1,a.name,a.phone,a.rera,a.total,nextPayDate(a.lastDate)]);
  });
  var grandTotal=list.reduce(function(s,a){return s+a.total;},0);
  s1.push(['','GRAND TOTAL','','','',grandTotal,'']);

  // Sheet 2: Plot-wise detail per associate
  var s2=[['#','Month','Associate Name','RERA No','Project','Plot No','Buyer','Booking Date','Closing Date','Brokerage (Rs.)']];
  var ri=0;
  D.associates.forEach(function(assoc){
    D.sales.forEach(function(sl){
      if(r4ProjF&&sl.projId!==r4ProjF)return;
      if(r4MonF&&!(sl.bookingDate&&sl.bookingDate.startsWith(r4MonF)))return;
      var mon=sl.bookingDate?sl.bookingDate.substr(0,7):'';
      var chainC=sl.commissions&&sl.commissions.find(function(c){return c.id===assoc.id;});
      var defC=sl.defCommissions&&sl.defCommissions.find(function(c){return c.id===assoc.id;});

    });

function expBroLeg(){
  if(!window.XLSX){toast('XLSX library not loaded',false);return;}
  var wb=XLSX.utils.book_new();

  // Single sheet — Associate+Plot ke hisaab se ek row, sirf total amount
  // Key: assocId + '|' + saleId → ek row
  var rowMap={};
  D.sales.forEach(function(sl){
    if(r4ProjF&&sl.projId!==r4ProjF)return;
    var mon=sl.bookingDate?sl.bookingDate.substr(0,7):'—';
    if(r4MonF&&!mon.startsWith(r4MonF))return;

    // Chain commissions
    if(sl.commissions)sl.commissions.forEach(function(c){
      if(!c.total||c.total<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;})||{};
      if(r4SecF&&(a.location||'').trim()!==r4SecF)return;
      if(r4LegAssocF&&c.id!==r4LegAssocF)return;
      var key=c.id+'|'+sl.id;
      if(!rowMap[key])rowMap[key]={mon:mon,name:c.name,phone:a.phone||'',rera:a.rera||'',pan:a.pan||'',loc:a.location||'',proj:sl.projName,plot:sl.plotNo,amount:0};
      rowMap[key].amount+=c.total;
    });
    // Defence commissions — add to same row if same assoc+sale
    if(sl.defCommissions)sl.defCommissions.forEach(function(c){
      if(!c.amount||c.amount<=0)return;
      var a=D.associates.find(function(x){return x.id===c.id;})||{};
      if(r4SecF&&(a.location||'').trim()!==r4SecF)return;
      if(r4LegAssocF&&c.id!==r4LegAssocF)return;
      var key=c.id+'|'+sl.id;
      if(!rowMap[key])rowMap[key]={mon:mon,name:c.name,phone:a.phone||'',rera:a.rera||'',pan:a.pan||'',loc:a.location||'',proj:sl.projName,plot:sl.plotNo,amount:0};
      rowMap[key].amount+=c.amount;
    });
  });

  var dataRows=Object.values(rowMap).filter(function(r){return r.amount>0;});
  if(!dataRows.length){toast('No data found for export!',false);return;}

  // Sort: month → associate name → project
  dataRows.sort(function(a,b){
    if(a.mon!==b.mon)return a.mon<b.mon?-1:1;
    if(a.name!==b.name)return a.name<b.name?-1:1;
    return a.proj<b.proj?-1:1;
  });

  var rows=[['#','Month','Associate Name','Phone','RERA No','PAN','Location / Sector','Project Name','Plot No','Amount (Rs.)']];
  dataRows.forEach(function(r,i){
    rows.push([i+1,r.mon,r.name,r.phone,r.rera,r.pan,r.loc,r.proj,r.plot,r.amount]);
  });

  // Grand total row
  var grandTotal=dataRows.reduce(function(s,r){return s+r.amount;},0);
  rows.push(['','','GRAND TOTAL','','','','','','',grandTotal]);

  var ws=XLSX.utils.aoa_to_sheet(rows);
  xlStyle(wb,ws,[{wch:4},{wch:10},{wch:26},{wch:14},{wch:18},{wch:13},{wch:16},{wch:24},{wch:10},{wch:16}]);
  XLSX.utils.book_append_sheet(wb,ws,'Brokerage Detail');

  var fname='TrueStars_Brokerage'
    +(r4ProjF?'_'+((D.projects.find(function(p){return p.id===r4ProjF;})||{}).name||'').replace(/[^a-zA-Z0-9]/g,'_'):'')
    +(r4MonF?'_'+r4MonF:'')
    +(r4SecF?'_'+r4SecF.replace(/[^a-zA-Z0-9]/g,'_'):'')
    +'.xlsx';
  XLSX.writeFile(wb,fname);
  toast('Excel ready! '+dataRows.length+' rows — Filter by Month/Associate/Project/Plot \uD83D\uDCCA');
}

// SEARCH

// CAMPAIGNS / OFFERS

function calcOfferStats(offer){
  // Returns array of {assocId, assocName, projectResults, qualifiedCount, rewardLevel}
  var today=new Date(); today.setHours(0,0,0,0);
  var start=new Date(offer.startDate); start.setHours(0,0,0,0);
  var end=new Date(offer.endDate); end.setHours(23,59,59,999);

  // Filter sales in date range
  var sales=D.sales.filter(function(s){
    if(!s.bookingDate)return false;
    var bd=new Date(s.bookingDate);
    return bd>=start && bd<=end;
  });

  // Get all associates who made direct sales
  var assocMap={};
  D.associates.forEach(function(a){
    assocMap[a.id]={id:a.id,name:a.name,projSales:{},salesList:[]};
  });

  sales.forEach(function(s){
    if(!s.sellerId)return;
    var proj=D.projects.find(function(p){return p.id===s.projId;});
    if(!proj)return;

    // Find plot gaj — use plotGaj saved on sale, fallback to plot lookup
    var gaj=s.plotGaj||0;
    if(!gaj){
      proj.plots=proj.plots||[];
      var pl=proj.plots.find(function(p){return p.id===s.plotId;});
      gaj=pl?(pl.saleableGaj||pl.sizeGaj||0):0;
    }

    // Only count if offer covers this project
    var covered=false;
    if(offer.condType==='combined'){
      covered=true;
    } else {
      covered=(offer.projects||[]).some(function(op){return op.projId===s.projId;});
    }
    if(!covered)return;

    if(!assocMap[s.sellerId])assocMap[s.sellerId]={id:s.sellerId,name:s.sellerName||s.sellerId,projSales:{},salesList:[]};
    if(!assocMap[s.sellerId].projSales[s.projId])assocMap[s.sellerId].projSales[s.projId]={plots:0,gaj:0,projName:proj.name,projId:s.projId};
    assocMap[s.sellerId].projSales[s.projId].plots++;
    assocMap[s.sellerId].projSales[s.projId].gaj+=Number(gaj);
    assocMap[s.sellerId].salesList.push({projName:proj.name,plotNo:s.plotNo||'—',gaj:Number(gaj),bookingDate:s.bookingDate||'—',closeDate:s.closeDate||'—'});
  });

  // Calculate results per associate
  var results=[];
  Object.values(assocMap).forEach(function(a){
    var qualifiedProjects=0;
    var totalPlots=0, totalGaj=0;
    var projResults=[];

    if(offer.condType==='combined'){
      // All projects combined
      Object.values(a.projSales).forEach(function(ps){
        totalPlots+=ps.plots; totalGaj+=ps.gaj;
      });
      // Check if combined meets ANY level condition
      offer.levels.forEach(function(lv){
        var plotOk=lv.plots>0?totalPlots>=lv.plots:false;
        var gajOk=lv.gaj>0?totalGaj>=lv.gaj:false;
        if(plotOk||gajOk)qualifiedProjects=1;
      });
      projResults=[{label:'All Projects',plots:totalPlots,gaj:totalGaj,qualifies:qualifiedProjects>0}];
    } else {
      // Per project — each project has its own levels
      offer.projects.forEach(function(op){
        var ps=a.projSales[op.projId]||{plots:0,gaj:0,projName:op.projName||op.projId};
        totalPlots+=ps.plots; totalGaj+=ps.gaj;
        // Find highest level this associate qualifies for in this project
        var projLevels=(op.levels||[]).slice().sort(function(x,y){
          return ((y.plots||0)+(y.gaj||0))-((x.plots||0)+(x.gaj||0));
        });
        var projReward=null;
        for(var pi=0;pi<projLevels.length;pi++){
          var plv=projLevels[pi];
          var plotOk=plv.plots>0?ps.plots>=plv.plots:false;
          var gajOk=plv.gaj>0?ps.gaj>=plv.gaj:false;
          if(plotOk||gajOk){projReward=plv;break;}
        }
        if(projReward)qualifiedProjects++;
        projResults.push({
          label:ps.projName||op.projName,
          projId:op.projId,
          plots:ps.plots,
          gaj:Math.round(ps.gaj),
          levels:op.levels||[],
          projReward:projReward,
          qualifies:!!projReward
        });
      });
    }

    // Determine overall reward level
    var rewardLevel=null;
    if(offer.condType==='combined'){
      var sortedLevels=(offer.levels||[]).slice().sort(function(a,b){
        return ((b.plots||0)+(b.gaj||0))-((a.plots||0)+(a.gaj||0));
      });
      for(var i=0;i<sortedLevels.length;i++){
        var lv=sortedLevels[i];
        var plotOk2=lv.plots>0?totalPlots>=lv.plots:false;
        var gajOk2=lv.gaj>0?totalGaj>=lv.gaj:false;
        if(plotOk2||gajOk2){rewardLevel=lv;break;}
      }
    } else {
      // Per project: collect all earned rewards across projects
      var allRewards=[];
      projResults.forEach(function(pr){if(pr.projReward)allRewards.push({reward:pr.projReward.reward,proj:pr.label});});
      if(allRewards.length>0)rewardLevel={reward:allRewards.map(function(r){return r.reward;}).join(' + '),rewards:allRewards};
    }

    if(totalPlots>0||totalGaj>0||qualifiedProjects>0){
      results.push({
        id:a.id,name:a.name,
        qualifiedProjects:qualifiedProjects,
        totalPlots:totalPlots,totalGaj:Math.round(totalGaj),
        projResults:projResults,
        rewardLevel:rewardLevel,
        salesList:a.salesList||[]
      });
    }
  });

  // Sort: qualified first, then by gaj
  results.sort(function(a,b){
    if(b.qualifiedProjects!==a.qualifiedProjects)return b.qualifiedProjects-a.qualifiedProjects;
    return b.totalGaj-a.totalGaj;
  });
  return results;
}

window.saveOffer=function(existingId){
  var name=(document.getElementById('ofNm')||{}).value||'';
  var startDate=(document.getElementById('ofSt')||{}).value||'';
  var endDate=(document.getElementById('ofEd')||{}).value||'';
  if(!name.trim()||!startDate||!endDate){toast('Campaign Name, Start & End Date are required!',false);return;}
  if(new Date(endDate)<new Date(startDate)){toast('End date cannot be before start date!',false);return;}

  var condType=document.getElementById('ofCTc')&&document.getElementById('ofCTc').checked?'combined':'per_project';

  // Read projects (per_project: each project has its own levels)
  var projects=[];
  var levels=[];

  if(condType==='per_project'){
    var pRows=document.getElementById('ofProjList');
    if(pRows){
      Array.from(pRows.children).forEach(function(row,i){
        var pjEl=document.getElementById('ofPrj_'+i);
        if(!pjEl||!pjEl.value)return;
        var proj=D.projects.find(function(p){return p.id===pjEl.value;});
        // Read levels for this project
        var projLevels=[];
        var lvWrap=document.getElementById('ofprlvwrap_'+i);
        if(lvWrap){
          Array.from(lvWrap.children).forEach(function(lrow,li){
            var plEl=document.getElementById('ofPrPl_'+i+'_'+li);
            var gjEl=document.getElementById('ofPrGaj_'+i+'_'+li);
            var rwEl=document.getElementById('ofPrRw_'+i+'_'+li);
            if(!rwEl||!rwEl.value.trim())return;
            projLevels.push({
              plots:parseInt(plEl&&plEl.value?plEl.value:0)||0,
              gaj:parseInt(gjEl&&gjEl.value?gjEl.value:0)||0,
              reward:rwEl.value.trim()
            });
          });
        }
        if(projLevels.length===0)return;
        projects.push({
          projId:pjEl.value,
          projName:proj?proj.name:pjEl.value,
          levels:projLevels
        });
      });
    }
    if(projects.length===0){toast('Add at least one project with reward levels!',false);return;}
  } else {
    // Combined: read from ofLevelList
    var lvRows=document.getElementById('ofLevelList');
    if(lvRows){
      Array.from(lvRows.children).forEach(function(row,i){
        var rwEl=document.getElementById('ofLvRw_'+i);
        if(!rwEl||!rwEl.value.trim())return;
        var lv={reward:rwEl.value.trim()};
        var plEl=document.getElementById('ofLvPl_'+i);
        var gjEl=document.getElementById('ofLvGaj_'+i);
        lv.plots=parseInt(plEl&&plEl.value?plEl.value:0)||0;
        lv.gaj=parseInt(gjEl&&gjEl.value?gjEl.value:0)||0;
        if(!lv.plots&&!lv.gaj)return;
        levels.push(lv);
      });
    }
    if(levels.length===0){toast('Add at least one reward level!',false);return;}
  }

  if(!D.offers)D.offers=[];
  if(existingId){
    var idx=D.offers.findIndex(function(o){return o.id===existingId;});
    if(idx>=0){
      D.offers[idx]=Object.assign(D.offers[idx],{name:name.trim(),startDate:startDate,endDate:endDate,condType:condType,projects:projects,levels:levels});
      logAct('Campaign Updated: '+name);
      toast('Campaign updated successfully! ✓');
    }
  } else {
    D.offers.push({id:uid(),name:name.trim(),startDate:startDate,endDate:endDate,condType:condType,projects:projects,levels:levels});
    logAct('New Campaign Created: '+name);
    toast('Campaign created successfully! ✓');
  }
  saveD();
  ofView='list';render();
};

function pgSearch(){
  var q=searchQ.toLowerCase();
  if(!q)return '<div class="empty">Kuch type karein search karne for</div>';
  var aRes=D.associates.filter(function(a){return a.name.toLowerCase().includes(q)||(a.phone||'').includes(q)||(a.rera||'').toLowerCase().includes(q)||(a.code||'').toLowerCase().includes(q);});
  var pRes=[];
  D.projects.forEach(function(p){if(p.plots)p.plots.forEach(function(pl){if(pl.plotNo.toLowerCase().includes(q)||(pl.facing||'').toLowerCase().includes(q))pRes.push(Object.assign({},pl,{projName:p.name}));});});
  var sRes=D.sales.filter(function(s){return s.projName.toLowerCase().includes(q)||s.plotNo.toLowerCase().includes(q)||(s.partyName||'').toLowerCase().includes(q)||s.sellerName.toLowerCase().includes(q);});
  
  var html='<h2 style="font-size:15px;font-weight:700;margin-bottom:12px">🔍 Search: "'+searchQ+'"</h2>';
  if(aRes.length){
    html+='<div class="card"><div class="ct">👥 Associates ('+aRes.length+')</div><div class="tw"><table><thead><tr><th>Name</th><th>Phone</th><th>RERA</th><th>Gaj</th><th>Slab</th><th>Designation</th></tr></thead><tbody>';
    aRes.forEach(function(a){html+='<tr><td><b>'+a.name+'</b></td><td>'+(a.phone||'—')+'</td><td>'+(a.rera||'—')+'</td><td><b>'+a.totalGaj+'</b></td><td style="color:var(--bl);font-weight:700">₹'+rOf(a.totalGaj)+'/gaj</td><td>'+dOf(a.totalGaj)+'</td></tr>';});
    html+='</tbody></table></div></div>';
  }
  if(pRes.length){
    html+='<div class="card"><div class="ct">🗺️ Plots ('+pRes.length+')</div><div class="tw"><table><thead><tr><th>Project</th><th>Plot No</th><th>Gaj</th><th>Saleable</th><th>Facing</th><th>Status</th></tr></thead><tbody>';
    pRes.forEach(function(pl){html+='<tr><td><b>'+pl.projName+'</b></td><td>'+pl.plotNo+'</td><td>'+pl.sizeGaj+'</td><td style="color:var(--pu);font-weight:700">'+(pl.saleableGaj!=null?pl.saleableGaj:pl.sizeGaj)+'</td><td>'+(pl.facing||'—')+'</td><td>'+statusBadge(pl.status)+'</td></tr>';});
    html+='</tbody></table></div></div>';
  }
  if(sRes.length){
    html+='<div class="card"><div class="ct">💰 Sales ('+sRes.length+')</div><div class="tw"><table><thead><tr><th>Project</th><th>Plot</th><th>Buyer</th><th>Seller</th><th>Gaj</th><th>Date</th><th>Total ₹</th></tr></thead><tbody>';
    sRes.forEach(function(s){html+='<tr><td><b>'+s.projName+'</b></td><td>'+s.plotNo+'</td><td>'+(s.partyName||'—')+'</td><td>'+s.sellerName+'</td><td>'+s.plotGaj+'</td><td>'+(s.bookingDate||'—')+'</td><td style="color:var(--gr);font-weight:700">₹'+fmt((s.chainTotal||0)+(s.defTotal||0))+'</td></tr>';});
    html+='</tbody></table></div></div>';
  }
  if(!aRes.length&&!pRes.length&&!sRes.length)html+='<div class="empty">No results found for "'+searchQ+'"</div>';
  return html;
}

            var nl=names[ni].toLowerCase().replace(/\s/g,'_');
            for(var ki=0;ki<keys.length;ki++){

        toast(msg);pmMode='list';render();
      }catch(err){toast('❌ File error: '+err.message+' — . Please use .xlsx or .csv file.',false);}

// ── Excel Style Helper ───────────────────────────────
function xlStyle(wb,ws,cols,headerColor){
  // Column widths
  if(cols)ws['!cols']=cols;
  // Row height: header=22, data=18
  var range=XLSX.utils.decode_range(ws['!ref']||'A1');
  var rows=[];
  for(var r=0;r<=range.e.r;r++)rows.push({hpt:r===0?22:18});
  ws['!rows']=rows;
  // Header bold + background
  var hc=headerColor||'1A6FC4';
  for(var col=range.s.c;col<=range.e.c;col++){
    var addr=XLSX.utils.encode_cell({r:0,c:col});
    if(!ws[addr])continue;
    ws[addr].s={
      font:{bold:true,color:{rgb:'FFFFFF'},sz:11},
      fill:{fgColor:{rgb:hc},patternType:'solid'},
      alignment:{horizontal:'center',vertical:'center',wrapText:false},
      border:{bottom:{style:'medium',color:{rgb:'FFFFFF'}}}
    };
  }
  // Data rows alternating + alignment
  for(var r2=1;r2<=range.e.r;r2++){
    var fillRgb=r2%2===0?'EEF4FB':'FFFFFF';
    for(var col2=range.s.c;col2<=range.e.c;col2++){
      var addr2=XLSX.utils.encode_cell({r:r2,c:col2});
      if(!ws[addr2])ws[addr2]={t:'s',v:''};
      ws[addr2].s={
        fill:{fgColor:{rgb:fillRgb},patternType:'solid'},
        alignment:{vertical:'center',wrapText:false},
        border:{bottom:{style:'thin',color:{rgb:'D0D8E8'}},right:{style:'thin',color:{rgb:'D0D8E8'}}}
      };
    }
  }
  // Autofilter
  var lastColLetter=col<=26?String.fromCharCode(64+range.e.c+1):'A'+String.fromCharCode(64+(range.e.c-25));
  ws['!autofilter']={ref:'A1:'+lastColLetter+'1'};
  // Freeze first row
  ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
}

  if(!window.XLSX){toast('XLSX library not loaded — please open via internet!',false);return;}

  });
  var ws1=XLSX.utils.aoa_to_sheet(s1);
  xlStyle(wb,ws1,[{wch:4},{wch:7},{wch:22},{wch:20},{wch:14},{wch:13},{wch:28},{wch:18},{wch:14},{wch:13},{wch:10},{wch:14},{wch:26},{wch:22},{wch:22},{wch:18},{wch:14},{wch:22},{wch:11},{wch:11},{wch:22},{wch:8}]);
  XLSX.utils.book_append_sheet(wb,ws1,'All Associates');

  // ── Sheet 2: Leg Hierarchy ──
  // Find max chain depth across all associates
  var maxDepth=0;
  D.associates.forEach(function(a){
    var d=getChain(a.id).length;
    if(d>maxDepth)maxDepth=d;
  });

  // Header row:
  var hdr=[
    'Associate Name','Phone','RERA No','Code','Location',
    'Total Gaj','Slab','Designation',
    'Personal Sale Gaj','Team Sale Gaj','Other Sale Gaj','Total Sale Gaj'
  ];
  for(var d=1;d<=maxDepth;d++) hdr.push('A-'+String(d).padStart(2,'0'));
  var s2=[hdr];

  // Each associate = one row
  D.associates.forEach(function(a){
    var chainArr=getChain(a.id).slice().reverse();

    // Personal sale gaj = direct sales by this associate
    var personalSale=D.sales.filter(function(s){return s.sellerId===a.id;}).reduce(function(t,s){return t+s.plotGaj;},0);

    // Team sale gaj = sales in chain where this associate got commission but is NOT the seller
    var teamSale=D.sales.filter(function(s){
      return s.sellerId!==a.id && s.commissions&&s.commissions.some(function(c){return c.id===a.id;});
    }).reduce(function(t,s){return t+s.plotGaj;},0);

    var row=[
      a.name,
      a.phone||'',
      a.rera||'',
      a.code||'',
      a.location||'',
      a.totalGaj,
      rOf(a.totalGaj),
      dOf(a.totalGaj),
      personalSale,
      teamSale,
      Math.max(0,(a.totalGaj||0)-(a.salesGaj||0)),
      personalSale+teamSale
    ];
    for(var d=1;d<=maxDepth;d++){
      var member=chainArr[d-1];
      row.push(member?member.name:'');
    }
    s2.push(row);
  });

  var ws2=XLSX.utils.aoa_to_sheet(s2);

  var cols2=[
    {wch:24},{wch:14},{wch:18},{wch:12},{wch:14},
    {wch:10},{wch:10},{wch:22},
    {wch:16},{wch:14},{wch:14},{wch:12}
  ];
  for(var d=0;d<maxDepth;d++) cols2.push({wch:22});
  xlStyle(wb,ws2,cols2);
  XLSX.utils.book_append_sheet(wb,ws2,'Leg Hierarchy');

  XLSX.writeFile(wb,'TrueStars_Associate_Info.xlsx');
  toast('TrueStars_Associate_Info.xlsx downloading! 📊');
}

function expExcel(){

  var wb=XLSX.utils.book_new();
  function buildTree(pid,lv){return D.associates.filter(function(a){return pid===null?!a.parentId:a.parentId===pid;}).reduce(function(acc,a){return acc.concat([Object.assign({},a,{_l:lv})],buildTree(a.id,lv+1));},[]); }
  var tree=buildTree(null,0);
  var MAX_LEG=40;
  var h1=['S.NO.','Code','Location','Status','Name','RERA','Phone','Level','Team'];
  for(var ci=1;ci<=12;ci++)h1.push('A-'+String(ci).padStart(2,'0'));
  h1.push('Personal Sale Gaj','Other Sale Gaj','Total Team Gaj','Rate/SqYd','Slab','SELF');
  for(var li=1;li<=MAX_LEG;li++)h1.push('LEG-'+li);
  h1.push('TOTAL','DIFF','MAX','Required (25%)','Exit Area','Diff Req-Exit','Balanced?');
  var s1rows=[h1];
  tree.forEach(function(a,idx){
    var chainArr=getChain(a.id);var chainFromTop=chainArr.slice().reverse();
    var lv=chainFromTop.length;
    var tname=chainFromTop[0]?chainFromTop[0].name:'—';
    var chainCols=[];for(var i=0;i<12;i++)chainCols.push(chainFromTop[i]?chainFromTop[i].name:'');
    var kids=D.associates.filter(function(x){return x.parentId===a.id;});
    var legGajs=[];for(var i=0;i<MAX_LEG;i++)legGajs.push(kids[i]?subtreeGaj(kids[i].id):0);
    var selfG=selfGaj(a.id);
    var teamTotal=subtreeGaj(a.id);
    var totalAll=selfG+legGajs.reduce(function(s,v){return s+v;},0);
    var maxLeg=legGajs.length>0?Math.max.apply(null,legGajs):0;
    var reqArea=totalAll*0.25;
    var exitArea=totalAll-maxLeg;
    var diffRE=reqArea-exitArea;
    var otherG=Math.max(0,(a.totalGaj||0)-(a.salesGaj||0));var row=[idx+1,a.code||'NA-'+(idx+1),a.location||'',a.totalGaj>0?'ACTIVE':'INACTIVE',a.name,a.rera||'NOT APPLICABLE',a.phone||'','A-'+String(lv).padStart(2,'0'),tname].concat(chainCols).concat([selfG,otherG,teamTotal,rOf(a.totalGaj),rOf(a.totalGaj),selfG]).concat(legGajs).concat([totalAll,0,maxLeg,reqArea,exitArea,diffRE,exitArea>=reqArea?'YES':'NO']);
    s1rows.push(row);
  });
  var ws1=XLSX.utils.aoa_to_sheet(s1rows);
  xlStyle(wb,ws1,null);
  XLSX.utils.book_append_sheet(wb,ws1,'Main Report');
  var s2rows=[['Root Associate','Member Name','Member Level','Member Phone','Member RERA','Designation','Member Gaj','Slab','Direct Sales','Direct Gaj','Chain Sales','Chain Gaj','Total Commission']];
  D.associates.filter(function(a){return !a.parentId;}).forEach(function(root){
    var dl=getDownline(root.id);
    dl.forEach(function(member){
      var ms=D.sales.filter(function(s){return s.commissions&&s.commissions.some(function(c){return c.id===member.id;});});
      var dSl=ms.filter(function(s){return s.sellerId===member.id;});
      var cSl=ms.filter(function(s){return s.sellerId!==member.id;});
      var dG=dSl.reduce(function(s,sl){return s+sl.plotGaj;},0);
      var cG=cSl.reduce(function(s,sl){return s+sl.plotGaj;},0);
      var tc=ms.reduce(function(s,sl){var c=sl.commissions&&sl.commissions.find(function(c){return c.id===member.id;});return s+(c?c.total:0);},0);
      var td=D.sales.reduce(function(s,sl){var c=sl.defCommissions&&sl.defCommissions.find(function(c){return c.id===member.id;});return s+(c?c.amount:0);},0);
      s2rows.push([root.name,'  '.repeat(member._d)+(member._d>0?'↳ ':'')+member.name,'L'+(member._d+1),member.phone||'',member.rera||'',dOf(member.totalGaj),member.totalGaj,rOf(member.totalGaj),dSl.length,dG,cSl.length,cG,tc+td]);
    });
    s2rows.push(Array(13).fill(''));
  });
  var ws2=XLSX.utils.aoa_to_sheet(s2rows);
  xlStyle(wb,ws2,[{wch:22},{wch:28},{wch:8},{wch:14},{wch:18},{wch:22},{wch:11},{wch:11},{wch:13},{wch:11},{wch:13},{wch:11},{wch:16}]);
  XLSX.utils.book_append_sheet(wb,ws2,'Team Detail');
  var s3rows=[['S.NO.','Date','Project','Plot','Sale Gaj','Buyer','Seller','Booking','Close','Days','Brokerage ₹']];
  D.sales.forEach(function(sl,i){
    var d2=daysBetween(sl.bookingDate,sl.closeDate);
    s3rows.push([i+1,sl.createdAt?sl.createdAt.split('T')[0]:'',sl.projName,sl.plotNo,sl.plotGaj,sl.partyName||'',sl.sellerName,sl.bookingDate||'',sl.closeDate||'',d2!==null?d2:'',(sl.chainTotal||0)+(sl.defTotal||0)]);
  });
  var ws3=XLSX.utils.aoa_to_sheet(s3rows);
  xlStyle(wb,ws3,[{wch:5},{wch:13},{wch:22},{wch:10},{wch:11},{wch:22},{wch:22},{wch:13},{wch:13},{wch:6},{wch:16}]);

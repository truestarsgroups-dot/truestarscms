var _fbDB=null, _fbReady=false;

function fbStatus(s){
  // Update settings badge too
  var badge=document.getElementById('fbStatusBadge');
  if(badge){
    if(s==='ok'){badge.style.background='var(--grb)';badge.style.color='var(--gr)';badge.textContent='☁️ Firebase Synced';}
    else if(s==='err'){badge.style.background='var(--reb)';badge.style.color='var(--re)';badge.textContent='⚠️ Firebase Error';}
    else if(s==='sync'){badge.style.background='var(--amb)';badge.style.color='var(--am)';badge.textContent='🔄 Syncing...';}
    else{badge.style.background='var(--bg2)';badge.style.color='var(--t2)';badge.textContent='📴 Offline';}
  }
  var el=document.getElementById('fbStatus');if(!el)return;
  var m={ok:['#35a778','☁️ Synced'],sync:['#ef9f27','🔄 Syncing...'],err:['#e24b4a','⚠️ Offline']};
  var r=m[s]||['#888',''];el.style.color=r[0];el.textContent=r[1];
}

function fbSave(ts){
  if(!_fbReady||!_fbDB)return;
  ts=ts||Date.now();
  fbStatus('sync');
  var clean=JSON.parse(JSON.stringify({projects:D.projects||[],associates:D.associates||[],sales:D.sales||[],offers:D.offers||[],deleted:D.deleted||{associates:[],sales:[],projects:[]},transfers:D.transfers||[],ts:ts}));
  _fbDB.collection('appdata').doc('main').set(clean)
    .then(function(){fbStatus('ok');})
    .catch(function(e){fbStatus('err');console.error('fbSave error:',e.code,e.message);});
}

function fbLoadIfEmpty(){
  if(!_fbReady||!_fbDB){return;}
  fbStatus('sync');
  _fbDB.collection('appdata').doc('main').get()
    .then(function(doc){
      if(!doc.exists){
        // Firebase mein kuch nahi — local data push karo
        if(D.projects.length||D.associates.length||D.sales.length){
          fbSave();
        } else {
          fbStatus('ok');
        }
        return;
      }
      var r=doc.data();
      if(!r){fbStatus('ok');return;}

      var remoteTs=r.ts||0;
      var localTs=window._localTs||0;


      if(remoteTs>localTs){
        // Firebase newer hai — Firebase ka data use karo
        if(r.projects)D.projects=r.projects;
        if(r.associates)D.associates=r.associates;
        if(r.sales)D.sales=r.sales;
        D.offers=r.offers||[];
        if(r.deleted)D.deleted=r.deleted;else if(!D.deleted)D.deleted={associates:[],sales:[],projects:[]};
        if(r.transfers)D.transfers=r.transfers;else if(!D.transfers)D.transfers=[];
        window._localTs=remoteTs;
        try{localStorage.setItem(SK,JSON.stringify(Object.assign({},D,{_ts:remoteTs})));}catch(e){}
        fbStatus('ok');
        if(SESSION)render();
      } else if(localTs>remoteTs){
        // Local newer hai — local data Firebase pe push karo
        fbSave();
      } else {
        // Same — kuch nahi karna
        fbStatus('ok');
      }
    })
    .catch(function(e){
      fbStatus('err');
      console.warn('fbLoad error:',e.message);
    });
}

window.importAssocExcel=function(input){
  if(!isOnline()){toast('📴 Internet nahi hai!',false);return;}
  var file=input.files[0];
  if(!file){return;}
  if(!window.XLSX){toast('XLSX library load nahi hua!',false);return;}
  input.value=String();

  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:''});

      if(!rows.length){toast('File mein koi data nahi!',false);return;}

      // Column mapping — flexible
      function findCol(row,keys){
        var k=Object.keys(row);
        for(var i=0;i<keys.length;i++){
          var found=k.find(function(c){return c.toLowerCase().replace(/[^a-z0-9]/g,'').includes(keys[i].toLowerCase().replace(/[^a-z0-9]/g,''));});
          if(found)return found;
        }
        return null;
      }

      var r0=rows[0];
      var colName=findCol(r0,['fullname','name']);
      if(!colName){toast('❌ "Full Name" column nahi mila!',false);return;}

      var added=0, skipped=0, errors=[];
      var newAssocs=[];

      rows.forEach(function(row,i){
        var name=(row[colName]||'').toString().trim();
        if(!name){skipped++;return;}

        // Check required fields
        var colFather=findCol(row,['father','husband','fathername']);
        var colPhone=findCol(row,['phone','mobile','phoneno']);
        var colPan=findCol(row,['pan','panno']);
        var colBnm=findCol(row,['bankingname','accountholder','bankingname']);
        var colBnk=findCol(row,['bankname','bank']);
        var colAc=findCol(row,['accountno','accno','account']);
        var colIfs=findCol(row,['ifsc','ifsccode']);

        var father=colFather?(row[colFather]||'').toString().trim():'';
        var phone=colPhone?(row[colPhone]||'').toString().trim():'';
        var pan=colPan?(row[colPan]||'').toString().trim():'';
        var bnm=colBnm?(row[colBnm]||'').toString().trim():'';
        var bnk=colBnk?(row[colBnk]||'').toString().trim():'';
        var ac=colAc?(row[colAc]||'').toString().trim():'';
        var ifs=colIfs?(row[colIfs]||'').toString().trim():'';

        // Check duplicate phone
        var impPhone=(phone||'').replace(/\D/g,'');
        if(impPhone){
          var existingPhone=D.associates.find(function(x){return x.phone&&x.phone.replace(/\D/g,'')===impPhone;});
          if(existingPhone){
            errors.push('Row '+(i+2)+' ('+name+'): Phone '+phone+' already registered to '+existingPhone.name);
            skipped++;return;
          }
        }
        // Validate required
        var missing=[];
        if(!father)missing.push('Father Name');
        if(!phone)missing.push('Phone');
        if(!pan)missing.push('PAN');
        if(!bnm)missing.push('Banking Name');
        if(!bnk)missing.push('Bank Name');
        if(!ac)missing.push('Account No');
        if(!ifs)missing.push('IFSC');

        if(missing.length>0){
          errors.push('Row '+(i+2)+' ('+name+'): '+missing.join(', ')+' missing');
          skipped++;
          return;
        }

        // Optional fields
        var colRera=findCol(row,['rera','rerano']);
        var colAdh=findCol(row,['aadhaar','aadhar']);
        var colCode=findCol(row,['code','associatecode']);
        var colLoc=findCol(row,['location','city']);
        var colEm=findCol(row,['email']);
        var colAdr=findCol(row,['address']);
        var colJd=findCol(row,['joiningdate','joining']);

        newAssocs.push({
          id:uid(),
          name:name,
          fatherName:father,
          phone:phone,
          pan:pan,
          bankingName:bnm,
          bankName:bnk,
          accNo:ac,
          ifsc:ifs,
          rera:colRera?(row[colRera]||'').toString().trim():'',
          aadhaar:colAdh?(row[colAdh]||'').toString().trim():'',
          code:colCode?(row[colCode]||'').toString().trim():'',
          location:colLoc?(row[colLoc]||'').toString().trim():'',
          email:colEm?(row[colEm]||'').toString().trim():'',
          address:colAdr?(row[colAdr]||'').toString().trim():'',
          joiningDate:colJd?(row[colJd]||'').toString().trim():'',
          parentId:null,
          totalGaj:0,
          createdAt:new Date().toISOString()
        });
        added++;
      });

      if(added===0){
        var msg='Koi associate import nahi hua!';
        if(errors.length)msg+=' Errors: '+errors.slice(0,3).join(' | ');
        toast(msg,false);
        return;
      }

window.showAssocProfile=function(id){
  var a=D.associates.find(function(x){return x.id===id;});
  if(!a)return;

  // Get level
  var level=0,cur=a;
  while(cur&&cur.parentId){
    level++;
    cur=D.associates.find(function(x){return x.id===cur.parentId;});
  }

  // Top leader
  var topLeader=getTopLeader(a.id);
  var isTopLeader=!a.parentId;

  // Direct downline
  var directDown=D.associates.filter(function(x){return x.parentId===a.id;});
  // Total downline
  function countDown(aid){
    var kids=D.associates.filter(function(x){return x.parentId===aid;});
    return kids.reduce(function(t,k){return t+1+countDown(k.id);},0);
  }
  var totalDown=countDown(a.id);

  // Personal sales
  var personalSales=D.sales.filter(function(s){return s.sellerId===a.id;});
  var personalGaj=personalSales.reduce(function(t,s){return t+(s.plotGaj||0);},0);

  // Commission earned
  var totalComm=D.sales.reduce(function(t,s){
    var c=(s.commissions||[]).find(function(c){return c.id===a.id;});
    if(c)t+=c.total||0;
    var d=(s.defCommissions||[]).find(function(c){return c.id===a.id;});
    if(d)t+=d.total||0;
    return t;
  },0);

  // Rank among all associates by totalGaj
  var sorted=D.associates.slice().sort(function(x,y){return (y.totalGaj||0)-(x.totalGaj||0);});
  var rank=sorted.findIndex(function(x){return x.id===a.id;})+1;

  // Active campaigns
  var today=new Date();today.setHours(0,0,0,0);
  var activeCamps=(D.offers||[]).filter(function(o){
    return today>=new Date(o.startDate)&&today<=new Date(o.endDate);
  });

  var html='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">'
    +'<div>'
    +'<div style="font-size:18px;font-weight:700;color:var(--tx)">'+esc(a.name)+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:5px;flex-wrap:wrap">'
    +'<span class="badge bbl2">L'+(level+1)+'</span>'
    +(isTopLeader?'<span class="badge" style="background:var(--grb);color:var(--gr)">🏆 Team Leader</span>':'<span style="font-size:12px;color:var(--t2)">Team: <b>'+esc(topLeader?topLeader.name:'—')+'</b></span>')
    +(a.rera?'<span style="font-size:11px;color:var(--bl)">'+esc(a.rera)+'</span>':'')
    +'</div>'
    +'</div>'
    +'<button class="btn bgh bsm" onclick="closeM()">✕</button>'
    +'</div>';

  // Stats grid
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:700;color:var(--bl)">'+(a.totalGaj||0)+'</div><div style="font-size:11px;color:var(--t2)">Total Gaj</div></div>';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:700;color:var(--gr)">'+personalSales.length+'</div><div style="font-size:11px;color:var(--t2)">Direct Sales</div></div>';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:700;color:var(--am)">'+totalDown+'</div><div style="font-size:11px;color:var(--t2)">Downline</div></div>';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:700;color:var(--pu)">#'+rank+'</div><div style="font-size:11px;color:var(--t2)">Rank</div></div>';
  html+='</div>';

  // Commission
  html+='<div style="background:var(--grb);border:1px solid var(--gr);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">'
    +'<div><div style="font-size:12px;color:var(--gr);font-weight:700">💰 Total Commission Earned</div>'
    +'<div style="font-size:11px;color:var(--t2);margin-top:2px">Personal: '+personalGaj+' Sq.Yd</div></div>'
    +'<div style="font-size:20px;font-weight:700;color:var(--gr)">₹'+fmtL(totalComm)+'</div>'
    +'</div>';

  // Team info
  if(directDown.length>0){
    html+='<div style="background:var(--bg2);border-radius:8px;padding:10px 14px;margin-bottom:12px">'
      +'<div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:6px">👥 Direct Team ('+directDown.length+')</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">';
    directDown.slice(0,8).forEach(function(d){
      html+='<span style="background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:12px">'+esc(d.name)+'</span>';
    });
    if(directDown.length>8)html+='<span style="font-size:12px;color:var(--t2)">+'+( directDown.length-8)+' more</span>';
    html+='</div></div>';
  }

  // Active campaigns progress
  if(activeCamps.length>0){
    html+='<div style="background:var(--bg2);border-radius:8px;padding:10px 14px;margin-bottom:12px">'
      +'<div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:8px">🎯 Campaign Progress</div>';
    activeCamps.forEach(function(offer){
      var stats=calcOfferStats(offer);
      var aStats=stats.find(function(s){return s.id===a.id;});
      if(!aStats){html+='<div style="font-size:12px;color:var(--t3);margin-bottom:6px">'+esc(offer.name)+' — No sales yet</div>';return;}
      var qual=aStats.rewardLevel;
      html+='<div style="margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'
        +'<span><b>'+esc(offer.name)+'</b></span>'
        +(qual?'<span style="color:var(--gr);font-weight:700">🏆 '+esc(qual.reward)+'</span>':'<span style="color:var(--am)">'+aStats.totalGaj+' Sq.Yd</span>')
        +'</div></div>';
    });
    html+='</div>';
  }

  // Contact & Banking
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px 12px">'
    +'<div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Contact</div>'
    +(a.phone?'<div style="font-size:13px;font-weight:600">📞 '+esc(a.phone)+'</div>':'')
    +(a.pan?'<div style="font-size:12px;color:var(--t2);margin-top:3px">PAN: <b style="font-family:Courier New,monospace">'+esc(a.pan)+'</b></div>':'')
    +(a.joiningDate?'<div style="font-size:12px;color:var(--t2);margin-top:3px">Joined: '+esc(a.joiningDate)+'</div>':'')
    +'</div>';
  html+='<div style="background:var(--bg2);border-radius:8px;padding:10px 12px">'
    +'<div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Banking</div>'
    +(a.bankName?'<div style="font-size:12px;color:var(--t2)">'+esc(a.bankName)+'</div>':'')
    +(a.accNo?'<div style="font-size:12px;font-family:Courier New,monospace;font-weight:700;color:var(--tx)">'+esc(a.accNo)+'</div>':'')
    +(a.ifsc?'<div style="font-size:11px;color:var(--t2)">IFSC: <b style="font-family:Courier New,monospace">'+esc(a.ifsc)+'</b></div>':'')
    +'</div>';
  html+='</div>';

  // Action buttons
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  if(a.phone){
    var waNum=a.phone.replace(/\D/g,'');
    if(waNum.length===10)waNum='91'+waNum;
    html+='<a href="https://wa.me/'+waNum+'" target="_blank" class="btn bsm" style="background:#25D366;color:#fff;border:none;text-decoration:none">📱 WhatsApp</a>';
  }
  html+='<button class="btn bgh bsm" data-pid="'+a.id+'" onclick="printAssocCard(this.dataset.pid)">🖨️ Print</button>';
  html+='<button class="btn bgh bsm" onclick="closeM()">Close</button>';
  html+='</div>';

  openM(html);
};

    +'<div><span style="color:var(--t3)">Bank: </span>'+esc(a.bankName||'—')+'</div>'
    +'<div><span style="color:var(--t3)">A/C No: </span><b style="font-family:Courier New,monospace;font-size:13px">'+esc(a.accNo||'—')+'</b></div>'
    +'<div><span style="color:var(--t3)">IFSC: </span><b style="font-family:Courier New,monospace">'+esc(a.ifsc||'—')+'</b></div>'
    +'<div><span style="color:var(--t3)">Address: </span>'+esc(a.address||'—')+'</div>'
    +'</div></div>';
  html+='</div>';

  // Action buttons - NO Edit
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">';
  if(a.phone){
    html+='<a href="https://wa.me/'+waNum+'" target="_blank" class="btn bsm" style="background:#25D366;color:#fff;border:none;text-decoration:none;white-space:nowrap">📱 WhatsApp</a>';
  }
  html+='<button class="btn bgh bsm" onclick="closeM()">Close</button>';
  html+='</div>';

  openM(html);

};
